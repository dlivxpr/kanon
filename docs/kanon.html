<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Kanon — 个人项目推进 · 知识库与行动工作台</title>
  <style>
    :root {
      color-scheme: light;
      --shell: #11120f;
      --shell-soft: #22231e;
      --shell-hover: #2a2b25;
      --shell-text: #c6c8bf;
      --shell-muted: #76796f;
      --panel: #fdfdfb;
      --panel-raised: #ffffff;
      --text: #22231f;
      --text-body: #2d302b;
      --muted: #8b8e84;
      --faint: #b4b7ad;
      --line: #e8e9e2;
      --line-soft: #f0f1eb;
      --soft: #f5f5f1;
      --soft-hover: #ecece6;
      --accent: #ff4f4f;
      --accent-ink: #e04343;
      --accent-soft: #fff0ef;
      --yq-green: #00b96b;
      --yq-green-soft: #eaf9f1;
      --yellow: #d5ad36;
      --yellow-soft: #fff7df;
      --blue-soft: #edf2fb;
      --blue-ink: #496285;
      --purple-soft: #f2ecfb;
      --purple-ink: #6e5694;
      --shadow: 0 26px 80px rgba(24, 32, 22, .24), 0 2px 8px rgba(0, 0, 0, .16);
      --font-scale: 1;
      --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --panel: #1b1c19;
      --panel-raised: #242521;
      --text: #efefe8;
      --text-body: #dedfd8;
      --muted: #8c8f84;
      --faint: #64675d;
      --line: #32342d;
      --line-soft: #282a24;
      --soft: #252621;
      --soft-hover: #30322b;
      --accent-ink: #ff6b6b;
      --accent-soft: #3b2422;
      --yq-green-soft: #1d3529;
      --yellow-soft: #3a331d;
      --blue-soft: #25303d;
      --blue-ink: #adc2de;
      --purple-soft: #31283f;
      --purple-ink: #c6b0e6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font-ui);
      font-size: calc(14px * var(--font-scale));
      color: var(--text);
      background: #ccd4c7;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [contenteditable]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .svg-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .icon.small { width: 14px; height: 14px; }
    .icon.tiny { width: 12px; height: 12px; }
    .icon.large { width: 21px; height: 21px; }

    /* Desktop & Window Shell (Woday Base) */
    .desktop {
      min-height: 100dvh;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at 18% 0%, rgba(241, 245, 234, .88), transparent 52%),
        radial-gradient(ellipse at 90% 90%, rgba(126, 149, 112, .45), transparent 54%),
        #ccd4c7;
    }
    .app-window {
      width: min(1760px, 100%);
      height: calc(100dvh - 28px);
      min-height: 640px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, .82);
      border-radius: 18px;
      background: var(--shell);
      box-shadow: var(--shadow);
    }

    /* Titlebar */
    .titlebar {
      height: 60px;
      flex: 0 0 60px;
      display: grid;
      grid-template-columns: 1fr minmax(300px, 520px) 1fr;
      align-items: center;
      gap: 16px;
      padding: 0 16px;
      color: var(--shell-text);
    }
    .titlebar-left, .titlebar-actions, .window-controls, .traffic-lights { display: flex; align-items: center; }
    .titlebar-left { gap: 14px; min-width: 0; }
    .traffic-lights { gap: 8px; }
    .traffic { width: 12px; height: 12px; border-radius: 50%; }
    .traffic.close { background: #ff5f57; }
    .traffic.minimize { background: #febc2e; }
    .traffic.zoom { background: #28c840; }
    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px 4px 6px;
      border-radius: 999px;
      background: #1d1e19;
      color: #f2f2ec;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -.2px;
    }
    .brand-dot {
      width: 18px;
      height: 18px;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
    }
    .window-controls { gap: 4px; }
    .titlebar-actions { justify-content: flex-end; gap: 5px; }
    .chrome-button {
      height: 34px;
      min-width: 34px;
      padding: 0 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 17px;
      color: #aeb1a7;
      font-size: 12px;
      transition: background .15s ease, color .15s ease;
    }
    .chrome-button.icon-only { width: 34px; padding: 0; border-radius: 50%; }
    .chrome-button:hover { background: #262722; color: #f4f4ef; }
    .chrome-button.active {
      background: color-mix(in srgb, var(--accent) 24%, #242520);
      color: #fff;
    }
    .chrome-button.active .icon { color: var(--accent); }
    .chrome-button:disabled { opacity: .3; cursor: default; }
    .chrome-badge {
      padding: 1px 5px;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      font-size: 10px;
    }
    .search-trigger {
      height: 36px;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 13px;
      border-radius: 18px;
      background: #22231e;
      border: 1px solid #2e3029;
      color: #96998f;
      text-align: left;
      font-size: 12.5px;
    }
    .search-trigger:hover { background: #282a24; color: #c8cbc2; }
    .search-trigger span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-trigger kbd {
      padding: 2px 7px;
      border-radius: 8px;
      background: #30312b;
      color: #a8aba0;
      font-family: inherit;
      font-size: 11px;
    }

    /* Three-Pane Workspace */
    .workspace { flex: 1; min-height: 0; display: flex; }
    .sidebar {
      flex: 0 0 256px;
      min-width: 0;
      padding: 4px 12px 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--shell-text);
    }
    .sidebar-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 2px;
      scrollbar-width: thin;
      scrollbar-color: #393a34 transparent;
    }
    .nav-list { display: grid; gap: 2px; }
    .nav-item {
      width: 100%;
      min-height: 34px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      border-radius: 8px;
      color: #b9bcb1;
      text-align: left;
      font-size: 13px;
      white-space: nowrap;
    }
    .nav-item:hover { background: #20211d; color: #f0f0e9; }
    .nav-item.active { background: #2a2b26; color: #f5f5ef; font-weight: 500; }
    .nav-item.active .icon { color: var(--accent); }
    .nav-item .nav-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .nav-count { color: var(--shell-muted); font-size: 11px; }

    .sidebar-section { margin-top: 18px; }
    .sidebar-heading {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px 6px;
      color: var(--shell-muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .2px;
    }
    .sidebar-heading button {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      display: grid;
      place-items: center;
      color: #8f9288;
    }
    .sidebar-heading button:hover { background: #262722; color: #f1f1eb; }

    .container-item {
      width: 100%;
      min-height: 33px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      border-radius: 8px;
      color: #c2c5ba;
      text-align: left;
      font-size: 12.5px;
    }
    .container-item:hover { background: #20211d; color: #f2f2ec; }
    .container-item.active { background: #2a2b26; color: #ffffff; font-weight: 500; }
    .container-item .emoji { width: 18px; text-align: center; font-size: 14px; flex: 0 0 auto; }
    .container-item .item-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
    .status-dot.active { background: var(--yq-green); }
    .status-dot.planning { background: var(--yellow); }
    .status-dot.hold { background: #8c8f84; }
    .status-dot.completed { background: #5a8dee; }

    /* Accordion Inline Catalog Tree inside Dark Sidebar */
    .sidebar-catalog {
      margin: 3px 0 8px 15px;
      padding-left: 9px;
      border-left: 1px solid #2e3029;
      display: grid;
      gap: 1px;
    }
    .catalog-group-row {
      width: 100%;
      min-height: 27px;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 6px;
      border-radius: 6px;
      color: #8d9086;
      font-size: 11.5px;
      font-weight: 500;
      text-align: left;
    }
    .catalog-group-row:hover { background: #1e1f1b; color: #d5d7ce; }
    .catalog-group-row .chevron { transition: transform .14s ease; }
    .catalog-group-row.collapsed .chevron { transform: rotate(-90deg); }
    .catalog-doc-row {
      width: 100%;
      min-height: 28px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 8px 4px 16px;
      border-radius: 6px;
      color: #aeb1a6;
      font-size: 12px;
      text-align: left;
    }
    .catalog-doc-row:hover { background: #22231e; color: #f2f2ec; }
    .catalog-doc-row.active {
      background: color-mix(in srgb, var(--accent) 18%, #262722);
      color: #ffffff;
      font-weight: 500;
    }
    .catalog-doc-row .catalog-doc-label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      line-height: 1.4;
    }

    .sidebar-footer {
      padding: 10px 4px 2px;
      border-top: 1px solid #22231e;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-collapsed .sidebar { flex-basis: 64px; padding-inline: 8px; }
    .sidebar-collapsed .nav-label, .sidebar-collapsed .nav-count, .sidebar-collapsed .sidebar-section, .sidebar-collapsed .sidebar-footer span { display: none; }
    .sidebar-collapsed .nav-item { justify-content: center; padding-inline: 0; }

    /* Main Panel & Right Panel (Warm-White Rounded Canvas) */
    .main-panel, .right-panel {
      min-width: 0;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
    }
    .main-panel {
      flex: 1;
      margin-bottom: 10px;
      border-radius: 14px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }
    .right-panel {
      flex: 0 0 326px;
      margin: 0 10px 10px 10px;
      border-radius: 14px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }
    .right-hidden .right-panel { display: none; }
    .right-hidden .main-panel { margin-right: 10px; }

    /* Common Page Elements */
    .page { padding: 26px 32px 48px; position: relative; }
    .page-header {
      min-height: 48px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }
    .page-title {
      margin: 0;
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: -1px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .page-subtitle { margin: 6px 0 0; color: var(--muted); font-size: 12.5px; }
    .page-actions { display: flex; align-items: center; gap: 7px; flex: 0 0 auto; flex-wrap: wrap; }

    .soft-button, .icon-button, .select-control {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 16px;
      background: var(--soft);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      transition: background .14s ease, color .14s ease;
    }
    .soft-button { padding: 5px 13px; }
    .soft-button:hover, .icon-button:hover { background: var(--soft-hover); }
    .soft-button.primary { background: var(--text); color: var(--panel); }
    .soft-button.primary:hover { opacity: .88; }
    .soft-button.accent { background: var(--accent); color: #fff; }
    .soft-button.accent:hover { opacity: .9; }
    .soft-button.green { background: var(--yq-green); color: #fff; }
    .soft-button.green:hover { opacity: .9; }
    .soft-button.danger { color: var(--accent-ink); }
    .icon-button { width: 32px; padding: 0; }
    .icon-button.active { background: var(--text); color: var(--panel); }
    .select-control { position: relative; padding: 0 8px; }
    .select-control select { appearance: none; border: 0; background: transparent; padding: 5px 18px 5px 4px; outline: 0; cursor: pointer; }
    .select-control .icon { position: absolute; right: 7px; width: 12px; height: 12px; pointer-events: none; }

    /* Pills & Chips */
    .summary-chip, .tag-chip, .meta-chip, .project-chip, .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 6px;
      font-size: 11px;
      white-space: nowrap;
    }
    .summary-chip { padding: 4px 8px; background: var(--panel-raised); border: 1px solid var(--line); }
    .summary-chip.red { color: var(--accent-ink); background: var(--accent-soft); border-color: transparent; }
    .summary-chip.yellow { color: #9c7510; background: var(--yellow-soft); border-color: transparent; }
    .summary-chip.green { color: var(--yq-green); background: var(--yq-green-soft); border-color: transparent; }
    .project-chip {
      padding: 2px 7px;
      background: var(--soft);
      color: var(--text);
      font-weight: 500;
      cursor: pointer;
    }
    .project-chip:hover { background: var(--soft-hover); }
    .tag-chip { padding: 2px 7px; background: var(--blue-soft); color: var(--blue-ink); cursor: pointer; }
    .tag-chip.green { background: var(--yq-green-soft); color: var(--yq-green); }
    .tag-chip.purple { background: var(--purple-soft); color: var(--purple-ink); }
    .tag-chip.yellow { background: var(--yellow-soft); color: #9c7510; }
    .status-pill {
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
    }
    .status-pill.active { background: var(--yq-green-soft); color: var(--yq-green); }
    .status-pill.planning { background: var(--yellow-soft); color: #9c7510; }
    .status-pill.hold { background: var(--soft); color: var(--muted); }
    .status-pill.completed { background: var(--blue-soft); color: var(--blue-ink); }

    /* Today View & Date Strip */
    .date-strip {
      display: flex;
      gap: 5px;
      margin: 18px 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .date-strip::-webkit-scrollbar { display: none; }
    .date-button {
      flex: 1 0 44px;
      max-width: 62px;
      height: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border-radius: 13px;
      color: var(--text);
    }
    .date-button:hover { background: var(--soft); }
    .date-button.selected { background: var(--accent); color: #fff; }
    .date-number { font-size: 19px; line-height: 1; font-weight: 600; }
    .date-weekday { color: var(--muted); font-size: 10px; }
    .date-button.selected .date-weekday { color: rgba(255, 255, 255, .86); }

    .summary-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--soft);
      font-size: 13px;
    }
    .carryover {
      margin: 14px 0 12px;
      padding: 13px 15px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel-raised);
    }
    .carryover-header { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-bottom: 6px; font-size: 12px; }
    .carryover-footer { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
    .text-button { padding: 4px 0; color: var(--muted); font-size: 12px; }
    .text-button:hover { color: var(--text); }

    /* Task & Event Rows */
    .task-list { display: grid; gap: 2px; }
    .task-row {
      position: relative;
      min-height: 52px;
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 8px 8px;
      border-radius: 9px;
    }
    .task-row:hover { background: var(--soft); }
    .task-row.selected { background: var(--soft); box-shadow: inset 0 0 0 1.5px var(--text); }
    .task-row.compact { min-height: 42px; padding-block: 6px; }
    .task-check {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
      padding: 0;
      border: 1.6px solid #b5b8ae;
      border-radius: 50%;
      color: var(--panel);
    }
    .task-check.medium { border-color: var(--yellow); }
    .task-check.high { border-color: var(--accent); }
    .task-check.completed { border-color: var(--text); background: var(--text); }
    .task-check .icon { width: 12px; height: 12px; stroke-width: 2.4; }
    .task-content { flex: 1; min-width: 0; }
    .task-title {
      display: block;
      width: 100%;
      padding: 0;
      color: var(--text);
      text-align: left;
      line-height: 1.42;
      font-size: 13.5px;
    }
    .task-title:hover { color: var(--accent-ink); }
    .task-row.completed .task-title { color: var(--muted); text-decoration: line-through; }
    .task-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }
    .task-meta .overdue { color: var(--accent-ink); font-weight: 500; }
    .event-dot { width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }
    .event-row { display: flex; align-items: flex-start; gap: 11px; min-height: 48px; padding: 8px; border-radius: 9px; }
    .event-row:hover { background: var(--soft); }

    .group-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 22px 0 8px;
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
    }
    .group-heading .left { display: flex; align-items: center; gap: 7px; }
    .group-heading .count { color: var(--muted); font-weight: 400; font-size: 11.5px; }

    /* View Tabs (Yuque + Woday Hybrid) */
    .view-tabs {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 18px 0 22px;
      border-bottom: 1px solid var(--line);
    }
    .view-tab {
      position: relative;
      padding: 6px 2px 11px;
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .view-tab:hover { color: var(--text); }
    .view-tab.active { color: var(--text); font-weight: 600; }
    .view-tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      border-radius: 2px;
      background: var(--accent);
    }

    /* Project Cockpit (Goal + Do + Learn/Catalog) */
    .goal-card {
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: linear-gradient(135deg, var(--soft) 0%, var(--panel-raised) 100%);
      margin-bottom: 22px;
    }
    .goal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .goal-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-ink);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .goal-text {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
      color: var(--text);
      margin: 0 0 12px;
    }
    .goal-progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11.5px;
      color: var(--muted);
    }
    .progress-track {
      flex: 1;
      height: 6px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--yq-green);
      transition: width .2s ease;
    }

    .cockpit-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.25fr);
      gap: 22px;
      align-items: start;
    }
    .cockpit-box {
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel-raised);
    }
    .cockpit-box-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .cockpit-box-title {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* Yuque-style Dotted-Leader Book Catalog */
    .catalog-section { margin-bottom: 16px; }
    .catalog-section:last-child { margin-bottom: 0; }
    .catalog-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 4px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
    }
    .catalog-book-row {
      width: 100%;
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 8px;
      border-radius: 7px;
      text-align: left;
      font-size: 13.5px;
    }
    .catalog-book-row:hover { background: var(--soft); }
    .catalog-book-row:hover .catalog-book-title { color: var(--accent-ink); }
    .catalog-book-title {
      max-width: 62%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
    }
    .dot-leader {
      flex: 1;
      min-width: 24px;
      border-bottom: 1px dashed var(--line);
      transform: translateY(-2px);
    }
    .catalog-book-meta {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Document View (Yuque 760px Centered Column + Woday Cover/Meta) */
    .doc-topbar {
      position: sticky;
      top: 0;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 32px;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line-soft);
    }
    .doc-breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .doc-breadcrumb button { color: var(--muted); }
    .doc-breadcrumb button:hover { color: var(--text); text-decoration: underline; }

    .editor-toolbar {
      position: sticky;
      top: 57px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 7px 32px;
      background: var(--panel-raised);
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
    }
    .toolbar-btn {
      height: 28px;
      min-width: 28px;
      padding: 0 7px;
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--text-body);
      font-size: 12px;
    }
    .toolbar-btn:hover { background: var(--soft); }
    .toolbar-sep { width: 1px; height: 16px; background: var(--line); margin: 0 5px; flex: 0 0 auto; }

    .doc-canvas {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 30px 90px;
    }
    .note-cover {
      height: 158px;
      margin: 0 0 24px;
      border-radius: 13px;
      overflow: hidden;
      position: relative;
    }
    .note-cover.hills { background: radial-gradient(ellipse at 20% 85%, #1d441e 0 20%, transparent 45%), radial-gradient(ellipse at 70% 80%, #4d742c 0 25%, transparent 55%), linear-gradient(155deg, #d8e4b7 5%, #8faf5b 38%, #274c25 90%); }
    .note-cover.sunset { background: radial-gradient(ellipse at 25% 20%, #ffd2bc, transparent 45%), radial-gradient(ellipse at 70% 40%, #fa7367, transparent 55%), linear-gradient(135deg, #e995aa, #f9b28c 45%, #755aa8); }
    .note-cover.ocean { background: radial-gradient(ellipse at 30% 10%, #d7f1ed, transparent 45%), linear-gradient(145deg, #a6d4d1, #478aa1 55%, #203e59); }

    .doc-header-row { display: flex; align-items: center; gap: 12px; }
    .doc-emoji-btn { font-size: 34px; line-height: 1; padding: 2px; border-radius: 8px; }
    .doc-emoji-btn:hover { background: var(--soft); }
    .doc-title {
      flex: 1;
      margin: 0;
      font-size: 34px;
      line-height: 1.32;
      font-weight: 700;
      letter-spacing: -.6px;
      outline: 0;
    }
    .doc-meta-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line-soft);
      color: var(--muted);
      font-size: 11.5px;
    }
    .meta-chip { padding: 4px 9px; background: var(--soft); color: var(--text-body); }

    /* Relaxed Chinese Document Typography (Yuque Standard) */
    .doc-body {
      color: var(--text-body);
      font-size: 15px;
      line-height: 1.8;
      letter-spacing: .15px;
      outline: 0;
    }
    .doc-body.editing {
      padding: 14px 16px;
      margin: -14px -16px;
      border-radius: 10px;
      border: 1px dashed var(--line);
      background: color-mix(in srgb, var(--panel-raised) 70%, transparent);
    }
    .doc-body h2 {
      margin: 30px 0 12px;
      font-size: 22px;
      line-height: 1.4;
      font-weight: 650;
      color: var(--text);
      scroll-margin-top: 80px;
    }
    .doc-body h3 {
      margin: 22px 0 10px;
      font-size: 17px;
      line-height: 1.45;
      font-weight: 600;
      color: var(--text);
      scroll-margin-top: 80px;
    }
    .doc-body p { margin: 0 0 14px; }
    .doc-body ul, .doc-body ol { margin: 0 0 16px; padding-left: 22px; }
    .doc-body li { margin: 5px 0; }
    .doc-body blockquote {
      margin: 16px 0;
      padding: 10px 16px;
      border-left: 3px solid var(--accent);
      background: var(--soft);
      border-radius: 0 8px 8px 0;
      color: var(--muted);
    }
    .doc-callout {
      margin: 16px 0;
      padding: 13px 16px;
      border-radius: 10px;
      background: var(--yq-green-soft);
      border: 1px solid color-mix(in srgb, var(--yq-green) 25%, transparent);
      font-size: 14px;
      line-height: 1.65;
    }
    .doc-code {
      margin: 16px 0;
      padding: 14px 16px;
      border-radius: 9px;
      background: #171814;
      color: #e9eae2;
      font: 13px/1.65 var(--font-mono);
      overflow-x: auto;
    }
    .doc-table {
      width: 100%;
      margin: 16px 0;
      border-collapse: collapse;
      font-size: 13.5px;
    }
    .doc-table th, .doc-table td {
      padding: 9px 12px;
      border: 1px solid var(--line);
      text-align: left;
    }
    .doc-table th { background: var(--soft); font-weight: 600; }
    .mention-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 7px;
      margin: 0 2px;
      border-radius: 5px;
      background: var(--blue-soft);
      color: var(--blue-ink);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      vertical-align: baseline;
    }
    .mention-chip:hover { opacity: .85; }

    /* Two-Tier Document Checklists & Synced Project Tasks */
    .doc-execution-zone {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 18px;
    }
    .doc-zone-card {
      padding: 15px 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel-raised);
    }
    .doc-zone-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .doc-zone-title {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .promote-btn {
      opacity: 0;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--yq-green-soft);
      color: var(--yq-green);
      font-size: 11px;
      font-weight: 500;
      transition: opacity .14s ease;
    }
    .task-row:hover .promote-btn, .promote-btn:focus-visible { opacity: 1; }

    /* Right Panel: Inbox (Task + Memo) & Outline/Backlinks & Task Detail */
    .right-content { padding: 20px 18px 32px; }
    .right-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .right-title { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.5px; }

    .capture-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 3px;
      border-radius: 10px;
      background: var(--soft);
      margin-bottom: 12px;
    }
    .capture-switch button {
      height: 29px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .capture-switch button.active {
      background: var(--panel-raised);
      color: var(--text);
      box-shadow: 0 1px 3px rgba(0,0,0,.07);
    }

    .capture-box {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--panel-raised);
      margin-bottom: 14px;
    }
    .capture-box input, .capture-box textarea {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      outline: 0;
      font-size: 13px;
    }
    .capture-box textarea {
      min-height: 68px;
      resize: vertical;
      line-height: 1.55;
    }
    .capture-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line-soft);
    }

    .memo-mini-card {
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-raised);
      margin-bottom: 8px;
    }
    .memo-mini-body {
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--text-body);
      white-space: pre-wrap;
      margin-bottom: 8px;
    }
    .memo-mini-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 10.5px;
      color: var(--muted);
    }
    .memo-mini-actions { display: flex; gap: 4px; }
    .mini-action-btn {
      padding: 2px 7px;
      border-radius: 5px;
      background: var(--soft);
      color: var(--text);
      font-size: 10.5px;
      font-weight: 500;
    }
    .mini-action-btn:hover { background: var(--soft-hover); color: var(--accent-ink); }

    /* Outline & Backlinks in Right Panel */
    .outline-list { display: grid; gap: 2px; margin: 8px 0 18px; }
    .outline-item {
      width: 100%;
      padding: 5px 8px 5px 12px;
      border-left: 2px solid var(--line);
      text-align: left;
      font-size: 12.5px;
      color: var(--muted);
      border-radius: 0 6px 6px 0;
    }
    .outline-item.level-3 { padding-left: 22px; font-size: 12px; }
    .outline-item:hover {
      border-left-color: var(--accent);
      background: var(--soft);
      color: var(--text);
    }
    .backlink-card {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel-raised);
      text-align: left;
      margin-bottom: 7px;
    }
    .backlink-card:hover { background: var(--soft); }
    .backlink-title { font-size: 12.5px; font-weight: 600; display: block; margin-bottom: 3px; }
    .backlink-meta { font-size: 11px; color: var(--muted); }

    /* Memos & Recent Workspace (Yuque 小记 + 开始) */
    .memos-split {
      display: grid;
      grid-template-columns: minmax(280px, .85fr) minmax(340px, 1.35fr);
      gap: 24px;
      align-items: start;
    }
    .memo-composer-panel {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel-raised);
      position: sticky;
      top: 20px;
    }
    .memo-composer-panel textarea {
      width: 100%;
      min-height: 150px;
      border: 0;
      background: transparent;
      outline: 0;
      resize: vertical;
      font-size: 14px;
      line-height: 1.7;
    }
    .memo-card {
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel-raised);
      margin-bottom: 12px;
    }
    .memo-card.pinned { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }

    /* Recent Docs Table (Yuque Dashboard Style) */
    .recent-table { width: 100%; border-collapse: collapse; }
    .recent-row {
      display: grid;
      grid-template-columns: minmax(220px, 1.6fr) minmax(160px, 1fr) 110px 36px;
      align-items: center;
      min-height: 50px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--line-soft);
      border-radius: 8px;
    }
    .recent-row:hover { background: var(--soft); }

    /* Kanban Board & Calendar & Collection Grid */
    .board-scroll { margin-top: 16px; overflow-x: auto; }
    .board { min-width: 700px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(185px, 1fr); gap: 12px; }
    .board-column { min-width: 0; }
    .board-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .board-card { margin-bottom: 8px; padding: 7px 9px; border-radius: 10px; background: var(--soft); border: 1px solid var(--line-soft); }

    .collection-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
    .collection-card {
      min-height: 144px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel-raised);
      text-align: left;
    }
    .collection-card:hover { background: var(--soft); border-color: var(--muted); }
    .collection-card .emoji { font-size: 28px; }

    .calendar-wrap { margin-top: 18px; overflow-x: auto; }
    .week-calendar { min-width: 640px; display: grid; grid-template-columns: 52px repeat(7, minmax(80px, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
    .week-calendar.three-days { grid-template-columns: 52px repeat(3, minmax(150px, 1fr)); min-width: 520px; }
    .calendar-cell { min-height: 56px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .calendar-cell.heading { min-height: 48px; background: var(--soft); text-align: center; font-size: 12px; }
    .calendar-cell.heading.today { color: var(--accent-ink); }
    .calendar-cell.time { color: var(--muted); font-size: 10px; text-align: right; }
    .calendar-event { display: block; width: 100%; margin-bottom: 4px; padding: 5px 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-ink); text-align: left; font-size: 10.5px; }
    .calendar-task { background: var(--blue-soft); color: var(--blue-ink); }
    .month-calendar { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
    .month-cell { min-height: 88px; padding: 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: left; }
    .month-cell.muted { color: var(--muted); background: var(--soft); }
    .month-cell.today .month-number { background: var(--accent); color: #fff; }
    .month-number { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; font-size: 12px; }
    .month-dot { width: 5px; height: 5px; margin-top: 6px; border-radius: 50%; background: var(--accent); }

    /* Task Detail & Settings */
    .detail-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .detail-title { margin: 0 0 12px; font-size: 20px; line-height: 1.3; font-weight: 700; outline: 0; }
    .detail-section { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
    .detail-section h3 { margin: 0 0 8px; font-size: 11.5px; color: var(--muted); }
    .detail-field { display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 8px; margin: 8px 0; color: var(--muted); font-size: 11.5px; }
    .detail-field select, .detail-field input, .form-field input, .form-field select, .form-field textarea {
      width: 100%; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); color: var(--text); outline: 0;
    }
    .detail-notes { width: 100%; min-height: 84px; resize: vertical; padding: 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); color: var(--text); line-height: 1.5; margin-top: 8px; }

    .settings-layout { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 26px; margin-top: 20px; }
    .settings-nav { display: grid; align-content: start; gap: 3px; }
    .settings-nav .nav-item { color: var(--muted); }
    .settings-nav .nav-item.active { background: var(--soft-hover); color: var(--text); }
    .setting-row { display: grid; grid-template-columns: minmax(150px, 1fr) auto; align-items: center; gap: 18px; min-height: 54px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .setting-label { font-size: 13px; font-weight: 500; }
    .setting-description { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .accent-options { display: flex; gap: 10px; padding: 10px 0 18px; }
    .accent-option { width: 26px; height: 26px; padding: 2px; border: 2px solid transparent; border-radius: 50%; }
    .accent-option::after { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--swatch); content: ""; }
    .accent-option.active { border-color: var(--text); }

    /* Search & Modal Dialogs */
    .search-dialog, .form-dialog {
      padding: 0;
      border: 1px solid #363732;
      border-radius: 16px;
      box-shadow: 0 30px 100px rgba(0,0,0,.45);
    }
    .search-dialog {
      width: min(640px, calc(100vw - 32px));
      max-height: min(640px, calc(100dvh - 80px));
      overflow: hidden;
      background: #171814;
      color: #edede6;
    }
    .search-dialog::backdrop, .form-dialog::backdrop { background: rgba(9, 10, 8, .42); backdrop-filter: blur(3px); }
    .search-box { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid #2e302a; }
    .search-box input { flex: 1; min-width: 0; border: 0; background: transparent; color: #f2f2ec; font-size: 16px; outline: 0; }
    .search-box kbd { padding: 2px 6px; border-radius: 5px; background: #2b2c27; color: #a9aca0; font-size: 10px; }
    .search-results { max-height: 460px; padding: 10px; overflow-y: auto; }
    .search-result { width: 100%; display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 9px; color: #dedfd7; text-align: left; }
    .search-result:hover, .search-result.selected { background: #2b2c27; }
    .search-result-content { flex: 1; min-width: 0; }
    .search-result-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
    .search-result-type { display: block; margin-top: 2px; color: #85887d; font-size: 11px; }

    .form-dialog {
      width: min(460px, calc(100vw - 32px));
      padding: 22px 24px;
      border-color: var(--line);
      background: var(--panel-raised);
      color: var(--text);
    }
    .form-dialog h2 { margin: 0 0 6px; font-size: 19px; }
    .form-dialog p { margin: 0 0 14px; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
    .form-field { display: grid; gap: 6px; margin: 12px 0; font-size: 12px; font-weight: 500; }
    .form-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 18px; }

    .popover {
      position: fixed;
      z-index: 30;
      min-width: 180px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--panel-raised);
      box-shadow: 0 12px 40px rgba(0,0,0,.18);
    }
    .popover[hidden] { display: none; }
    .popover button { width: 100%; display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 7px; text-align: left; font-size: 12px; }
    .popover button:hover { background: var(--soft); }

    .toast {
      position: fixed;
      z-index: 50;
      left: 50%;
      bottom: 26px;
      padding: 9px 16px;
      border: 1px solid #3a3b35;
      border-radius: 20px;
      background: #191a16;
      color: #f0f0e9;
      box-shadow: 0 8px 28px rgba(0,0,0,.24);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: opacity .18s ease, transform .18s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .mini-calendar-header { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 10px; }
    .mini-calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
    .mini-calendar-grid .weekday { padding: 5px 0; color: var(--muted); font-size: 10px; }

            return `<div>
              <button class="container-item ${isActive ? "active" : ""}" data-action="open-project" data-project-id="${p.id}">
                <span class="emoji">${esc(p.emoji)}</span>
                <span class="item-label">${esc(p.name)}</span>
                <span class="status-dot ${statusMeta(p.status).cls}" title="${statusMeta(p.status).label}"></span>
              </button>
              ${renderInlineCatalog("project", p)}
            </div>`;
          }).join("")}
        </section>

        <section class="sidebar-section">
          <div class="sidebar-heading">
            <span>长期知识库 · BOOKS</span>
            <button data-action="open-new-container" data-kind="book" title="新建知识库">${icon("plus", "tiny")}</button>
          </div>
          ${state.books.map(b => {
            const isActive = (state.view === "book" && state.params.bookId === b.id) || (state.view === "doc" && getDoc(state.params.docId)?.containerId === b.id);
            return `<div>
              <button class="container-item ${isActive ? "active" : ""}" data-action="open-book" data-book-id="${b.id}">
                <span class="emoji">${esc(b.emoji)}</span>
                <span class="item-label">${esc(b.name)}</span>
              </button>
              ${renderInlineCatalog("book", b)}
            </div>`;
          }).join("")}
        </section>

        ${favorites.length ? `
        <section class="sidebar-section">
          <div class="sidebar-heading"><span>收藏 · FAVORITES</span></div>
          ${favorites.map(d => `
            <button class="container-item ${state.view === "doc" && state.params.docId === d.id ? "active" : ""}" data-action="open-doc" data-doc-id="${d.id}">
              <span class="emoji">${esc(d.emoji || "📄")}</span>
              <span class="item-label">${esc(d.title)}</span>
            </button>
          `).join("")}
        </section>` : ""}

        <section class="sidebar-section">
          <div class="sidebar-heading">
            <span>标签聚合 · TAGS</span>
            <button data-action="new-tag" title="新建标签">${icon("plus", "tiny")}</button>
          </div>
          ${state.tags.map(t => `
            <button class="container-item ${state.view === "tag" && state.params.tag === t ? "active" : ""}" data-action="open-tag" data-tag="${esc(t)}">
              ${icon("tag", "small")}
              <span class="item-label">${esc(t)}</span>
            </button>
          `).join("")}
        </section>
      `;
    }

    /* Main Panel Views */
    function pageHeaderHtml(title, subtitle = "", dateControls = false, extraActions = "") {
      return `<div class="page-header">
        <div>
          <h1 class="page-title">${title}</h1>
          ${subtitle ? `<p class="page-subtitle">${subtitle}</p>` : ""}
        </div>
        <div class="page-actions">
          ${extraActions}
          ${dateControls ? `
            <button class="soft-button" data-action="today-reset">回到今天</button>
            <button class="icon-button" data-action="shift-date" data-amount="-1" aria-label="前一天">${icon("left")}</button>
            <button class="icon-button" data-action="shift-date" data-amount="1" aria-label="后一天">${icon("right")}</button>
          ` : ""}
        </div>
      </div>`;
    }

    /* 1. Today View */
    function renderTodayView() {
      const offset = dayOffset(state.selectedDate);
      const isToday = offset === 0;
      const dayTasks = state.tasks.filter(t => t.dueOffset === offset).sort((a, b) => timeValue(a.time) - timeValue(b.time));
      const dayEvents = state.events.filter(e => e.dueOffset === offset).sort((a, b) => timeValue(a.time) - timeValue(b.time));
      const overdue = state.tasks.filter(t => t.dueOffset !== null && t.dueOffset < 0 && !t.done);
      const importantCount = dayTasks.filter(t => t.priority === "high" && !t.done).length;
      const habitCount = dayTasks.filter(t => t.habit && !t.done).length;
      const activeProjectsCount = state.projects.filter(p => p.status === "active").length;

      const strip = `<div class="date-strip" aria-label="选择日期">
        ${Array.from({length: 16}, (_, idx) => {
          const d = addDays(state.selectedDate, idx - 2);
          const sel = localISO(d) === localISO(state.selectedDate);
          return `<button class="date-button ${sel ? "selected" : ""}" data-action="select-date" data-date="${localISO(d)}">
            <span class="date-number">${d.getDate()}</span>
            <span class="date-weekday">${d.toLocaleDateString("zh-CN", {weekday: "short"})}</span>
          </button>`;
        }).join("")}
      </div>`;

      return `<div class="page">
        ${pageHeaderHtml(
          isToday ? "今日推进 · Today" : cnShortDate(state.selectedDate),
          cnFullDate(state.selectedDate),
          true,
          `<button class="soft-button primary" data-action="focus-inbox-task">${icon("plus", "small")}新建今日任务</button>`
        )}
        ${strip}
        <div class="summary-bar">
          <strong>今日焦点概览：</strong>
          <span class="summary-chip green">${icon("rocket", "tiny")}${activeProjectsCount} 个推进中项目</span>
          <span class="summary-chip red">${icon("calendar", "tiny")}${dayEvents.length} 场日程</span>
          ${habitCount ? `<span class="summary-chip">🔥 ${habitCount} 项每日习惯</span>` : ""}
          <span class="summary-chip yellow">${icon("flag", "tiny")}${importantCount} 项高优任务</span>
        </div>

        ${isToday && overdue.length && !state.carryHidden ? `
          <section class="carryover">
            <div class="carryover-header">
              <strong>昨日遗留未完项</strong>
              <span class="summary-chip yellow">${overdue.length} 项待处理</span>
            </div>
            ${overdue.map(t => renderTaskRow(t, true)).join("")}
            <div class="carryover-footer">
              <button class="soft-button primary" data-action="move-overdue-today">全部顺延至今天</button>
              <button class="text-button" data-action="toggle-carry">暂时收起</button>
            </div>
          </section>
        ` : isToday && overdue.length && state.carryHidden ? `
          <button class="text-button" style="margin-top:10px" data-action="toggle-carry">展开 ${overdue.length} 项昨日遗留任务</button>
        ` : ""}

        ${dayEvents.length ? `
          <div class="group-heading"><span class="left">${icon("calendar", "small")}今日日程 (Events)</span><span class="count">${dayEvents.length}</span></div>
          <div class="task-list">${dayEvents.map(e => renderEventRow(e)).join("")}</div>
        ` : ""}

        <div class="group-heading"><span class="left">${icon("task", "small")}今日项目推进与习惯 (Tasks &amp; Habits)</span><span class="count">${dayTasks.length}</span></div>
        <div class="task-list">
          ${dayTasks.length ? dayTasks.map(t => renderTaskRow(t)).join("") : `
            <div class="empty-state">
              <div>
                <h2>该日暂无排期任务</h2>
                <p>可以从右侧收集箱（Inbox）安排任务，或进入具体个人项目拆解下一步行动。</p>
                <button class="soft-button primary" data-action="focus-inbox-task">添加任务</button>
              </div>
            </div>
          `}
        </div>
      </div>`;
    }

    /* 2. Project Cockpit View (Personal Project Axis: Goal + Do + Learn/Catalog) */
    function renderProjectView(projectId) {
      const project = getProject(projectId) || state.projects[0];
      if (!project) return renderTodayView();
      const pTasks = state.tasks.filter(t => t.projectId === project.id);
      const openTasks = pTasks.filter(t => !t.done);
      const doneTasks = pTasks.filter(t => t.done);
      const pEvents = state.events.filter(e => e.projectId === project.id);
      const pDocs = state.docs.filter(d => d.containerType === "project" && d.containerId === project.id);
      const progress = pTasks.length ? Math.round((doneTasks.length / pTasks.length) * 100) : 0;
      const st = statusMeta(project.status);

      const headerActions = `
        <button class="status-pill ${st.cls}" data-action="cycle-project-status" data-project-id="${project.id}" title="点击切换项目生命周期状态">● ${st.label}</button>
        <button class="soft-button" data-action="new-doc-in" data-container-type="project" data-container-id="${project.id}">${icon("plus", "small")}新建项目文档</button>
        <button class="soft-button primary" data-action="new-project-task" data-project-id="${project.id}">${icon("plus", "small")}新建项目任务</button>
      `;

      const tabs = `<div class="view-tabs">
        <button class="view-tab ${state.projectTab === "overview" ? "active" : ""}" data-action="set-project-tab" data-tab="overview">${icon("rocket", "small")}项目驾驶舱 (Goal · Do · Learn)</button>
        <button class="view-tab ${state.projectTab === "tasks" ? "active" : ""}" data-action="set-project-tab" data-tab="tasks">${icon("task", "small")}行动执行看板 (${openTasks.length})</button>
        <button class="view-tab ${state.projectTab === "catalog" ? "active" : ""}" data-action="set-project-tab" data-tab="catalog">${icon("book", "small")}成书文档目录 (${pDocs.length})</button>
      </div>`;

      const goalCard = `<section class="goal-card">
        <div class="goal-top">
          <span class="goal-label">${icon("flag", "tiny")}PROJECT GOAL · 项目核心目标与边界</span>
          <span style="font-size:11.5px;color:var(--muted)">目标节点：${esc(project.due || "持续推进")}</span>
        </div>
        <p class="goal-text" contenteditable="true" data-project-goal="${project.id}" title="点击直接编辑项目核心目标">${esc(project.goal)}</p>
        <div class="goal-progress-row">
          <span>推进进度 <strong>${progress}%</strong>（${doneTasks.length}/${pTasks.length} 任务完成 · ${pDocs.length} 篇项目文档）</span>
          <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
          <button class="text-button" data-action="archive-project-docs" data-project-id="${project.id}" title="项目完结或阶段沉淀时，将文档迁入长期知识库">沉淀至知识库 →</button>
        </div>
      </section>`;

      const renderCatalogTreeBlock = () => `
        <div>
          ${project.groups.map(group => {
            const gDocs = pDocs.filter(d => d.groupId === group.id);
            return `<div class="catalog-section">
              <div class="catalog-section-head">
                <span>▾ ${esc(group.title)}</span>
                <button class="text-button" data-action="new-doc-in" data-container-type="project" data-container-id="${project.id}" data-group-id="${group.id}">+ 添加文档</button>
              </div>
              ${gDocs.length ? gDocs.map(doc => {
                const linkedCount = state.tasks.filter(t => t.docId === doc.id).length;
                return `<button class="catalog-book-row" data-action="open-doc" data-doc-id="${doc.id}">
                  <span>${esc(doc.emoji || "📄")}</span>
                  <span class="catalog-book-title">${esc(doc.title)}</span>
                  <span class="dot-leader"></span>
                  <span class="catalog-book-meta">
                    ${linkedCount ? `<span class="summary-chip" style="padding:1px 6px">${linkedCount} 任务</span>` : ""}
                    <span>${esc(doc.edited)}</span>
                  </span>
                </button>`;
              }).join("") : `<div style="padding:6px 12px;color:var(--muted);font-size:12px">本分组暂无文档，点击右上角添加。</div>`}
            </div>`;
          }).join("")}
        </div>
      `;

      let bodyContent = "";
      if (state.projectTab === "overview") {
        bodyContent = `
          ${goalCard}
          <div class="cockpit-grid">
            <section class="cockpit-box">
              <div class="cockpit-box-header">
                <h2 class="cockpit-box-title">${icon("task", "small")}近期行动执行 (Do · Tasks &amp; Events)</h2>
                <button class="text-button" data-action="set-project-tab" data-tab="tasks">查看看板 →</button>
              </div>
              <div class="capture-box" style="margin-bottom:10px;padding:7px 10px">
                <input id="quickProjectTaskInput" data-project-id="${project.id}" placeholder="添加本项目待办任务，回车直接创建…" autocomplete="off">
              </div>
              ${pEvents.length ? `<div style="margin-bottom:8px">${pEvents.map(e => renderEventRow(e, true)).join("")}</div>` : ""}
              <div class="task-list">
                ${openTasks.length ? openTasks.map(t => renderTaskRow(t, true)).join("") : `<p class="page-subtitle">暂无未完成任务。</p>`}
                ${doneTasks.length ? `<div class="group-heading" style="margin-top:14px"><span class="left">已完成</span><span class="count">${doneTasks.length}</span></div>${doneTasks.slice(0, 3).map(t => renderTaskRow(t, true)).join("")}` : ""}
              </div>
            </section>

            <section class="cockpit-box">
              <div class="cockpit-box-header">
                <h2 class="cockpit-box-title">${icon("book", "small")}项目知识支撑 (Learn · 成书目录树)</h2>
                <button class="soft-button" data-action="add-catalog-group" data-container-type="project" data-container-id="${project.id}">+ 新建章节分组</button>
              </div>
              ${renderCatalogTreeBlock()}
            </section>
          </div>
        `;
      } else if (state.projectTab === "tasks") {
        const cols = [
          { name: "今日 & 逾期", list: openTasks.filter(t => t.dueOffset !== null && t.dueOffset <= 0) },
          { name: "近期排期", list: openTasks.filter(t => t.dueOffset !== null && t.dueOffset > 0) },
          { name: "待排期池 (Backlog)", list: openTasks.filter(t => t.dueOffset === null) },
          { name: "已完成", list: doneTasks }
        ];
        bodyContent = `
          ${goalCard}
          <div class="board-scroll">
            <div class="board">
              ${cols.map(col => `
                <section class="board-column">
                  <div class="board-heading"><strong>${col.name}</strong><span class="page-subtitle">${col.list.length}</span></div>
                  ${col.list.map(t => `<div class="board-card">${renderTaskRow(t, true)}</div>`).join("") || `<p class="page-subtitle">暂无条目</p>`}
                </section>
              `).join("")}
            </div>
          </div>
        `;
      } else {
        bodyContent = `
          <div class="cockpit-box">
            <div class="cockpit-box-header">
              <h2 class="cockpit-box-title">${icon("book", "small")}项目成书目录编排（像书一样组织项目知识）</h2>
              <div class="page-actions">
                <button class="soft-button" data-action="add-catalog-group" data-container-type="project" data-container-id="${project.id}">+ 新建目录分组</button>
                <button class="soft-button primary" data-action="new-doc-in" data-container-type="project" data-container-id="${project.id}">+ 新建文档</button>
              </div>
            </div>
            ${renderCatalogTreeBlock()}
          </div>
        `;
      }

      return `<div class="page">
        ${pageHeaderHtml(`<span>${esc(project.emoji)}</span><span>${esc(project.name)}</span>`, "个人项目推进主轴 · 知识管理与日常执行协同", false, headerActions)}
        ${tabs}
        ${bodyContent}
      </div>`;
    }

    /* 3. Book View (Yuque-Style Long-Term Knowledge Base) */
    function renderBookView(bookId) {
      const book = getBook(bookId) || state.books[0];
      if (!book) return renderTodayView();
      const bDocs = state.docs.filter(d => d.containerType === "book" && d.containerId === book.id);
      const totalChars = bDocs.reduce((acc, d) => acc + d.body.replace(/<[^>]+>/g, "").length, 0);

      return `<div class="page">
        ${pageHeaderHtml(
          `<span>${esc(book.emoji)}</span><span>${esc(book.name)}</span>`,
          `${bDocs.length} 篇文档 · ${totalChars} 字 · 长期知识库（Book）`,
          false,
          `<button class="soft-button" data-action="add-catalog-group" data-container-type="book" data-container-id="${book.id}">+ 新建目录分组</button>
           <button class="soft-button green" data-action="new-doc-in" data-container-type="book" data-container-id="${book.id}">${icon("plus", "small")}新建知识文档</button>`
        )}

        <div class="goal-card" style="margin-top:18px">
          <div class="goal-top">
            <span class="goal-label" style="color:var(--yq-green)">${icon("book", "tiny")}KNOWLEDGE BOOK · 像书一样沉淀长期体系化知识</span>
            <span style="font-size:11.5px;color:var(--muted)">左栏已同步展开本知识库目录树</span>
          </div>
          <p style="margin:0;font-size:13.5px;color:var(--text-body);line-height:1.65">${esc(book.desc)}</p>
        </div>

        <div class="cockpit-box">
          <div class="cockpit-box-header">
            <h2 class="cockpit-box-title">📚 知识库目录 (Catalog)</h2>
            <span class="page-subtitle">标题与更新时间采用语雀书目式虚线引导排版</span>
          </div>
          ${book.groups.map(group => {
            const gDocs = bDocs.filter(d => d.groupId === group.id);
            return `<div class="catalog-section">
              <div class="catalog-section-head">
                <span>▾ ${esc(group.title)}</span>
                <button class="text-button" data-action="new-doc-in" data-container-type="book" data-container-id="${book.id}" data-group-id="${group.id}">+ 在此分组新建文档</button>
              </div>
              ${gDocs.length ? gDocs.map(doc => `
                <button class="catalog-book-row" data-action="open-doc" data-doc-id="${doc.id}">
                  <span>${esc(doc.emoji || "📄")}</span>
                  <span class="catalog-book-title">${esc(doc.title)}</span>
                  <span class="dot-leader"></span>
                  <span class="catalog-book-meta">
                    ${tagChipHtml(doc.tag)}
                    <span>${esc(doc.edited)}</span>
                  </span>
                </button>
              `).join("") : `<div style="padding:6px 12px;color:var(--muted);font-size:12px">暂无文档</div>`}
            </div>`;
          }).join("")}
        </div>
      </div>`;
    }

    /* 4. Document View (Reading/Editing Split + 760px Centered Column + Two-Tier Tasks + Backlinks) */
    function renderDocView(docId) {
      const doc = getDoc(docId) || state.docs[0];
      if (!doc) return renderTodayView();
      const container = getContainer(doc.containerType, doc.containerId);
      const group = container?.groups?.find(g => g.id === doc.groupId);
      const linkedTasks = state.tasks.filter(t => t.docId === doc.id);
      const linkedEvents = state.events.filter(e => e.docId === doc.id);
      const charCount = doc.body.replace(/<[^>]+>/g, "").trim().length;

      return `
        <div class="doc-topbar">
          <div class="doc-breadcrumb">
            <button data-action="${doc.containerType === "project" ? "open-project" : "open-book"}" data-${doc.containerType}-id="${container?.id || ""}">
              ${esc(container?.emoji || "📁")} ${esc(container?.name || "未归属")}
            </button>
            <span>/</span>
            <span>${esc(group?.title || "默认分组")}</span>
            <span>/</span>
            <strong style="color:var(--text)">${esc(doc.title)}</strong>
          </div>
          <div class="page-actions">
            <span class="summary-chip ${state.docEditMode ? "green" : ""}">${state.docEditMode ? "✎ 编辑态 · 自动保存" : "📖 沉浸阅读态"}</span>
            <button class="soft-button ${state.docEditMode ? "green" : "primary"}" data-action="toggle-doc-edit">
              ${icon("edit", "small")}${state.docEditMode ? "完成编辑 (Esc)" : "编辑文档 (E)"}
            </button>
            <button class="soft-button" data-action="cycle-doc-cover" data-doc-id="${doc.id}">封面</button>
            <button class="icon-button ${doc.favorite ? "active" : ""}" data-action="toggle-doc-fav" data-doc-id="${doc.id}" title="收藏文档">${icon("star", "small")}</button>
            <button class="soft-button" data-action="set-right" data-mode="outline" title="在右栏查看文档大纲、关联任务与双链">${icon("list", "small")}大纲与关联</button>
            ${doc.containerType === "project" ? `<button class="soft-button" data-action="move-doc-to-book" data-doc-id="${doc.id}" title="将此项目文档沉淀至长期知识库">迁入知识库</button>` : ""}
          </div>
        </div>

        ${state.docEditMode ? `
          <div class="editor-toolbar" role="toolbar" aria-label="文档格式化与块插入工具栏">
            <button class="toolbar-btn" data-action="insert-block" data-block="h2"><strong>H2</strong> 章节</button>
            <button class="toolbar-btn" data-action="insert-block" data-block="h3"><strong>H3</strong> 小节</button>
            <span class="toolbar-sep"></span>
            <button class="toolbar-btn" data-action="format-cmd" data-cmd="bold"><strong>B</strong></button>
            <button class="toolbar-btn" data-action="format-cmd" data-cmd="italic"><em>I</em></button>
            <button class="toolbar-btn" data-action="format-cmd" data-cmd="insertUnorderedList">• 列表</button>
            <span class="toolbar-sep"></span>
            <button class="toolbar-btn" data-action="insert-block" data-block="callout">💡 高亮块</button>
            <button class="toolbar-btn" data-action="insert-block" data-block="code">${icon("code", "tiny")} 代码块</button>
            <button class="toolbar-btn" data-action="insert-block" data-block="table">⊞ 表格</button>
            <button class="toolbar-btn" data-action="insert-block" data-block="mention">@ 引用文档</button>
            <span class="toolbar-sep"></span>
            <button class="toolbar-btn" data-action="add-doc-checklist" data-doc-id="${doc.id}">☑ 局部复选框</button>
            <button class="toolbar-btn" style="color:var(--yq-green);font-weight:600" data-action="add-doc-synced-task" data-doc-id="${doc.id}">＋ 嵌入项目任务 (Task)</button>
          </div>
        ` : ""}

        <article class="doc-canvas">
          ${doc.cover && doc.cover !== "none" ? `<div class="note-cover ${esc(doc.cover)}"></div>` : ""}

          <div class="doc-header-row">
            <button class="doc-emoji-btn" data-action="cycle-doc-emoji" data-doc-id="${doc.id}" title="点击切换图标">${esc(doc.emoji || "📄")}</button>
            <h1 class="doc-title" ${state.docEditMode ? `contenteditable="true"` : ""} data-doc-title="${doc.id}">${esc(doc.title)}</h1>
          </div>

          <div class="doc-meta-row">
            <span class="meta-chip">${doc.containerType === "project" ? "个人项目" : "长期知识库"}：${esc(container?.name || "")}</span>
            <span class="meta-chip">目录：${esc(group?.title || "")}</span>
            <span class="meta-chip">${icon("clock", "tiny")}更新于 ${esc(doc.edited)}</span>
            <span class="meta-chip">${charCount} 字</span>
            ${tagChipHtml(doc.tag)}
            <button class="text-button" data-action="cycle-doc-tag" data-doc-id="${doc.id}">+ 切换标签</button>
          </div>

          <div class="doc-body ${state.docEditMode ? "editing" : ""}" id="docBodyContent" ${state.docEditMode ? `contenteditable="true"` : ""} data-doc-body="${doc.id}">
            ${doc.body}
          </div>

          <!-- Two-Tier Checklists & Synced Tasks inside Document -->
          <section class="doc-execution-zone">
            <div class="doc-zone-card">

                <div class="task-row compact ${item.done ? "completed" : ""}">
                  <button class="task-check ${item.done ? "completed" : ""}" data-action="toggle-doc-checklist" data-doc-id="${doc.id}" data-item-id="${item.id}">
                    ${item.done ? icon("check") : ""}
                  </button>
                  <div class="task-content">
                    <span class="task-title" ${state.docEditMode ? `contenteditable="true"` : ""} data-checklist-title="${item.id}" data-doc-id="${doc.id}">${esc(item.title)}</span>

                  <button class="promote-btn" data-action="promote-checklist-to-task" data-doc-id="${doc.id}" data-item-id="${item.id}" title="提升为一等公民 Project Task，同步到项目驾驶舱与 Today">⬆ 提升为项目任务</button>
                </div>
              `).join("") : `<p class="page-subtitle">暂无局部复选框。局部自查项仅存于本文档内，需要排期推进时可一键「提升为项目任务」。</p>`}
            </div>

            <div class="doc-zone-card">
              <div class="doc-zone-header">
                <span class="doc-zone-title" style="color:var(--yq-green)">${icon("rocket", "small")}本文档关联的项目执行项 (Synced Project Tasks &amp; Events · 双向同步)</span>
                <button class="soft-button green" data-action="add-doc-synced-task" data-doc-id="${doc.id}">+ 新建关联任务</button>
              </div>
              ${linkedEvents.map(ev => renderEventRow(ev, true)).join("")}
              ${linkedTasks.length ? linkedTasks.map(t => renderTaskRow(t, true)).join("") : `<p class="page-subtitle">暂无关联的全局任务。在此创建的任务会自动同步至所属 Project 与 Today 视图。</p>`}
            </div>
          </section>
        </article>
      `;
    }

    /* 5. Memos & Recent Workspace (Yuque 小记 + 开始工作台) */
    function renderMemosView() {
      return `<div class="page">
        ${pageHeaderHtml(
          "小记与最近 · Memos &amp; Recent",
          "轻量碎片捕获（小记）→ 结构化沉淀入库（Project / Book），以及最近访问的文档",
          false,
          `<button class="soft-button primary" data-action="new-doc-in" data-container-type="project" data-container-id="p1">${icon("plus", "small")}新建项目文档</button>`
        )}

        <div class="view-tabs">
          <button class="view-tab ${state.memosTab === "stream" ? "active" : ""}" data-action="set-memos-tab" data-tab="stream">✎ 碎片小记工作台 (${state.memos.length})</button>
          <button class="view-tab ${state.memosTab === "recent" ? "active" : ""}" data-action="set-memos-tab" data-tab="recent">${icon("clock", "small")}最近编辑与浏览文档 (${state.docs.length})</button>

        ${state.memosTab === "stream" ? `
          <div class="memos-split">
            <section class="memo-composer-panel">

                <strong>记一笔小记 (Memo)</strong>
                <span class="page-subtitle" style="margin:0">无需先选目录，随时捕获</span>
              </div>
              <textarea id="pageMemoInput" placeholder="输入闪念、会议速记、网页摘录或草稿想法…&#10;后续可一键转化为个人项目任务，或沉淀为知识库正式文档。"></textarea>
              <div class="capture-footer">
                <label class="select-control">
                  <select id="pageMemoTag">
                    ${state.tags.map(t => `<option value="${esc(t)}"># ${esc(t)}</option>`).join("")}
                  </select>
                  ${icon("down")}
                </label>
                <button class="soft-button green" data-action="add-page-memo">记一笔 (Ctrl+Enter)</button>
              </div>
            </section>

            <section>
              ${state.memos.slice().sort((a, b) => Number(b.pinned) - Number(a.pinned)).map(m => `
                <article class="memo-card ${m.pinned ? "pinned" : ""}">
                  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:11.5px;color:var(--muted)">
                    <span>${m.pinned ? "📌 已置顶 · " : ""}${esc(m.created)}</span>

                      <button class="mini-action-btn" data-action="promote-memo-doc" data-memo-id="${m.id}">📄 沉淀为正式文档</button>
                      <button class="mini-action-btn" data-action="promote-memo-task" data-memo-id="${m.id}">✓ 转为项目任务</button>
                      <button class="mini-action-btn" data-action="pin-memo" data-memo-id="${m.id}">${m.pinned ? "取消置顶" : "置顶"}</button>
                      <button class="mini-action-btn" data-action="delete-memo" data-memo-id="${m.id}">删除</button>
                    </div>
                  </div>
                  <div class="memo-mini-body" style="font-size:13.5px">${esc(m.body)}</div>
                  <div>${tagChipHtml(m.tag)}</div>

              `).join("") || `<div class="empty-state"><div><h2>暂无碎片小记</h2><p>在左侧或右侧收集箱随手记录，整理时一键沉淀为正式文档。</p></div></div>`}
            </section>
          </div>
        ` : `
          <div class="cockpit-box">
            <div class="cockpit-box-header">

            </div>
            <div class="recent-table">
              ${state.docs.map(d => {
                const c = getContainer(d.containerType, d.containerId);
                const g = c?.groups?.find(x => x.id === d.groupId);

                  <div style="display:flex;align-items:center;gap:10px;min-width:0">

                  <div style="font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">

                  <div style="font-size:11.5px;color:var(--muted)">${esc(d.edited)}</div>

          </div>
