function filterSelect(k,label,options){return `<select aria-label="${label}" data-filter="${k}">${[['',label],...options].map(([v,l])=>opt(v,l,tab()[k]||'')).join('')}</select>`}function taskView(){let a=live('task').filter(t=>(!tab().fstatus||t.status===tab().fstatus)&&(!tab().fpriority||t.priority===tab().fpriority)&&(!tab().fproject||t.project===tab().fproject));a.sort((p,q)=>tab().fsort==='title'?p.title.localeCompare(q.title,'zh-CN'):(p.date+p.time).localeCompare(q.date+q.time));const d=today();return page(`<header class="between"><h1>待办</h1>${btn('create','task','新建任务','pill','plus')}</header><div class="wrap filterbar">${filterSelect('fstatus','所有状态',Object.entries(states))}${filterSelect('fpriority','所有优先级',Object.entries(priorities))}${filterSelect('fproject','所有项目',live('project').map(p=>[p.id,p.title]))}${filterSelect('fsort','按日期排序',[['title','按标题排序']])}</div>${groupsList([['逾期',a.filter(t=>!completed(t)&&t.date&&t.date<d)],['今天',a.filter(t=>!completed(t)&&t.date===d)],['即将到来',a.filter(t=>!completed(t)&&t.date>d)],['收件箱',a.filter(t=>!completed(t)&&!t.date&&!t.project)],['项目内未排期',a.filter(t=>!completed(t)&&!t.date&&t.project)],...['done','cancel'].map(s=>[states[s],a.filter(t=>t.status===s)])])}`)}function upcoming(){let dates=[...new Set(work().filter(t=>t.date>today()).map(t=>t.date))].sort(),cols=dates.map(d=>[d,dt(d)+' '+week(d),orderTime(work().filter(t=>t.date===d))]),v=tab().upView||'list';return page(`<header class="between"><h1>即将到来</h1>${seg('upView',[['list','列表'],['board','看板']],v)}</header><div class="section">${v==='list'?groupsList(cols.map(c=>c.slice(1))):cols.length?board(cols,'date'):emp('还没有未来任务。')}</div>`)}
function calendar(mini=false){const mode=mini?'month':tab().calView||db.prefs.calDefault||'month',d=(mini?tab().miniDay:tab().calDay)||today(),x=parse(d),first=mode==='month'?d.slice(0,7)+'-01':d,offset=db.prefs.weekStart==='sunday'?parse(first).getDay():(parse(first).getDay()+6)%7,start=mode==='three'?first:shift(first,-offset),count=mode==='three'?3:mode==='week'?7:Math.ceil((offset+new Date(x.getFullYear(),x.getMonth()+1,0).getDate())/7)*7,step=(dir)=>mode==='month'?day(new Date(x.getFullYear(),x.getMonth()+dir,1)):shift(d,dir*count),move=mini?'miniDate':'calDate',ts=live('task').filter(t=>t.date&&t.status!=='cancel'),ms=live('project').flatMap(p=>p.milestones.map(m=>({...m,p})));let html=`<div class="between"><h${mini?'3':'2'}>${mode==='month'?dt(d,{year:'numeric',month:'long'}):dt(start)+' — '+dt(shift(start,count-1))}</h${mini?'3':'2'}><div>${ib(move,step(-1),'上一期','left')}${ib(move,step(1),'下一期','right')}</div></div><div class="weekgrid" style="--cols:${mode==='three'?3:7}">${Array.from({length:mode==='three'?3:7},(_,i)=>`<small style="text-align:center">${week(shift(start,i))}</small>`).join('')}${Array.from({length:count},(_,i)=>{const s=shift(start,i),n=parse(s).getDate(),list=ts.filter(t=>t.date===s),m=ms.filter(z=>z.date===s);return mini?`<button ${attr('day',s)} title="${dt(s)} · ${list.length} 项任务" class="mini-day ${s===today()?'today':''} ${list.length||m.length?'has':''}">${n}</button>`:`<div class="cal-day"><button class="date-no ${s===today()?'today':''}" title="${dt(s)}添加任务" ${attr('addDayTask',s)}>${n}</button>${list.map(t=>btn('detail',t.id,t.title,'cal-event')).join('')}${m.map(z=>nbtn('project/'+z.p.id,'◇ '+z.title,'cal-event')).join('')}</div>`}).join('')}</div>`;return mini?html:page(`<header class="between"><h1>日历</h1>${seg('calView',[['three','3 天'],['week','周'],['month','月']],mode)}</header><section class="section">${html}</section>`)}

<script>
const nodeBy=id=>obj('group',id)||obj('doc',id),nodeKind=x=>db.group.includes(x)?'group':'doc',kids=(book,parent)=>[...live('group'),...live('doc')].filter(x=>x.book===book&&x.parent===(parent||'')).sort((a,b)=>a.order-b.order),under=(x,id)=>{for(let p=x?.parent;p;p=nodeBy(p)?.parent)if(p===id)return true;return false},catRoot=()=>kind()==='project'?item().group||'':'',favButton=(k,x)=>ib('fav',k+'/'+x.id,x.fav?'取消收藏':'收藏','star','ico',`aria-pressed="${!!x.fav}" style="${x.fav?'color:var(--warning)':''}"`),wordCount=d=>d.blocks.reduce((n,b)=>n+(b.text||'').replace(/\s/g,'').length,0),dateTag=s=>s?new Date(s).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}):'',bookMark=b=>`<span class="bookmark-icon" style="--marker:${esc(b.color)}">${ic('catalog',22)}</span>`;

function catalog(){const b=obj('kb',bookId()),root=catRoot();return `<div class="cat-top row">${ic('catalog',20)}<select id="switchBook" aria-label="切换知识库">${live('kb').map(x=>opt(x.id,x.title,b.id)).join('')}</select>${ib('bookMenu',b.id,'知识库操作','more')}</div><div class="row"><input class="grow cat-input" id="catQuery" placeholder="搜索库内目录…" aria-label="过滤目录" value="${esc(tab().catQuery||'')}">${ib('addNode',root,'新建文档或分组','plus')}</div>${nbtn('kb/'+b.id,'首页','menu-item cat-home','home')}<div class="cat-label between"><b>${root?esc(nodeBy(root)?.title):'目录'}</b><div>${ib('locate','','定位当前文档','locate')}${ib('foldAll','','展开或收起全部','list')}</div></div><div id="catalogTree" role="tree" aria-label="目录">${tree(b.id,root)||emp('暂无条目')}</div>`}function bookHome(b,root='',inside=false){const ds=live('doc').filter(d=>d.book===b.id&&(!root||under(d,root)));return `<div class="${inside?'':'book-page'}">${inside?'':ib('catalog','','切换目录','sidebar')}<article class="book-paper"><header class="book-cover"><div class="between">${bookMark(b)}<div>${favButton('kb',b)}${ib('bookMenu',b.id,'知识库操作','more')}</div></div><h1>${esc(root?nodeBy(root)?.title:b.title)}</h1><small>${ds.length} 篇文档 · ${ds.reduce((n,d)=>n+wordCount(d),0)} 字</small><p>${esc(b.description)}</p></header><div class="between"><h2>目录</h2>${btn('newIn',b.id+'|'+root,'新建文档','pill','plus')}</div><hr class="hair">${tree(b.id,root,0,true)||emp('新建第一篇文档，开始整理这个知识库。')}</article></div>`}function bookShelf(){const mode=tab().shelf||'grid',books=live('kb'),tiles=a=>`<div class="${mode==='grid'?'tiles':''}">${a.map(b=>`<button class="${mode==='grid'?'tile':'listline'}" ${attr('nav','kb/'+b.id)}>${bookMark(b)}<h3>${esc(b.title)}</h3><small>${esc(b.description)}</small><p><small>${live('doc').filter(d=>d.book===b.id).length} 篇文档</small></p></button>`).join('')}</div>`;return page(`<header class="between"><h1>知识库</h1>${btn('create','kb','新建知识库','pill','plus')}</header>${section('常用知识库',tiles(books.filter(b=>b.fav))||'',seg('shelf',[[' // 仅保存允许的内联标记；粘贴内容以纯文本进入编辑器。
function inline(raw){const tmp=document.createElement('template');tmp.innerHTML=raw;const clean=n=>{if(n.nodeType===3)return esc(n.nodeValue);const tag=n.tagName?.toLowerCase(),body=[...n.childNodes].map(clean).join('');return tag==='br'?'\n':['b','strong','i','em','u','s','strike','code'].includes(tag)?`<${tag}>${body}</${tag}>`:body};return [...tmp.content.childNodes].map(clean).join('')}
function formula(src){const tokens=String(src).match(/\\[a-zA-Z]+|[0-9.]+|[^\s]/gu)||[];let i=0;const greek={alpha:'α',beta:'β',gamma:'γ',pi:'π',theta:'θ',Delta:'Δ',sum:'∑',times:'×',cdot:'·',le:'≤',ge:'≥',infty:'∞'};function atom(depth){const s=tokens[i++]||'';if(depth>48)return '<mtext>…</mtext>';if(s==='{')return expr(depth+1);if(s==='\\frac')return `<mfrac>${atom(depth+1)}${atom(depth+1)}</mfrac>`;if(s==='\\sqrt')return `<msqrt>${atom(depth+1)}</msqrt>`;const val=s[0]==='\\'?(greek[s.slice(1)]||s):s,tag=/^\d/.test(val)?'mn':/^[+×=−*/()<>∑·-]$/.test(val)?'mo':'mi';return `<${tag}>${esc(val)}</${tag}>`}function expr(depth){let a=[];while(i<tokens.length){if(tokens[i]==='}'){i++;break}let s=atom(depth),sub='',sup='';while(tokens[i]==='^'||tokens[i]==='_'){const k=tokens[i++],v=atom(depth+1);if(k==='^')sup=v;else sub=v}a.push(sub&&sup?`<msubsup>${s}${sub}${sup}</msubsup>`:sub?`<msub>${s}${sub}</msub>`:sup?`<msup>${s}${sup}</msup>`:s)}return '<mrow>'+a.join('')+'</mrow>'}return `<math display="block" aria-label="${esc(src)}">${expr(0)}</math>`}
function heads(d){return d.blocks.filter(b=>/^h[1-4]$/.test(b.kind))}function outline(d){return heads(d).map(b=>`<button class="menu-item" ${attr('jump',b.id)} style="padding-left:${8+Number(b.kind[1])*5}px">${esc(b.text||'无标题')}</button>`).join('')||emp('添加标题后会显示大纲。')}function docContext(m){const d=item();if(m==='outline')return outline(d);const refs=d.blocks.filter(b=>b.kind==='task').map(b=>obj('task',b.ref)).filter(t=>t&&!t.deleted);return section('关联任务',rows([...new Set(refs)],true)||emp('没有关联任务'))+section('反向链接',[...live('doc').filter(s=>s.blocks.some(b=>b.kind==='ref'&&b.ref==='doc/'+d.id)).map(x=>nbtn('doc/'+x.id,x.title,'listline','doc')),...live('project').filter(p=>scopedDocs(p).includes(d)).map(p=>nbtn('project/'+p.id,p.title,'listline','board'))].join('')||emp('暂无反向链接'))}

function blockHTML(b,i,d,ed){const k=b.kind,id=b.id,text=b.rich?inline(b.rich):esc(b.text),edAttr=ed?`contenteditable="true" role="textbox" aria-label="${blockNames[k]} ${i+1}" data-edit="${id}" data-placeholder="${k==='p'?'输入正文，/ 插入块':blockNames[k]}"`:'';let body='',tag='div';const edit=`<span class="editable" ${edAttr}>${text}</span>`;if(/^h[1-4]$/.test(k)){tag=k;body=edit}else if(k==='check')body=`<label><input type="checkbox" data-local-check="${id}" ${b.done?'checked':''} aria-label="普通清单：${esc(b.text)}"></label>${edit} ${ed?ib('convert',id,'转为关联任务','task','ico blockops'):''}`;else if(k==='task'){const t=obj('task',b.ref);body=t&&!t.deleted?`<div class="linked" data-linked-task="${t.id}">${check(t)}${btn('detail',t.id,t.title,'task-name')}<small>关联任务</small></div>`:'<small>关联任务已移除</small>'}else if(k==='ref')body=b.ref.startsWith('date/')?btn('day',b.ref.slice(5),'@ '+b.ref.slice(5),'chip'):nbtn(b.ref,'@ '+title(b.ref),'chip','link');else if(k==='code')body=`<div class="codebox"><div class="between"><small>${esc(b.language||'纯文本')}</small>${btn('copyCode',id,'复制','chip')}</div><pre class="editable" ${edAttr}>${text}</pre></div>`;else if(k==='math')body=`<div class="mathbox">${ed?edit:formula(b.text)}</div>`;else if(k==='table')body=`<table><tbody>${b.cells.map((r,y)=>`<tr>${r.map((c,x)=>`<td ${ed?`contenteditable="plaintext-only" data-cell="${id}|${y}|${x}" aria-label="第 ${y+1} 行 ${x+1} 列"`:''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;else if(k==='toggle')body=`<details ${ed?'open':''}><summary>展开内容</summary>${edit}</details>`;else if(k==='rule')body='<hr class="hair">';else if(k==='image')body=`<img src="${esc(b.src)}" alt="${esc(b.text)}">`;else if(k==='attachment')body=`<a class="chip" href="${esc(b.src)}" download="${esc(b.text)}">${ic('attachment')} ${esc(b.text)}</a>`;else body=(k==='ul'?'•　':k==='ol'?String(i-(d.blocks.slice(0,i).map(v=>v.kind!=='ol').lastIndexOf(true)))+'.　':'')+edit;return `<${tag} class="blk ${k}" id="blk-${id}" dat function documentPage(){const d=item(),b=obj('kb',d.book),ed=tab().edit;return `<div class="docbar"><div class="row">${ib('catalog','','切换目录','sidebar')}${nbtn('kb/'+b.id,b.title,'crumb ell')}<small class="grow ell">/　${esc(d.title)}</small>${ed?'<small class="autosave">'+(storageOK?'已自动保存':'尚未写入本地')+'</small>':''}${favButton('doc',d)}${ib('versions','','本地历史版本','history')}${ib('docMenu','','文档操作','more')}${btn('edit','',ed?'完成':'编辑','btn positive',ed?'check':'edit')}</div>${ed?toolbar():''}</div>${db.prefs.showOutline&&!rightOn()&&!ed?`<div class="outline-wrap"><button class="outline-handle" ${attr('panel','outline')} aria-label="展开文档大纲"><i></i><i></i><i></i></button><div class="outline-pop">${outline(d)}</div></div>`:''}<article class="paper"><h1 id="docTitle" ${ed?'contenteditable="plaintext-only" role="textbox" aria-label="文档标题"':''}>${esc(d.title)}</h1><div class="doc-meta">${esc(b.title)} · ${dateTag(d.updated)} 更新</div>${d.blocks.map((v,i)=>blockHTML(v,i,d,ed)).join('')}${ed&&d.blocks.every(b=>b.kind==='p'&&!b.text)?`<div class="section"><small>从模板开始</small><div class="wrap">${Object.keys(templates).map(k=>btn('useTemplate',k,k,'pill','doc')).join('')}</div></div>`:''}</article>${db.prefs.showWordCount?`<div class="doc-foot">${wordCount(d)} 字</div>`:''}`}function library(){return kind()==='doc'?documentPage():item()?bookHome(item()):bookShelf()}
