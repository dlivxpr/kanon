    /* 6. Upcoming, Calendar, Tasks, Tag, Analytics, Trash, Settings Views */
    function renderUpcomingView() {
      const open = state.tasks.filter(t => t.dueOffset !== null && t.dueOffset >= 0 && !t.done);
      const days = [...new Set([...open.map(t => t.dueOffset), ...state.events.map(e => e.dueOffset)])].filter(o => o >= 0).sort((a, b) => a - b);
      const modeBtns = `
        <button class="icon-button ${state.upcomingMode === "list" ? "active" : ""}" data-action="set-upcoming-mode" data-mode="list" title="列表视图">${icon("list")}</button>
        <button class="icon-button ${state.upcomingMode === "board" ? "active" : ""}" data-action="set-upcoming-mode" data-mode="board" title="按日看板视图">${icon("panel")}</button>
      `;
      return `<div class="page">
        ${pageHeaderHtml("近期排期 · Upcoming", "未来 30 天内跨项目的行动排期与日程节点", false, modeBtns)}
        ${state.upcomingMode === "board" ? `
          <div class="board-scroll">
            <div class="board">
              ${Array.from({length: 5}, (_, idx) => {
                const tList = open.filter(t => t.dueOffset === idx);
                const eList = state.events.filter(e => e.dueOffset === idx);
                return `<section class="board-column">
                  <div class="board-heading"><strong>${relativeDay(idx)}</strong><span class="page-subtitle">${cnShortDate(addDays(new Date(), idx))}</span></div>
                  ${eList.map(e => `<div class="board-card">${renderEventRow(e, true)}</div>`).join("")}
                  ${tList.map(t => `<div class="board-card">${renderTaskRow(t, true)}</div>`).join("") || (!eList.length ? `<p class="page-subtitle">无排期</p>` : "")}
                </section>`;
              }).join("")}
            </div>
          </div>
        ` : days.map(off => `
          <section>
            <h2 class="group-heading"><span class="left">${relativeDay(off)} · ${cnShortDate(addDays(new Date(), off))}</span></h2>
            <div class="cockpit-box" style="padding:10px 14px">
              ${state.events.filter(e => e.dueOffset === off).map(e => renderEventRow(e, true)).join("")}
              ${open.filter(t => t.dueOffset === off).map(t => renderTaskRow(t, true)).join("")}
            </div>
          </section>
        `).join("")}
      </div>`;
    }

    function renderCalendarView() {
      const extra = `<label class="select-control">
        <select data-change="calendar-mode" aria-label="日历视图跨度">
          <option value="three" ${state.calendarMode === "three" ? "selected" : ""}>3 天视图</option>
          <option value="week" ${state.calendarMode === "week" ? "selected" : ""}>周视图</option>
          <option value="month" ${state.calendarMode === "month" ? "selected" : ""}>月视图</option>
        </select>
        ${icon("down")}
      </label>`;

      if (state.calendarMode === "month") {
        const y = state.selectedDate.getFullYear(), m = state.selectedDate.getMonth();
        const first = new Date(y, m, 1);
        const start = addDays(first, -((first.getDay() + 6) % 7));
        const cells = Array.from({length: 35}, (_, i) => addDays(start, i));
        return `<div class="page">
          ${pageHeaderHtml(`${y}年${m + 1}月`, "日历月视图 · 聚合日程与项目任务", true, extra)}
          <div class="calendar-wrap">
            <div class="month-calendar">
              ${["周一","周二","周三","周四","周五","周六","周日"].map(d => `<div class="calendar-cell heading">${d}</div>`).join("")}
              ${cells.map(d => {
                const off = dayOffset(d);
                const dayT = state.tasks.filter(t => t.dueOffset === off && !t.done);
                const dayE = state.events.filter(e => e.dueOffset === off);
                return `<button class="month-cell ${d.getMonth() !== m ? "muted" : ""} ${off === 0 ? "today" : ""}" data-action="select-date" data-date="${localISO(d)}">
                  <span class="month-number">${d.getDate()}</span>
                  ${dayE.slice(0, 1).map(e => `<div class="calendar-event" style="margin-top:4px">${esc(e.title)}</div>`).join("")}
                  ${dayT.slice(0, 1).map(t => `<div class="calendar-event calendar-task" style="margin-top:3px">${esc(t.title)}</div>`).join("")}
                </button>`;
              }).join("")}
            </div>
          </div>
        </div>`;
      }

      const count = state.calendarMode === "three" ? 3 : 7;
      const days = Array.from({length: count}, (_, i) => addDays(state.selectedDate, i));
      const hours = [8, 10, 12, 14, 16, 18, 20];
      let grid = `<div class="calendar-wrap"><div class="week-calendar ${count === 3 ? "three-days" : ""}"><div class="calendar-cell heading"></div>`;
      grid += days.map(d => `<div class="calendar-cell heading ${dayOffset(d) === 0 ? "today" : ""}"><strong>${d.toLocaleDateString("zh-CN", {weekday: "short"})}</strong><div>${d.getDate()}日</div></div>`).join("");
      hours.forEach(hr => {
        grid += `<div class="calendar-cell time">${String(hr).padStart(2, "0")}:00</div>`;
        days.forEach(d => {
          const off = dayOffset(d);
          const evs = state.events.filter(e => e.dueOffset === off && e.time && Number(e.time.split(":")[0]) >= hr && Number(e.time.split(":")[0]) < hr + 2);
          const tks = state.tasks.filter(t => t.dueOffset === off && t.time && Number(t.time.split(":")[0]) >= hr && Number(t.time.split(":")[0]) < hr + 2 && !t.done);
          grid += `<div class="calendar-cell">
            ${evs.map(e => `<div class="calendar-event">● ${esc(e.title)}<br>${e.time}</div>`).join("")}
            ${tks.map(t => `<button class="calendar-event calendar-task" data-action="open-task" data-task-id="${t.id}">○ ${esc(t.title)}<br>${t.time}</button>`).join("")}
          </div>`;
        });
      });
      grid += `</div></div>`;
      return `<div class="page">${pageHeaderHtml("日历 · Calendar", cnFullDate(state.selectedDate), true, extra)}${grid}</div>`;
    }

    function renderTasksView() {
      const controls = `
        <label class="select-control">
          <select data-change="task-sort">
            <option value="due" ${state.taskSort === "due" ? "selected" : ""}>按排期与时间</option>
            <option value="project" ${state.taskSort === "project" ? "selected" : ""}>按所属个人项目分组</option>
          </select>
          ${icon("down")}
        </label>
        <button class="icon-button ${state.tasksMode === "list" ? "active" : ""}" data-action="set-tasks-mode" data-mode="list" title="列表">${icon("list")}</button>
        <button class="icon-button ${state.tasksMode === "board" ? "active" : ""}" data-action="set-tasks-mode" data-mode="board" title="看板">${icon("panel")}</button>
      `;

      const groups = state.taskSort === "project"
        ? state.projects.map(p => ({ title: `${p.emoji} ${p.name}`, list: state.tasks.filter(t => t.projectId === p.id && !t.done) }))
        : [
            { title: "今日推进 (Today)", list: state.tasks.filter(t => t.dueOffset === 0 && !t.done) },
            { title: "逾期未完 (Overdue)", list: state.tasks.filter(t => t.dueOffset !== null && t.dueOffset < 0 && !t.done) },
            { title: "近期排期 (Upcoming)", list: state.tasks.filter(t => t.dueOffset !== null && t.dueOffset > 0 && !t.done) },
            { title: "收集箱未排期 (Inbox)", list: state.tasks.filter(t => t.dueOffset === null && !t.done) },
            { title: "已完成 (Completed)", list: state.tasks.filter(t => t.done) }
          ];

      if (state.tasksMode === "board") {
        return `<div class="page">
          ${pageHeaderHtml("全部任务 · Tasks", `${state.tasks.filter(t => !t.done).length} 项待推进任务`, false, controls)}
          <div class="board-scroll">
            <div class="board">
              ${groups.map(g => `
                <section class="board-column">
                  <div class="board-heading"><strong>${esc(g.title)}</strong><span class="page-subtitle">${g.list.length}</span></div>
                  ${g.list.map(t => `<div class="board-card">${renderTaskRow(t, true)}</div>`).join("") || `<p class="page-subtitle">暂无任务</p>`}
                </section>
              `).join("")}
            </div>
          </div>
        </div>`;
      }

      return `<div class="page">
        ${pageHeaderHtml("全部任务 · Tasks", `${state.tasks.filter(t => !t.done).length} 项待推进任务`, false, controls)}
        ${groups.filter(g => g.list.length).map(g => `
          <section>
            <h2 class="group-heading"><span class="left">${esc(g.title)}</span><span class="count">${g.list.length}</span></h2>
            <div class="task-list">${g.list.map(t => renderTaskRow(t)).join("")}</div>
          </section>
        `).join("")}
      </div>`;
    }

    function renderTagView(tag) {
      const tDocs = state.docs.filter(d => d.tag === tag);
      const tTasks = state.tasks.filter(t => t.tag === tag);
      const tMemos = state.memos.filter(m => m.tag === tag);
      return `<div class="page">
        ${pageHeaderHtml(`# ${esc(tag)}`, `跨项目与知识库标签聚合 · ${tDocs.length} 篇文档 · ${tTasks.length} 项任务 · ${tMemos.length} 条小记`)}
        <div class="cockpit-grid" style="margin-top:20px">
          <section class="cockpit-box">
            <h2 class="cockpit-box-title" style="margin-bottom:12px">📄 关联文档 (${tDocs.length})</h2>
            ${tDocs.map(d => `<button class="catalog-book-row" data-action="open-doc" data-doc-id="${d.id}"><span>${esc(d.emoji)}</span><span class="catalog-book-title">${esc(d.title)}</span><span class="dot-leader"></span><span class="catalog-book-meta">${esc(d.edited)}</span></button>`).join("") || `<p class="page-subtitle">暂无该标签文档</p>`}
          </section>
          <section class="cockpit-box">
            <h2 class="cockpit-box-title" style="margin-bottom:12px">✓ 关联任务与小记 (${tTasks.length + tMemos.length})</h2>
            ${tTasks.map(t => renderTaskRow(t, true)).join("")}
            ${tMemos.map(m => `<div class="memo-mini-card" style="margin-top:8px"><div class="memo-mini-body">${esc(m.body)}</div></div>`).join("")}
          </section>
        </div>
      </div>`;
    }

    function renderSettingsView() {
      const accents = [
        ["#ff4f4f", "Woday 珊瑚红"],
        ["#00b96b", "语雀翡翠绿"],
        ["#f29d38", "暖琥珀黄"],
        ["#438ee6", "深海湛蓝"],
        ["#8b5cf6", "静谧鸢尾紫"]
      ];
      return `<div class="page">
        ${pageHeaderHtml("外观与偏好设置 · Settings", "定制 Kanon 的主题、强调色与工作台行为")}
        <div class="settings-layout">
          <nav class="settings-nav">
            ${["Appearance", "General"].map(tab => `
              <button class="nav-item ${state.settingsTab === tab ? "active" : ""}" data-action="set-settings-tab" data-tab="${tab}">
                ${icon(tab === "Appearance" ? "sparkle" : "settings")}<span class="nav-label">${tab === "Appearance" ? "外观与主题" : "通用与数据"}</span>
              </button>
            `).join("")}
          </nav>
          <section>
            ${state.settingsTab === "Appearance" ? `
              <div class="setting-row">
                <div><div class="setting-label">面板配色模式</div><div class="setting-description">保留近黑窗口外壳，切换主面板与副面板的明暗底色。</div></div>
                <div style="display:flex;gap:8px">
                  ${[["light","暖白浅色"],["dark","深邃暗色"]].map(([v, l]) => `<button class="soft-button ${state.theme === v ? "primary" : ""}" data-action="set-theme" data-theme="${v}">${l}</button>`).join("")}
                </div>
              </div>
              <div class="setting-row">
                <div><div class="setting-label">品牌主强调色 (Accent Token)</div><div class="setting-description">支持在 Woday 珊瑚红与语雀绿等强调色之间即时切换。</div></div>
                <div class="accent-options" style="padding:0">
                  ${accents.map(([hex, label]) => `<button class="accent-option ${state.accent === hex ? "active" : ""}" style="--swatch:${hex}" data-action="set-accent" data-accent="${hex}" title="${label}"></button>`).join("")}
                </div>
              </div>
              <div class="setting-row">
                <div><div class="setting-label">界面字号缩放</div><div class="setting-description">按比例调整全局导航、列表与正文字号。</div></div>
                <div style="display:flex;gap:8px">
                  ${[[0.95,"紧凑"],[1,"标准"],[1.08,"舒展"]].map(([sc, l]) => `<button class="soft-button ${state.textScale === sc ? "primary" : ""}" data-action="set-scale" data-scale="${sc}">${l}</button>`).join("")}
                </div>
              </div>
            ` : `
              <div class="setting-row">
                <div><div class="setting-label">重置演示数据</div><div class="setting-description">恢复初始的个人项目、知识库目录树、文档、任务与小记。</div></div>
                <button class="soft-button danger" data-action="reset-demo">恢复初始演示数据</button>
              </div>
            `}
          </section>
        </div>
      </div>`;
    }

    function renderAnalyticsView() {
      const done = state.tasks.filter(t => t.done).length;
      const total = state.tasks.length;
      return `<div class="page">
        ${pageHeaderHtml("数据与推进统计 · Analytics", "个人项目推进、知识沉淀与日常执行概览")}
        <div class="collection-grid">
          <div class="cockpit-box"><strong>${state.projects.length} 个</strong><p class="page-subtitle">个人项目 (Projects)</p></div>
          <div class="cockpit-box"><strong>${state.books.length} 个 / ${state.docs.length} 篇</strong><p class="page-subtitle">知识库与成书文档 (Books &amp; Docs)</p></div>
          <div class="cockpit-box"><strong>${done} / ${total} (${total ? Math.round(done/total*100) : 0}%)</strong><p class="page-subtitle">行动任务完成率 (Tasks)</p></div>
        </div>
      </div>`;
    }

    function renderTrashView() {
      return `<div class="page">
        ${pageHeaderHtml("回收站 · Trash", `${state.trash.length} 项已删除内容`)}
        ${state.trash.length ? state.trash.map((item, idx) => `
          <div class="recent-row">
            <div><strong>${esc(item.title || item.body)}</strong></div>
            <div class="page-subtitle">${item.kind}</div>
            <div></div>
            <button class="soft-button" data-action="restore-trash" data-index="${idx}">恢复</button>
          </div>
        `).join("") : `<div class="empty-state"><div><h2>回收站为空</h2><p>删除的任务、小记或文档会暂存在这里。</p></div></div>`}
      </div>`;
    }

    function renderMain() {
      if (state.view === "today") mainPanel.innerHTML = renderTodayView();
      else if (state.view === "project") mainPanel.innerHTML = renderProjectView(state.params.projectId);
      else if (state.view === "book") mainPanel.innerHTML = renderBookView(state.params.bookId);
      else if (state.view === "doc") mainPanel.innerHTML = renderDocView(state.params.docId);
      else if (state.view === "memos") mainPanel.innerHTML = renderMemosView();
      else if (state.view === "upcoming") mainPanel.innerHTML = renderUpcomingView();
      else if (state.view === "calendar") mainPanel.innerHTML = renderCalendarView();
      else if (state.view === "tasks") mainPanel.innerHTML = renderTasksView();
      else if (state.view === "tag") mainPanel.innerHTML = renderTagView(state.params.tag);
      else if (state.view === "settings") mainPanel.innerHTML = renderSettingsView();
      else if (state.view === "analytics") mainPanel.innerHTML = renderAnalyticsView();
      else if (state.view === "trash") mainPanel.innerHTML = renderTrashView();
      else mainPanel.innerHTML = renderTodayView();
    }

    /* Right Adaptive Panel: 1. Inbox (Task + Memo) | 2. Outline & Backlinks | 3. Task Detail | 4. Mini Calendar | 5. AI Assistant */
    function renderRight() {
      const inboxCount = state.tasks.filter(t => t.dueOffset === null && !t.done).length + state.memos.length;
      $("#inboxBadge").textContent = inboxCount;

      $$("[data-action='set-right']").forEach(btn => {
        btn.classList.toggle("active", state.rightOpen && btn.dataset.mode === state.rightMode);
      });
      if (!state.rightOpen) return;

      /* Mode A: Outline & Backlinks (Context-aware for Document, or fallback to current/last doc) */
      if (state.rightMode === "outline") {
        const activeDoc = getDoc(state.params.docId) || state.docs[0];
        const tmp = document.createElement("div");
        tmp.innerHTML = activeDoc ? activeDoc.body : "";
        const headings = [...tmp.querySelectorAll("h2, h3")].map((h, i) => ({
          level: h.tagName === "H3" ? 3 : 2,
          text: h.textContent,
          index: i
        }));
        const linkedTasks = state.tasks.filter(t => t.docId === activeDoc?.id);
        const backlinkDocs = state.docs.filter(d => d.id !== activeDoc?.id && d.body.includes(`data-doc-id="${activeDoc?.id}"`));

        rightPanel.innerHTML = `<div class="right-content">
          <div class="right-header">
            <h2 class="right-title">大纲与关联</h2>
            <span class="summary-chip">${esc(activeDoc?.emoji || "📄")} ${esc(activeDoc?.title.slice(0, 10) || "")}…</span>
          </div>

          <div class="detail-section" style="margin-top:6px;padding-top:0;border-top:0">
            <h3>📑 文档结构大纲 (OUTLINE)</h3>
            ${headings.length ? `<div class="outline-list">
              ${headings.map(h => `<button class="outline-item level-${h.level}" data-action="scroll-heading" data-doc-id="${activeDoc.id}" data-heading-index="${h.index}">${esc(h.text)}</button>`).join("")}
            </div>` : `<p class="page-subtitle">当前文档暂无 H2/H3 标题。</p>`}
          </div>

          <div class="detail-section">
            <h3>🚀 关联的任务推进 (${linkedTasks.length})</h3>
            ${linkedTasks.length ? linkedTasks.map(t => renderTaskRow(t, true)).join("") : `<p class="page-subtitle">暂无关联任务。</p>`}
            <button class="soft-button" style="width:100%;margin-top:8px" data-action="add-doc-synced-task" data-doc-id="${activeDoc.id}">+ 为本文档新建关联任务</button>
          </div>

          <div class="detail-section">
            <h3>🔗 双链知识网络 (BACKLINKS · ${backlinkDocs.length})</h3>
            ${backlinkDocs.length ? backlinkDocs.map(d => {
              const c = getContainer(d.containerType, d.containerId);
              return `<button class="backlink-card" data-action="open-doc" data-doc-id="${d.id}">
                <span class="backlink-title">${esc(d.emoji)} ${esc(d.title)}</span>
                <span class="backlink-meta">来自 ${esc(c?.name || "")} · 正文中 @ 引用了本文档</span>
              </button>`;
            }).join("") : `<p class="page-subtitle">尚无其他文档通过 @ 引用本文档。</p>`}
          </div>
        </div>`;
        return;
      }

      /* Mode B: Task Detail */
      if (state.rightMode === "task") {
        const task = getTask(state.selectedTaskId) || state.tasks[0];
        if (task) {
          const dueVal = task.dueOffset === null ? "inbox" : task.dueOffset < 0 ? "overdue" : task.dueOffset === 0 ? "today" : task.dueOffset === 1 ? "tomorrow" : "later";
          rightPanel.innerHTML = `<div class="right-content">
            <div class="detail-header">
              <button class="task-check ${task.done ? "completed" : task.priority}" data-action="toggle-task" data-task-id="${task.id}">${task.done ? icon("check") : ""}</button>
              <div class="page-actions">
                <button class="icon-button" data-action="delete-task" data-task-id="${task.id}" title="移入回收站">${icon("trash", "small")}</button>
                <button class="icon-button" data-action="set-right" data-mode="inbox" title="返回收集箱">${icon("x", "small")}</button>
              </div>
            </div>
            <h2 class="detail-title" contenteditable="true" data-task-title-edit="${task.id}">${esc(task.title)}</h2>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
              ${task.habit ? `<span class="summary-chip red">🔥 连续 ${task.streak || 5} 天习惯</span>` : ""}
              ${projectChipHtml(task.projectId)}
              ${task.docId ? docChipHtml(task.docId) : ""}
              ${tagChipHtml(task.tag)}
            </div>

            <div class="detail-section">
              <h3>排期与归属项目</h3>
              <label class="detail-field"><span>执行日期</span>
                <select data-task-field="dueOffset" data-task-id="${task.id}">
                  <option value="inbox" ${dueVal === "inbox" ? "selected" : ""}>收集箱 (未排期)</option>
                  <option value="overdue" ${dueVal === "overdue" ? "selected" : ""}>昨日遗留</option>
                  <option value="today" ${dueVal === "today" ? "selected" : ""}>今天 (Today)</option>
                  <option value="tomorrow" ${dueVal === "tomorrow" ? "selected" : ""}>明天 (Tomorrow)</option>
                  <option value="later" ${dueVal === "later" ? "selected" : ""}>下周/近期</option>
                </select>
              </label>
              <label class="detail-field"><span>时间点</span>
                <input type="time" value="${esc(task.time || "")}" data-task-field="time" data-task-id="${task.id}">
              </label>
              <label class="detail-field"><span>优先级</span>
                <select data-task-field="priority" data-task-id="${task.id}">
                  ${[["none","无"],["low","低优"],["medium","中优"],["high","高优"]].map(([v, l]) => `<option value="${v}" ${task.priority === v ? "selected" : ""}>${l}</option>`).join("")}
                </select>
              </label>
              <label class="detail-field"><span>所属项目</span>
                <select data-task-field="projectId" data-task-id="${task.id}">
                  <option value="">无所属项目</option>
                  ${state.projects.map(p => `<option value="${p.id}" ${task.projectId === p.id ? "selected" : ""}>${esc(p.emoji)} ${esc(p.name)}</option>`).join("")}
                </select>
              </label>
              <label class="detail-field"><span>关联文档</span>
                <select data-task-field="docId" data-task-id="${task.id}">
                  <option value="">未关联文档</option>
                  ${state.docs.map(d => `<option value="${d.id}" ${task.docId === d.id ? "selected" : ""}>${esc(d.emoji)} ${esc(d.title)}</option>`).join("")}
                </select>
              </label>
            </div>

            <div class="detail-section">
              <h3>子任务拆解与备注</h3>
              ${(task.subtasks || []).map(sub => `
                <div class="task-row compact ${sub.done ? "completed" : ""}">
                  <button class="task-check ${sub.done ? "completed" : ""}" data-action="toggle-subtask" data-task-id="${task.id}" data-sub-id="${sub.id}">${sub.done ? icon("check") : ""}</button>
                  <div class="task-content"><span class="task-title">${esc(sub.title)}</span></div>
                </div>
              `).join("")}
              <div style="display:flex;gap:6px;margin-top:8px">
                <input id="newSubtaskInput" placeholder="输入子步骤回车添加…" style="flex:1;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--soft);outline:0;font-size:12px">
                <button class="soft-button" data-action="add-subtask" data-task-id="${task.id}">添加</button>
              </div>
              <textarea class="detail-notes" data-task-notes="${task.id}" placeholder="补充任务执行上下文或参考信息…">${esc(task.notes || "")}</textarea>
            </div>
          </div>`;
          return;
        }
      }

      /* Mode C: Mini Calendar */
      if (state.rightMode === "calendar") {
        const y = state.selectedDate.getFullYear(), m = state.selectedDate.getMonth();
        const first = new Date(y, m, 1);
        const start = addDays(first, -((first.getDay() + 6) % 7));
        const cells = Array.from({length: 42}, (_, i) => addDays(start, i));
        rightPanel.innerHTML = `<div class="right-content">
          <div class="right-header">
            <h2 class="right-title">迷你日历</h2>
            <button class="soft-button" data-action="nav-view" data-view="calendar">打开大日历</button>
          </div>
          <div class="mini-calendar-header">
            <button class="icon-button" data-action="shift-month" data-amount="-1">${icon("left", "small")}</button>
            <strong>${y}年${m + 1}月</strong>
            <button class="icon-button" data-action="shift-month" data-amount="1">${icon("right", "small")}</button>
          </div>
          <div class="mini-calendar-grid">
            ${["一","二","三","四","五","六","日"].map(d => `<span class="weekday">${d}</span>`).join("")}
            ${cells.map(d => `<button class="mini-day ${d.getMonth() !== m ? "muted" : ""} ${dayOffset(d) === 0 ? "today" : ""} ${localISO(d) === localISO(state.selectedDate) ? "selected" : ""}" data-action="select-date" data-date="${localISO(d)}">${d.getDate()}</button>`).join("")}
          </div>
        </div>`;
        return;
      }

      /* Mode D: AI Assistant */
      if (state.rightMode === "assistant") {
        rightPanel.innerHTML = `<div class="right-content">
          <div class="right-header">
            <h2 class="right-title">AI 助手</h2>
            <span class="summary-chip">本地优先</span>
          </div>
          <div class="cockpit-box" style="margin-top:12px">
            <p style="margin:0 0 10px;font-size:12.5px;line-height:1.6;color:var(--text-body)">Kanon AI 可协助你将<strong>收集箱中的碎片小记（Memo）</strong>提炼为结构化项目文档，或从长篇会议纪要中自动拆解待办任务。</p>
            <button class="soft-button primary" style="width:100%" data-action="ai-demo-extract">✨ 从最新小记提炼任务</button>
          </div>
        </div>`;
        return;
      }

      /* Default Mode E: Unified Inbox (Task + Memo Capture & Triage Funnel) */
      const inboxTasks = state.tasks.filter(t => t.dueOffset === null && !t.done);
      const todayOverdueTasks = state.tasks.filter(t => t.dueOffset !== null && t.dueOffset <= 0 && !t.done);

      rightPanel.innerHTML = `<div class="right-content">
        <div class="right-header">
          <h2 class="right-title">收集箱 · Inbox</h2>
          <label class="select-control">
            <select data-change="inbox-filter" aria-label="过滤收集箱">
              <option value="all" ${state.inboxFilter === "all" ? "selected" : ""}>全部 (${inboxTasks.length + state.memos.length})</option>
              <option value="tasks" ${state.inboxFilter === "tasks" ? "selected" : ""}>仅待办 Task</option>
              <option value="memos" ${state.inboxFilter === "memos" ? "selected" : ""}>仅小记 Memo</option>
            </select>
            ${icon("down")}
          </label>
        </div>

        <div class="capture-switch" role="tablist" aria-label="速记类型切换">
          <button class="${state.captureKind === "task" ? "active" : ""}" data-action="set-capture-kind" data-kind="task">○ 速记待办 Task</button>
          <button class="${state.captureKind === "memo" ? "active" : ""}" data-action="set-capture-kind" data-kind="memo">✎ 速记小记 Memo</button>
        </div>

        ${state.captureKind === "task" ? `
          <div class="capture-box">
            <input id="inboxTaskInput" placeholder="输入待办事项，回车收入收集箱…" autocomplete="off">
            <div class="capture-footer">
              <span style="font-size:11px;color:var(--muted)">默认进入未排期收集箱</span>
              <button class="soft-button primary" style="min-height:26px;padding:3px 10px" data-action="submit-inbox-task">添加任务</button>
            </div>
          </div>
        ` : `
          <div class="capture-box">
            <textarea id="inboxMemoInput" placeholder="随手记下闪念、摘录或草稿（语雀小记体验）…"></textarea>
            <div class="capture-footer">
              <span style="font-size:11px;color:var(--muted)">后续可一键转文档或任务</span>
              <button class="soft-button green" style="min-height:26px;padding:3px 10px" data-action="submit-inbox-memo">记一笔小记</button>
            </div>
          </div>
        `}

        ${state.inboxFilter !== "tasks" ? `
          <div class="group-heading" style="margin-top:14px">
            <span class="left">✎ 碎片小记 (Memos)</span>
            <button class="text-button" data-action="nav-view" data-view="memos">管理全部 →</button>
          </div>
          ${state.memos.slice(0, 4).map(m => `
            <div class="memo-mini-card">
              <div class="memo-mini-body">${esc(m.body)}</div>
              <div class="memo-mini-foot">
                <span>${esc(m.created)} · #${esc(m.tag)}</span>
                <div class="memo-mini-actions">
                  <button class="mini-action-btn" data-action="promote-memo-doc" data-memo-id="${m.id}" title="将此小记沉淀为项目或知识库下的正式文档">📄 转文档</button>
                  <button class="mini-action-btn" data-action="promote-memo-task" data-memo-id="${m.id}" title="将此小记转化为待办任务">✓ 转任务</button>
                </div>
              </div>
            </div>
          `).join("") || `<p class="page-subtitle">暂无小记。</p>`}
        ` : ""}

        ${state.inboxFilter !== "memos" ? `
          <div class="group-heading" style="margin-top:16px">
            <span class="left">○ 待分流排期任务 (Inbox Tasks)</span>
            <span class="count">${inboxTasks.length}</span>
          </div>
          <div class="task-list">
            ${inboxTasks.map(t => renderTaskRow(t, true)).join("") || `<p class="page-subtitle">收集箱任务已全部排期清零。</p>`}
          </div>

          <div class="group-heading" style="margin-top:16px">
            <span class="left">⚡ 今日与逾期 (${todayOverdueTasks.length})</span>
          </div>
          <div class="task-list">
            ${todayOverdueTasks.slice(0, 5).map(t => renderTaskRow(t, true)).join("")}
          </div>
        ` : ""}
      </div>`;
    }

    /* Master Render */
    function render() {
      document.documentElement.dataset.theme = state.theme;
      document.documentElement.style.setProperty("--font-scale", state.textScale);
      document.documentElement.style.setProperty("--accent", state.accent);
      document.documentElement.style.setProperty("--accent-ink", state.accent);
      document.documentElement.style.setProperty("--accent-soft", `color-mix(in srgb, ${state.accent} 13%, transparent)`);

      appWindow.classList.toggle("right-hidden", !state.rightOpen);
      appWindow.classList.toggle("sidebar-collapsed", state.sidebarCollapsed);

      $$("[data-action='nav-back']").forEach(b => b.disabled = !state.past.length);
      $$("[data-action='nav-forward']").forEach(b => b.disabled = !state.future.length);

      renderSidebar();
      renderMain();
      renderRight();
    }

    /* Navigation & History */
    function navigate(view, params = {}, fromHistory = false) {
      if (!fromHistory) {
        state.past.push({ view: state.view, params: { ...state.params } });
        if (state.past.length > 40) state.past.shift();
        state.future = [];
      }
      state.view = view;
      state.params = params;
      if (view !== "doc") state.docEditMode = false;

      // Single-accordion rule in left sidebar: auto-expand active Project or Book
      if (view === "project" && params.projectId) {
        state.expandedContainer = params.projectId;
      } else if (view === "book" && params.bookId) {
        state.expandedContainer = params.bookId;
      } else if (view === "doc" && params.docId) {
        const doc = getDoc(params.docId);
        if (doc) state.expandedContainer = doc.containerId;
      }

      render();
      mainPanel.scrollTop = 0;
    }

    /* Promote Memo to Formal Document Modal */
    function openPromoteMemoModal(memoId) {
      const memo = state.memos.find(m => m.id === memoId);
      if (!memo) return;
      $("#promoteMemoId").value = memo.id;
      const firstLine = memo.body.split("\n")[0].replace(/^[闪念备忘待整理：:\s]+/, "").slice(0, 28);
      $("#promoteDocTitle").value = firstLine || "从小记沉淀的文档";

      const containerSelect = $("#promoteContainer");
      containerSelect.innerHTML = [
        ...state.projects.map(p => `<option value="project:${p.id}">${esc(p.emoji)} 个人项目：${esc(p.name)}</option>`),
        ...state.books.map(b => `<option value="book:${b.id}">${esc(b.emoji)} 长期知识库：${esc(b.name)}</option>`)
      ].join("");

      updatePromoteGroupOptions();
      $("#promoteMemoDialog").showModal();
    }

    function updatePromoteGroupOptions() {
      const [type, id] = ($("#promoteContainer").value || "project:p1").split(":");
      const c = getContainer(type, id);
      $("#promoteGroup").innerHTML = (c?.groups || []).map(g => `<option value="${g.id}">${esc(g.title)}</option>`).join("");
    }

    $("#promoteContainer")?.addEventListener("change", updatePromoteGroupOptions);

    $("#promoteMemoForm")?.addEventListener("submit", ev => {
      ev.preventDefault();
      const memoId = $("#promoteMemoId").value;
      const memoIdx = state.memos.findIndex(m => m.id === memoId);
      const memo = state.memos[memoIdx];
      const title = $("#promoteDocTitle").value.trim() || "未命名文档";
      const [containerType, containerId] = $("#promoteContainer").value.split(":");
      const groupId = $("#promoteGroup").value;

      const newDocId = `d${Date.now()}`;
      state.docs.unshift({
        id: newDocId,
        containerType,
        containerId,
        groupId,
        title,
        emoji: "📄",
        cover: "none",
        tag: memo?.tag || "知识管理",
        favorite: false,
        edited: "刚刚",
        body: `<h2>一、核心背景（由小记沉淀）</h2><p>${esc(memo?.body || "")}</p><h2>二、延伸方案与结构化整理</h2><p>在此继续补充结构化内容，或点击顶部「编辑文档 (E)」插入代码块、表格与项目任务。</p>`,
        checklists: []
      });
      if (memoIdx >= 0) state.memos.splice(memoIdx, 1);
      persist();
      $("#promoteMemoDialog").close();
      state.rightMode = "outline";
      navigate("doc", { docId: newDocId });
      toast("小记已沉淀为正式文档并打开");
    });

    /* Create Project / Book Modal */
    function openNewContainerModal(kind) {
      $("#containerKind").value = kind;
      $("#containerName").value = "";
      $("#containerGoal").value = "";
      if (kind === "project") {
        $("#containerDialogTitle").textContent = "新建个人项目 (Project)";
        $("#containerDialogDesc").textContent = "个人项目同时聚合「目标方案、结构化文档树与行动任务」。";
        $("#containerGoalField").style.display = "grid";
        $("#containerPresetField").style.display = "grid";
      } else {
        $("#containerDialogTitle").textContent = "新建长期知识库 (Book)";
        $("#containerDialogDesc").textContent = "像整理一本书一样通过层级目录沉淀长期主题知识。";
        $("#containerGoalField").style.display = "none";
        $("#containerPresetField").style.display = "none";
      }
      $("#containerDialog").showModal();
      requestAnimationFrame(() => $("#containerName").focus());
    }

    $("#containerForm")?.addEventListener("submit", ev => {
      ev.preventDefault();
      const kind = $("#containerKind").value;
      const name = $("#containerName").value.trim();
      if (!name) return;
      if (kind === "project") {
        const id = `p${Date.now()}`;
        const preset = $("#containerPreset").value;
        const groups = preset === "gld"
          ? [
              { id: `g_${Date.now()}_1`, title: "01 目标与方案 (Goal)", collapsed: false },
              { id: `g_${Date.now()}_2`, title: "02 调研与学习 (Learn)", collapsed: false },
              { id: `g_${Date.now()}_3`, title: "03 记录与复盘 (Do / Review)", collapsed: false }
            ]
          : [
              { id: `g_${Date.now()}_1`, title: "01 项目概览", collapsed: false },
              { id: `g_${Date.now()}_2`, title: "02 核心文档", collapsed: false }
            ];
        state.projects.push({
          id,
          name,
          emoji: "🎯",
          status: "active",
          due: "2026-12-31",
          goal: $("#containerGoal").value.trim() || `围绕「${name}」明确目标、沉淀方案并拆解日常行动。`,
          favorite: false,
          groups
        });
        persist();
        $("#containerDialog").close();
        navigate("project", { projectId: id });
        toast(`已创建个人项目「${name}」`);
      } else {
        const id = `b${Date.now()}`;
        state.books.push({
          id,
          name,
          emoji: "📙",
          desc: `围绕「${name}」构建的长期结构化知识库。`,
          favorite: false,
          groups: [
            { id: `bg_${Date.now()}_1`, title: "01 核心概念与索引", collapsed: false },
            { id: `bg_${Date.now()}_2`, title: "02 专题深潜", collapsed: false }
          ]
        });
        persist();
        $("#containerDialog").close();
        navigate("book", { bookId: id });
        toast(`已创建知识库「${name}」`);
      }
    });

    /* Search & Command Launcher (⌘K) */
    function buildSearchResults(query) {
      const q = query.trim().toLowerCase();
      if (q.startsWith(">")) {
        const cmdQuery = q.slice(1).trim();
        const cmds = [
          { type: "cmd", id: "cmd-new-project", title: "新建个人项目 (Project)", emoji: "🚀", desc: "创建带 Goal/Learn/Do 目录预设的新项目" },
          { type: "cmd", id: "cmd-new-book", title: "新建长期知识库 (Book)", emoji: "📘", desc: "创建语雀式成书知识库" },
          { type: "cmd", id: "cmd-theme", title: "切换明暗面板主题 (Light / Dark)", emoji: "🌓", desc: "切换暖白或深色面板" },
          { type: "cmd", id: "cmd-accent-green", title: "切换强调色为「语雀翡翠绿」", emoji: "🌿", desc: "#00b96b" },
          { type: "cmd", id: "cmd-accent-red", title: "切换强调色为「Woday 珊瑚红」", emoji: "🔴", desc: "#ff4f4f" },
          { type: "cmd", id: "cmd-today", title: "前往「今日推进 (Today)」", emoji: "☀️", desc: "查看今日日程与项目任务" }
        ];
        return cmds.filter(c => !cmdQuery || c.title.toLowerCase().includes(cmdQuery));
      }
      if (!q) {
        return [
          ...state.projects.map(p => ({ type: "project", id: p.id, title: p.name, emoji: p.emoji, desc: `个人项目 · ${statusMeta(p.status).label}` })),
          ...state.books.map(b => ({ type: "book", id: b.id, title: b.name, emoji: b.emoji, desc: "长期知识库 (Book)" })),
          ...state.docs.slice(0, 4).map(d => ({ type: "doc", id: d.id, title: d.title, emoji: d.emoji, desc: "成书文档 (Document)" })),
          ...state.tasks.filter(t => !t.done).slice(0, 3).map(t => ({ type: "task", id: t.id, title: t.title, emoji: "○", desc: "待办任务 (Task)" }))
        ];
      }
      return [
        ...state.projects.filter(p => `${p.name} ${p.goal}`.toLowerCase().includes(q)).map(p => ({ type: "project", id: p.id, title: p.name, emoji: p.emoji, desc: "个人项目 (Project)" })),
        ...state.books.filter(b => `${b.name} ${b.desc}`.toLowerCase().includes(q)).map(b => ({ type: "book", id: b.id, title: b.name, emoji: b.emoji, desc: "长期知识库 (Book)" })),
        ...state.docs.filter(d => `${d.title} ${d.body}`.toLowerCase().includes(q)).map(d => ({ type: "doc", id: d.id, title: d.title, emoji: d.emoji, desc: "文档 (Document)" })),
        ...state.memos.filter(m => m.body.toLowerCase().includes(q)).map(m => ({ type: "memo", id: m.id, title: m.body.slice(0, 40), emoji: "✎", desc: "碎片小记 (Memo)" })),
        ...state.tasks.filter(t => t.title.toLowerCase().includes(q)).map(t => ({ type: "task", id: t.id, title: t.title, emoji: t.done ? "✓" : "○", desc: "任务 (Task)" }))
      ].slice(0, 12);
    }

    function renderSearchResults() {
      const q = searchInput.value;
      const results = buildSearchResults(q);
      state.searchIndex = Math.min(state.searchIndex, Math.max(0, results.length - 1));
      const trimmed = q.trim();
      $("#searchResults").innerHTML = `
        ${results.length ? results.map((r, i) => `
          <button class="search-result ${i === state.searchIndex ? "selected" : ""}" data-action="pick-search" data-type="${r.type}" data-id="${r.id}">
            <span style="font-size:16px">${esc(r.emoji)}</span>
            <span class="search-result-content">
              <span class="search-result-title">${esc(r.title)}</span>
              <span class="search-result-type">${esc(r.desc)}</span>
            </span>
            ${icon("right", "small")}
          </button>
        `).join("") : `<div style="padding:22px;text-align:center;color:#8f9287">未找到匹配项，可直接按下方按钮创建：</div>`}
        ${trimmed && !trimmed.startsWith(">") ? `
          <div style="margin-top:8px;padding-top:8px;border-top:1px solid #2e302a;display:grid;gap:4px">
            <button class="search-result" data-action="search-create-task"><span>＋</span><span class="search-result-content"><span class="search-result-title">将「${esc(trimmed)}」新建为收集箱待办任务 (Task)</span></span></button>
            <button class="search-result" data-action="search-create-memo"><span>✎</span><span class="search-result-content"><span class="search-result-title">将「${esc(trimmed)}」记为碎片小记 (Memo)</span></span></button>
            <button class="search-result" data-action="search-create-doc"><span>📄</span><span class="search-result-content"><span class="search-result-title">在当前项目中新建文档「${esc(trimmed)}」</span></span></button>
          </div>
        ` : ""}
      `;
    }

    function executeSearchPick(type, id) {
      searchDialog.close();
      if (type === "project") navigate("project", { projectId: id });
      else if (type === "book") navigate("book", { bookId: id });
      else if (type === "doc") { state.rightMode = "outline"; navigate("doc", { docId: id }); }
      else if (type === "memo") { state.memosTab = "stream"; navigate("memos"); }
      else if (type === "task") { state.selectedTaskId = id; state.rightMode = "task"; state.rightOpen = true; render(); }
      else if (type === "cmd") {
        if (id === "cmd-new-project") openNewContainerModal("project");
        else if (id === "cmd-new-book") openNewContainerModal("book");
        else if (id === "cmd-theme") { state.theme = state.theme === "dark" ? "light" : "dark"; persist(); render(); }
        else if (id === "cmd-accent-green") { state.accent = "#00b96b"; persist(); render(); toast("已切换为语雀翡翠绿强调色"); }
        else if (id === "cmd-accent-red") { state.accent = "#ff4f4f"; persist(); render(); toast("已切换为 Woday 珊瑚红强调色"); }
        else if (id === "cmd-today") navigate("today");
      }
    }

    /* Global Click Delegation */
    document.addEventListener("click", ev => {
      const btn = ev.target.closest("[data-action]");
      if (!btn) {
        if (!ev.target.closest("#morePopover")) $("#morePopover").hidden = true;
        return;
      }
      const action = btn.dataset.action;

      if (action === "nav-view") navigate(btn.dataset.view);
      else if (action === "open-project") navigate("project", { projectId: btn.dataset.projectId });
      else if (action === "open-book") navigate("book", { bookId: btn.dataset.bookId });
      else if (action === "open-doc") {
        const docId = btn.dataset.docId;
        state.rightMode = "outline";
        navigate("doc", { docId });
      }
      else if (action === "open-tag") navigate("tag", { tag: btn.dataset.tag });
      else if (action === "toggle-catalog-group") {
        const c = getContainer(btn.dataset.containerType, btn.dataset.containerId);
        const g = c?.groups?.find(x => x.id === btn.dataset.groupId);
        if (g) { g.collapsed = !g.collapsed; persist(); renderSidebar(); }
      }
      else if (action === "collapse-sidebar") { state.sidebarCollapsed = !state.sidebarCollapsed; render(); }
      else if (action === "nav-back") {
        if (!state.past.length) return;
        state.future.push({ view: state.view, params: { ...state.params } });
        const prev = state.past.pop();
        navigate(prev.view, prev.params, true);
      }
      else if (action === "nav-forward") {
        if (!state.future.length) return;
        state.past.push({ view: state.view, params: { ...state.params } });
        const next = state.future.pop();
        navigate(next.view, next.params, true);
      }
      else if (action === "open-search") {
        searchInput.value = "";
        state.searchIndex = 0;
        renderSearchResults();
        searchDialog.showModal();
        requestAnimationFrame(() => searchInput.focus());
      }
      else if (action === "quick-memo") {
        state.rightOpen = true;
        state.rightMode = "inbox";
        state.captureKind = "memo";
        render();
        requestAnimationFrame(() => $("#inboxMemoInput")?.focus());
      }
      else if (action === "focus-inbox-task") {
        state.rightOpen = true;
        state.rightMode = "inbox";
        state.captureKind = "task";
        render();
        requestAnimationFrame(() => $("#inboxTaskInput")?.focus());
      }
      else if (action === "set-right") {
        state.rightMode = btn.dataset.mode;
        state.rightOpen = true;
        render();
      }
      else if (action === "toggle-right") { state.rightOpen = !state.rightOpen; render(); }
      else if (action === "set-capture-kind") { state.captureKind = btn.dataset.kind; renderRight(); }
      else if (action === "submit-inbox-task") {
        const input = $("#inboxTaskInput");
        const val = input?.value.trim();
        if (val) {
          state.tasks.unshift({ id: `t${Date.now()}`, title: val, dueOffset: null, time: "", projectId: "p1", docId: "", tag: "", priority: "none", done: false, subtasks: [], notes: "" });
          persist(); render(); toast("已加入收集箱待办");
          requestAnimationFrame(() => $("#inboxTaskInput")?.focus());
        }
      }
      else if (action === "submit-inbox-memo") {
        const input = $("#inboxMemoInput");
        const val = input?.value.trim();
        if (val) {
          state.memos.unshift({ id: `m${Date.now()}`, body: val, tag: "知识管理", pinned: false, created: "刚刚" });
          persist(); render(); toast("已记录碎片小记");
        }
      }
      else if (action === "add-page-memo") {
        const input = $("#pageMemoInput");
        const val = input?.value.trim();
        const tag = $("#pageMemoTag")?.value || "知识管理";
        if (val) {
          state.memos.unshift({ id: `m${Date.now()}`, body: val, tag, pinned: false, created: "刚刚" });
          persist(); render(); toast("小记已保存");
        }
      }
      else if (action === "promote-memo-doc") openPromoteMemoModal(btn.dataset.memoId);
      else if (action === "promote-memo-task") {
        const idx = state.memos.findIndex(m => m.id === btn.dataset.memoId);
        if (idx >= 0) {
          const [memo] = state.memos.splice(idx, 1);
          const newTask = { id: `t${Date.now()}`, title: memo.body.split("\n")[0].slice(0, 60), dueOffset: 0, time: "", projectId: "p1", docId: "", tag: memo.tag, priority: "medium", done: false, subtasks: [], notes: memo.body };
          state.tasks.unshift(newTask);
          state.selectedTaskId = newTask.id;
          state.rightMode = "task";
          state.rightOpen = true;
          persist(); render(); toast("小记已转化为今日项目任务");
        }
      }
      else if (action === "pin-memo") {
        const m = state.memos.find(x => x.id === btn.dataset.memoId);
        if (m) { m.pinned = !m.pinned; persist(); renderMain(); }
      }
      else if (action === "delete-memo") {
        const idx = state.memos.findIndex(x => x.id === btn.dataset.memoId);
        if (idx >= 0) { const [removed] = state.memos.splice(idx, 1); state.trash.unshift({ kind: "小记", ...removed }); persist(); render(); toast("小记已移入回收站"); }
      }
      else if (action === "toggle-task") {
        const t = getTask(btn.dataset.taskId);
        if (t) { t.done = !t.done; t.completedAt = t.done ? Date.now() : null; persist(); render(); toast(t.done ? "任务已完成" : "任务已重新打开"); }
      }
      else if (action === "open-task") {
        state.selectedTaskId = btn.dataset.taskId;
        state.rightMode = "task";
        state.rightOpen = true;
        render();
      }
      else if (action === "delete-task") {
        const idx = state.tasks.findIndex(t => t.id === btn.dataset.taskId);
        if (idx >= 0) {
          const [removed] = state.tasks.splice(idx, 1);
          state.trash.unshift({ kind: "任务", ...removed });
          state.rightMode = "inbox";
          persist(); render(); toast("任务已移入回收站");
        }
      }
      else if (action === "toggle-subtask") {
        const t = getTask(btn.dataset.taskId);
        const s = t?.subtasks?.find(x => x.id === btn.dataset.subId);
        if (s) { s.done = !s.done; persist(); renderRight(); renderMain(); }
      }
      else if (action === "add-subtask") {
        const t = getTask(btn.dataset.taskId);
        const inp = $("#newSubtaskInput");
        if (t && inp?.value.trim()) {
          (t.subtasks ||= []).push({ id: `s${Date.now()}`, title: inp.value.trim(), done: false });
          persist(); renderRight(); renderMain();
        }
      }
      else if (action === "today-reset") { state.selectedDate = new Date(); render(); }
      else if (action === "shift-date") { state.selectedDate = addDays(state.selectedDate, Number(btn.dataset.amount)); render(); }
      else if (action === "shift-month") { state.selectedDate = new Date(state.selectedDate.getFullYear(), state.selectedDate.getMonth() + Number(btn.dataset.amount), 1); render(); }
      else if (action === "select-date") { state.selectedDate = parseISO(btn.dataset.date); render(); }
      else if (action === "move-overdue-today") {
        state.tasks.forEach(t => { if (t.dueOffset !== null && t.dueOffset < 0 && !t.done) t.dueOffset = 0; });
        persist(); render(); toast("已将所有逾期任务顺延至今天");
      }
      else if (action === "toggle-carry") { state.carryHidden = !state.carryHidden; renderMain(); }
      else if (action === "set-project-tab") { state.projectTab = btn.dataset.tab; renderMain(); }
      else if (action === "set-memos-tab") { state.memosTab = btn.dataset.tab; renderMain(); }
      else if (action === "set-upcoming-mode") { state.upcomingMode = btn.dataset.mode; persist(); renderMain(); }
      else if (action === "set-tasks-mode") { state.tasksMode = btn.dataset.mode; persist(); renderMain(); }
      else if (action === "cycle-project-status") {
        const p = getProject(btn.dataset.projectId);
        if (p) {
          const order = ["planning", "active", "hold", "completed"];
          p.status = order[(order.indexOf(p.status) + 1) % order.length];
          persist(); render(); toast(`项目状态已更新为：${statusMeta(p.status).label}`);
        }
      }
      else if (action === "new-project-task") {
        const title = prompt("输入新项目任务标题：");
        if (title?.trim()) {
          const newT = { id: `t${Date.now()}`, title: title.trim(), dueOffset: 0, time: "", projectId: btn.dataset.projectId, docId: "", tag: "架构设计", priority: "medium", done: false, subtasks: [], notes: "" };
          state.tasks.unshift(newT);
          persist(); render(); toast("项目任务已创建");
        }
      }
      else if (action === "add-catalog-group") {
        const c = getContainer(btn.dataset.containerType, btn.dataset.containerId);
        const title = prompt("输入新目录分组名称（如 04 发布与运营）：");
        if (c && title?.trim()) {
          c.groups.push({ id: `g${Date.now()}`, title: title.trim(), collapsed: false });
          persist(); render(); toast("目录分组已添加");
        }
      }
      else if (action === "new-doc-in") {
        const cType = btn.dataset.containerType;
        const cId = btn.dataset.containerId;
        const c = getContainer(cType, cId);
        if (!c) return;
        const gId = btn.dataset.groupId || c.groups[0]?.id || "";
        const newId = `d${Date.now()}`;
        state.docs.unshift({
          id: newId,
          containerType: cType,
          containerId: cId,
          groupId: gId,
          title: "无标题文档",
          emoji: "📄",
          cover: "none",
          tag: cType === "project" ? "架构设计" : "知识管理",
          favorite: false,
          edited: "刚刚",
          body: `<h2>一、核心目标与背景</h2><p>在此输入文档正文，支持使用顶部工具栏插入高亮块、代码块、表格与同步项目任务…</p><h2>二、具体方案与执行细节</h2><p>可以随时将局部复选框提升为全局项目任务。</p>`,
          checklists: []
        });
        state.docEditMode = true;
        state.rightMode = "outline";
        persist();
        navigate("doc", { docId: newId });
        toast("已新建文档并进入编辑态");
      }
      else if (action === "toggle-doc-edit") {
        state.docEditMode = !state.docEditMode;
        renderMain();
        toast(state.docEditMode ? "已进入编辑态" : "已保存并返回沉浸阅读态");
      }
      else if (action === "cycle-doc-cover") {
        const d = getDoc(btn.dataset.docId);
        if (d) {
          const covers = ["none", "hills", "sunset", "ocean"];
          d.cover = covers[(covers.indexOf(d.cover || "none") + 1) % covers.length];
          persist(); renderMain();
        }
      }
      else if (action === "cycle-doc-emoji") {
        const d = getDoc(btn.dataset.docId);
        if (d) {
          const list = ["🧭", "🎨", "📝", "⚡", "🦀", "💡", "🚀", "📘", "🗺️"];
          d.emoji = list[(list.indexOf(d.emoji) + 1) % list.length];
          persist(); render();
        }
      }
      else if (action === "cycle-doc-tag") {
        const d = getDoc(btn.dataset.docId);
        if (d) {
          d.tag = state.tags[(state.tags.indexOf(d.tag) + 1) % state.tags.length];
          persist(); renderMain();
        }
      }
      else if (action === "toggle-doc-fav") {
        const d = getDoc(btn.dataset.docId);
        if (d) { d.favorite = !d.favorite; persist(); render(); toast(d.favorite ? "已加入收藏" : "已取消收藏"); }
      }
      else if (action === "move-doc-to-book") {
        const d = getDoc(btn.dataset.docId);
        const targetBook = state.books[0];
        if (d && targetBook) {
          d.containerType = "book";
          d.containerId = targetBook.id;
          d.groupId = targetBook.groups[0]?.id || "";
          state.expandedContainer = targetBook.id;
          persist(); render();
          toast(`文档已沉淀至长期知识库「${targetBook.name}」`);
        }
      }
      else if (action === "archive-project-docs") {
        const p = getProject(btn.dataset.projectId);
        const targetBook = state.books[0];
        if (p && targetBook) {
          p.status = "completed";
          persist(); render();
          toast(`项目已标记为完成，可在任意文档右上角一键「迁入知识库」`);
        }
      }
      else if (action === "toggle-doc-checklist") {
        const d = getDoc(btn.dataset.docId);
        const item = d?.checklists?.find(c => c.id === btn.dataset.itemId);
        if (item) { item.done = !item.done; persist(); renderMain(); }
      }
      else if (action === "add-doc-checklist") {
        const d = getDoc(btn.dataset.docId);
        if (d) {
          (d.checklists ||= []).push({ id: `c${Date.now()}`, title: "新增文档内局部自查项（点击可编辑）", done: false });
          persist(); renderMain();
        }
      }
      else if (action === "promote-checklist-to-task") {
        const d = getDoc(btn.dataset.docId);
        const idx = d?.checklists?.findIndex(c => c.id === btn.dataset.itemId);
        if (d && idx >= 0) {
          const [item] = d.checklists.splice(idx, 1);
          const projId = d.containerType === "project" ? d.containerId : "p1";
          const newTask = {
            id: `t${Date.now()}`,
            title: item.title,
            dueOffset: 0,
            time: "",
            projectId: projId,
            docId: d.id,
            tag: d.tag || "架构设计",
            priority: "medium",
            done: item.done,
            subtasks: [],
            notes: `从文档《${d.title}》提升的任务`
          };
          state.tasks.unshift(newTask);
          persist(); render();
          toast("已提升为全局项目任务，并同步至 Today 与项目驾驶舱");
        }
      }
      else if (action === "add-doc-synced-task") {
        const d = getDoc(btn.dataset.docId);
        if (!d) return;
        const title = prompt(`为文档《${d.title}》新建关联项目任务：`);
        if (title?.trim()) {
          const projId = d.containerType === "project" ? d.containerId : "p1";
          state.tasks.unshift({
            id: `t${Date.now()}`,
            title: title.trim(),
            dueOffset: 0,
            time: "",
            projectId: projId,
            docId: d.id,
            tag: d.tag || "架构设计",
            priority: "high",
            done: false,
            subtasks: [],
            notes: ""
          });
          persist(); render();
          toast("已创建关联任务并双向同步");
        }
      }
      else if (action === "format-cmd") {
        document.execCommand(btn.dataset.cmd, false, null);
      }
      else if (action === "insert-block") {
        const d = getDoc(state.params.docId);
        if (!d) return;
        const kind = btn.dataset.block;
        let snippet = "";
        if (kind === "h2") snippet = `<h2>新章节标题</h2><p>输入章节内容…</p>`;
        else if (kind === "h3") snippet = `<h3>新小节标题</h3><p>输入小节内容…</p>`;
        else if (kind === "callout") snippet = `<div class="doc-callout">💡 <strong>重点提示</strong>：在此输入关键结论或设计约束…</div>`;
        else if (kind === "code") snippet = `<pre class="doc-code">// 在此输入代码段\nfn main() {\n    println!("Hello, Kanon!");\n}</pre>`;
        else if (kind === "table") snippet = `<table class="doc-table"><thead><tr><th>维度</th><th>说明</th></tr></thead><tbody><tr><td>项目推进</td><td>关联行动项</td></tr></tbody></table>`;
        else if (kind === "mention") {
          const refDoc = state.docs.find(x => x.id !== d.id) || state.docs[0];
          snippet = `<p>关联参考文档：<span class="mention-chip" data-action="open-doc" data-doc-id="${refDoc.id}">${esc(refDoc.emoji)} ${esc(refDoc.title)}</span></p>`;
        }
        d.body += snippet;
        d.edited = "刚刚";
        persist(); renderMain(); renderRight();
        toast("已插入内容块");
      }
      else if (action === "scroll-heading") {
        if (state.view !== "doc" || state.params.docId !== btn.dataset.docId) {
          navigate("doc", { docId: btn.dataset.docId });
        }
        const headings = $$("#docBodyContent h2, #docBodyContent h3");
        const target = headings[Number(btn.dataset.headingIndex)];
        if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      else if (action === "open-new-container") openNewContainerModal(btn.dataset.kind);
      else if (action === "new-tag") {
        const name = prompt("输入新标签名称：");
        if (name?.trim() && !state.tags.includes(name.trim())) {
          state.tags.push(name.trim());
          persist(); renderSidebar(); toast(`已添加标签 #${name.trim()}`);
        }
      }
      else if (action === "close-dialog") $("#" + btn.dataset.dialog)?.close();
      else if (action === "more-menu") {
        const pop = $("#morePopover");
        const rect = btn.getBoundingClientRect();
        pop.style.left = `${Math.max(10, rect.left)}px`;
        pop.style.top = `${Math.max(10, rect.top - 156)}px`;
        pop.hidden = !pop.hidden;
      }
      else if (action === "open-settings") { $("#morePopover").hidden = true; navigate("settings"); }
      else if (action === "open-analytics") { $("#morePopover").hidden = true; navigate("analytics"); }
      else if (action === "show-trash") { $("#morePopover").hidden = true; navigate("trash"); }
      else if (action === "restore-trash") {
        const [item] = state.trash.splice(Number(btn.dataset.index), 1);
        if (item) {
          if (item.kind === "小记") state.memos.unshift(item);
          else state.tasks.unshift(item);
          persist(); render(); toast("已恢复条目");
        }
      }
      else if (action === "set-settings-tab") { state.settingsTab = btn.dataset.tab; renderMain(); }
      else if (action === "set-theme") { state.theme = btn.dataset.theme; persist(); render(); }
      else if (action === "set-accent") { state.accent = btn.dataset.accent; persist(); render(); }
      else if (action === "set-scale") { state.textScale = Number(btn.dataset.scale); persist(); render(); }
      else if (action === "reset-demo") {
        localStorage.removeItem(STORAGE_KEY);
        state.projects = seedProjects();
        state.books = seedBooks();
        state.docs = seedDocs();
        state.tasks = seedTasks();
        state.memos = seedMemos();
        state.events = seedEvents();
        state.trash = [];
        state.theme = "light";
        state.accent = "#ff4f4f";
        state.textScale = 1;
        $("#morePopover").hidden = true;
        navigate("today");
        toast("已恢复初始演示数据");
      }
      else if (action === "ai-demo-extract") {
        const latestMemo = state.memos[0];
        if (!latestMemo) { toast("收集箱暂无小记可供提炼"); return; }
        const newT = {
          id: `t${Date.now()}`,
          title: `AI 提炼：${latestMemo.body.slice(0, 26)}…`,
          dueOffset: 0,
          time: "15:00",
          projectId: "p1",
          docId: "d1",
          tag: latestMemo.tag || "架构设计",
          priority: "medium",
          done: false,
          subtasks: [],
          notes: latestMemo.body
        };
        state.tasks.unshift(newT);
        state.selectedTaskId = newT.id;
        state.rightMode = "task";
        persist(); render();
        toast("✨ 已从小记自动提炼并创建项目任务");
      }
      else if (action === "pick-search") executeSearchPick(btn.dataset.type, btn.dataset.id);
      else if (action === "search-create-task") {
        const q = searchInput.value.trim();
        searchDialog.close();
        if (q) {
          state.tasks.unshift({ id: `t${Date.now()}`, title: q, dueOffset: null, time: "", projectId: "p1", docId: "", tag: "", priority: "none", done: false, subtasks: [], notes: "" });
          state.rightMode = "inbox"; state.rightOpen = true; persist(); render(); toast("已加入收集箱任务");
        }
      }
      else if (action === "search-create-memo") {
        const q = searchInput.value.trim();
        searchDialog.close();
        if (q) {
          state.memos.unshift({ id: `m${Date.now()}`, body: q, tag: "知识管理", pinned: false, created: "刚刚" });
          state.rightMode = "inbox"; state.rightOpen = true; persist(); render(); toast("已记为碎片小记");
        }
      }
      else if (action === "search-create-doc") {
        const q = searchInput.value.trim();
        searchDialog.close();
        if (q) {
          const p = state.projects[0];
          const newId = `d${Date.now()}`;
          state.docs.unshift({
            id: newId, containerType: "project", containerId: p.id, groupId: p.groups[0].id,
            title: q, emoji: "📄", cover: "none", tag: "架构设计", favorite: false, edited: "刚刚",
            body: `<h2>一、背景与目标</h2><p>围绕「${esc(q)}」展开的项目文档…</p>`, checklists: []
          });
          state.docEditMode = true; state.rightMode = "outline"; persist(); navigate("doc", { docId: newId });
        }
      }
    });

    /* Input & Change Listeners */
    document.addEventListener("input", ev => {
      const t = ev.target;
      if (t === searchInput) { state.searchIndex = 0; renderSearchResults(); }
      else if (t.matches("[data-doc-title]")) {
        const d = getDoc(t.dataset.docTitle);
        if (d) { d.title = t.textContent.trim() || "无标题文档"; d.edited = "刚刚"; persist(); renderSidebar(); }
      }
      else if (t.matches("[data-doc-body]")) {
        const d = getDoc(t.dataset.docBody);
        if (d) { d.body = t.innerHTML; d.edited = "刚刚"; persist(); if (state.rightMode === "outline") renderRight(); }
      }
      else if (t.matches("[data-project-goal]")) {
        const p = getProject(t.dataset.projectGoal);
        if (p) { p.goal = t.textContent.trim(); persist(); }
      }
      else if (t.matches("[data-task-title-edit]")) {
        const task = getTask(t.dataset.taskTitleEdit);
        if (task) { task.title = t.textContent.trim() || "未命名任务"; persist(); renderMain(); }
      }
      else if (t.matches("[data-task-notes]")) {
        const task = getTask(t.dataset.taskNotes);
        if (task) { task.notes = t.value; persist(); }
      }
    });

    document.addEventListener("change", ev => {
      const t = ev.target;
      if (t.matches("[data-change='inbox-filter']")) { state.inboxFilter = t.value; renderRight(); }
      else if (t.matches("[data-change='calendar-mode']")) { state.calendarMode = t.value; persist(); renderMain(); }
      else if (t.matches("[data-change='task-sort']")) { state.taskSort = t.value; persist(); renderMain(); }
      else if (t.matches("[data-task-field]")) {
        const task = getTask(t.dataset.taskId);
        if (!task) return;
        const field = t.dataset.taskField;
        if (field === "dueOffset") {
          const map = { inbox: null, overdue: -1, today: 0, tomorrow: 1, later: 3 };
          task.dueOffset = map[t.value] ?? null;
        } else {
          task[field] = t.value;
        }
        persist(); render();
      }
    });

    /* Keyboard Shortcuts */
    document.addEventListener("keydown", ev => {
      if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k") {
        ev.preventDefault();
        if (searchDialog.open) searchDialog.close();
        else {
          searchInput.value = "";
          state.searchIndex = 0;
          renderSearchResults();
          searchDialog.showModal();
          requestAnimationFrame(() => searchInput.focus());
        }
        return;
      }
      if (ev.target.matches("#inboxTaskInput") && ev.key === "Enter") {
        ev.preventDefault();
        $("[data-action='submit-inbox-task']")?.click();
      }
      else if (ev.target.matches("#inboxMemoInput") && (ev.metaKey || ev.ctrlKey) && ev.key === "Enter") {
        ev.preventDefault();
        $("[data-action='submit-inbox-memo']")?.click();
      }
      else if (ev.target.matches("#pageMemoInput") && (ev.metaKey || ev.ctrlKey) && ev.key === "Enter") {
        ev.preventDefault();
        $("[data-action='add-page-memo']")?.click();
      }
      else if (ev.target.matches("#quickProjectTaskInput") && ev.key === "Enter") {
        ev.preventDefault();
        const val = ev.target.value.trim();
        const pid = ev.target.dataset.projectId;
        if (val && pid) {
          state.tasks.unshift({ id: `t${Date.now()}`, title: val, dueOffset: 0, time: "", projectId: pid, docId: "", tag: "架构设计", priority: "medium", done: false, subtasks: [], notes: "" });
          persist(); render(); toast("已添加项目任务");
        }
      }
      else if (ev.target.matches("#newSubtaskInput") && ev.key === "Enter") {
        ev.preventDefault();
        $("[data-action='add-subtask']")?.click();
      }
      else if (state.view === "doc" && !ev.target.matches("input, textarea, [contenteditable='true']") && ev.key.toLowerCase() === "e") {
        ev.preventDefault();
        state.docEditMode = true;
        renderMain();
        toast("已进入文档编辑态");
      }
      else if (ev.key === "Escape" && state.view === "doc" && state.docEditMode && !searchDialog.open) {
        state.docEditMode = false;
        renderMain();
        toast("已退出编辑态");
      }
      else if (ev.target === searchInput && searchDialog.open) {
        const results = buildSearchResults(searchInput.value);
        if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
          ev.preventDefault();
          state.searchIndex = Math.max(0, Math.min(results.length - 1, state.searchIndex + (ev.key === "ArrowDown" ? 1 : -1)));
          renderSearchResults();
        } else if (ev.key === "Enter" && results[state.searchIndex]) {
          ev.preventDefault();
          const r = results[state.searchIndex];
          executeSearchPick(r.type, r.id);
        }
      }
    });

    searchDialog.addEventListener("click", ev => { if (ev.target === searchDialog) searchDialog.close(); });
    render();
  </script>
</body>
</html>
