<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>开始 · 语雀</title>
  <style>
    :root {
      --yq-green: #00b96b;
      --yq-green-bright: #0bd07d;
      --yq-green-dark: #009456;
      --yq-green-soft: #daf6ea;
      --yq-green-soft-text: #00663b;
      --bg-primary: #ffffff;
      --bg-secondary: #fafafa;
      --bg-tertiary: #f4f5f5;
      --bg-foreground: #ffffff;
      --bg-popover: #ffffff;
      --bg-hover: #eff0f0;
      --bg-active: #eff0f0;
      --bg-card-hover: #f7f8f8;
      --bg-subtle: rgba(0, 0, 0, 0.03);
      --border-primary: #e7e9e8;
      --border-heavy: #d8dad9;
      --border-light: rgba(0, 0, 0, 0.06);
      --text-primary: #262626;
      --text-body: #585a5a;
      --text-caption: #8a8f8d;
      --text-disable: #bec0bf;
      --text-link: #1f6feb;
      --amber: #d2a638;
      --amber-soft: #fef6e0;
      --amber-soft-text: #946800;
      --red: #ca3f4f;
      --shadow-popover: 0 6px 16px -8px rgba(0,0,0,.10), 0 9px 28px 0 rgba(0,0,0,.06), 0 12px 48px 16px rgba(0,0,0,.04);
      --shadow-modal: 0 20px 60px rgba(0,0,0,.18);
      --sidebar-w: 254px;
      --reader-sidebar-w: clamp(276px, 19vw, 320px);
      --font: "Chinese Quote", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    html[data-theme="dark"] {
      --yq-green: #00b96b;
      --yq-green-bright: #2ed790;
      --yq-green-dark: #29ad76;
      --yq-green-soft: #0e2f22;
      --yq-green-soft-text: #6bd1a6;
      --bg-primary: #141414;
      --bg-secondary: #181818;
      --bg-tertiary: rgba(255, 255, 255, 0.05);
      --bg-foreground: #1f1f1f;
      --bg-popover: #242424;
      --bg-hover: rgba(255, 255, 255, 0.08);
      --bg-active: rgba(255, 255, 255, 0.12);
      --bg-card-hover: rgba(255, 255, 255, 0.04);
      --bg-subtle: rgba(255, 255, 255, 0.03);
      --border-primary: rgba(255, 255, 255, 0.12);
      --border-heavy: rgba(255, 255, 255, 0.18);
      --border-light: rgba(255, 255, 255, 0.08);
      --text-primary: #e2e2e2;
      --text-body: #b3b3b3;
      --text-caption: #848484;
      --text-disable: #505050;
      --text-link: #3b82ce;
      --amber: #e2b955;
      --amber-soft: #3a301c;
      --amber-soft-text: #e6c675;
      --red: #e05a68;
      --shadow-popover: 0 6px 16px -8px rgba(0,0,0,.45), 0 9px 28px 0 rgba(0,0,0,.35), 0 12px 48px 16px rgba(0,0,0,.22);
      --shadow-modal: 0 24px 72px rgba(0,0,0,.55);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--text-primary);
      background: var(--bg-primary);
      font: 14px/1.5715 var(--font);
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    input::placeholder, textarea::placeholder { color: var(--text-caption); opacity: .75; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [contenteditable]:focus-visible, a:focus-visible {
      outline: 2px solid var(--yq-green);
      outline-offset: 2px;
    }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, p { margin-top: 0; }
    .svg-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { width: 16px; height: 16px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
    .icon.sm { width: 14px; height: 14px; }
    .icon.xs { width: 12px; height: 12px; }
    .icon.md { width: 18px; height: 18px; }
    .icon.lg { width: 24px; height: 24px; }
    .muted { color: var(--text-caption); }
    .hidden { display: none !important; }

    /* Brand mark & user badge */
    .logo-mark {
      width: 26px; height: 26px; display: inline-grid; place-items: center; flex: 0 0 auto;
      border-radius: 7px; background: linear-gradient(145deg, #2ed790 0%, #00b96b 100%); color: #fff;
    }
    .logo-mark.sm { width: 20px; height: 20px; border-radius: 5px; }
    .logo-mark svg { width: 16px; height: 16px; fill: currentColor; stroke: none; }
    .logo-mark.sm svg { width: 13px; height: 13px; }
    .avatar-badge {
      width: 24px; height: 24px; border-radius: 50%; background: var(--yq-green); color: #fff;
      display: inline-grid; place-items: center; flex: 0 0 auto; font-size: 11px; font-weight: 600;
    }
    .avatar-badge.sm { width: 20px; height: 20px; font-size: 10px; }

    /* Buttons & inputs */
    .icon-btn {
      width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center;
      flex: 0 0 auto; padding: 0; border-radius: 6px; color: var(--text-caption); transition: background .12s ease, color .12s ease;
    }
    .icon-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .icon-btn.active { background: var(--bg-active); color: var(--yq-green-bright); }
    .btn {
      height: 32px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 0 14px; border: 1px solid var(--border-primary); border-radius: 6px;
      background: transparent; color: var(--text-primary); font-size: 13px; font-weight: 500; white-space: nowrap;
      transition: background .12s ease, border-color .12s ease;
    }
    .btn:hover { background: var(--bg-hover); border-color: var(--border-heavy); }
    .btn.primary { border-color: var(--yq-green); background: var(--yq-green); color: #fff; }
    .btn.primary:hover { border-color: var(--yq-green-dark); background: var(--yq-green-dark); }
    .btn.subtle { background: var(--bg-tertiary); border-color: var(--border-primary); }
    .btn.subtle:hover { background: var(--bg-hover); }
    .btn.text { border-color: transparent; background: transparent; padding: 0 8px; }
    .btn.danger { color: var(--red); border-color: rgba(202,63,79,.35); }
    .btn.danger:hover { background: rgba(202,63,79,.1); }
    .btn:disabled { opacity: .45; cursor: default; pointer-events: none; }

    .input, .select, .textarea {
      width: 100%; min-height: 34px; padding: 6px 10px; border: 1px solid var(--border-primary);
      border-radius: 6px; background: var(--bg-tertiary); color: var(--text-primary); outline: 0;
    }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--yq-green); }
    .textarea { min-height: 84px; resize: vertical; }
    .form-field { display: grid; gap: 7px; margin: 14px 0; }
    .form-field label { font-size: 13px; font-weight: 500; }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

    /* Book icons */
    .book-glyph {
      width: 18px; height: 18px; display: inline-grid; place-items: center; flex: 0 0 auto;
    }
    .book-glyph.lg { width: 28px; height: 28px; }
    .book-glyph.xl { width: 32px; height: 32px; }

    /* Mobile header */
    .mobile-head { display: none; }

    /* Dashboard Shell */
    .dashboard-shell { min-height: 100dvh; display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); background: var(--bg-primary); }
    .dashboard-sidebar {
      position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column;
      padding: 14px 12px 10px; border-right: 1px solid var(--border-light); background: var(--bg-secondary);
      user-select: none;
    }
    .brand-row { height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 4px; }
    .brand-button { display: flex; align-items: center; gap: 8px; padding: 3px 6px 3px 2px; border-radius: 6px; font-size: 15px; font-weight: 600; }
    .brand-button:hover { background: var(--bg-hover); }
    .brand-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    .search-bar-row { display: flex; align-items: center; gap: 8px; margin: 14px 0 12px; }
    .search-entry {
      flex: 1; min-width: 0; height: 34px; display: flex; align-items: center; gap: 8px;
      padding: 0 10px; border: 1px solid var(--border-light); border-radius: 7px;
      background: var(--bg-tertiary); color: var(--text-caption); text-align: left;
    }
    .search-entry:hover { background: var(--bg-hover); }
    .search-entry span { flex: 1; font-size: 13px; }
    .search-entry kbd { color: var(--text-caption); opacity: .75; font: 11px var(--font); }
    .plus-square-btn {
      width: 34px; height: 34px; flex: 0 0 auto; display: inline-grid; place-items: center;
      border: 1px solid var(--border-primary); border-radius: 7px; background: var(--bg-tertiary); color: var(--text-primary);
    }
    .plus-square-btn:hover { background: var(--bg-hover); border-color: var(--border-heavy); }

    .side-nav { display: grid; gap: 2px; }
    .side-nav-item {
      width: 100%; height: 34px; display: flex; align-items: center; gap: 10px;
      padding: 0 10px; border-radius: 6px; text-align: left; color: var(--text-body); font-size: 14px;
      transition: background .12s ease, color .12s ease;
    }
    .side-nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .side-nav-item.active { background: var(--bg-active); color: var(--text-primary); font-weight: 500; }
    .side-nav-item .item-label { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .side-section { margin-top: 14px; display: flex; flex-direction: column; min-height: 0; }
    .side-section-header {
      width: 100%; height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 8px;
      border-radius: 6px; color: var(--text-caption); font-size: 13px;
    }
    .side-section-header:hover { background: var(--bg-hover); color: var(--text-primary); }
    .side-section-header.active { background: var(--bg-active); color: var(--text-primary); }
    .side-section-toggle { display: inline-flex; align-items: center; gap: 6px; flex: 1; min-width: 0; text-align: left; padding: 4px 0; }
    .side-section-toggle .chevron { transition: transform .15s ease; }
    .side-section.collapsed .side-section-toggle .chevron { transform: rotate(-90deg); }
    .side-section.collapsed .book-list { display: none; }
    .book-list { display: grid; gap: 1px; margin-top: 2px; overflow-y: auto; scrollbar-width: thin; }
    .book-nav { height: 32px; padding: 0 10px 0 22px; font-size: 13px; gap: 8px; }
    .book-nav .lock-icon { width: 12px; height: 12px; color: var(--text-caption); opacity: .75; flex: 0 0 auto; }

    .sidebar-bottom { margin-top: auto; padding-top: 8px; display: flex; align-items: center; justify-content: space-between; }
    .sidebar-bottom .side-nav-item { color: var(--text-caption); }

    /* Dashboard Main */
    .dashboard-main { min-width: 0; padding: 26px 40px 60px; }
    .page-title { margin: 0 0 20px; font-size: 18px; line-height: 28px; font-weight: 500; }

    /* Start Page: 4-col bordered quick cards */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 30px;
    }
    .quick-card {
      min-height: 66px; display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      border: 1px solid var(--border-primary); border-radius: 8px; background: var(--bg-foreground);
      text-align: left; transition: border-color .14s ease, background .14s ease;
    }
    .quick-card:hover { border-color: var(--border-heavy); background: var(--bg-card-hover); }
    .quick-card-icon { width: 30px; height: 30px; display: grid; place-items: center; flex: 0 0 auto; }
    .quick-card-body { flex: 1; min-width: 0; }
    .quick-title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
    .quick-title { margin: 0; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .quick-badge {
      display: inline-flex; align-items: center; padding: 1px 6px; border-radius: 4px;
      background: var(--amber-soft); color: var(--amber-soft-text); font-size: 11px; font-weight: 500; white-space: nowrap;
    }
    .quick-subtitle { margin: 0; color: var(--text-caption); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .quick-caret { color: var(--text-caption); margin-left: auto; flex: 0 0 auto; }

    .section-heading { margin: 0 0 14px; font-size: 16px; font-weight: 500; }
    .document-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 0 10px; }
    .segmented { display: inline-flex; gap: 2px; padding: 3px; border-radius: 7px; background: var(--bg-tertiary); }
    .segmented button {
      min-height: 28px; padding: 4px 14px; border-radius: 5px; color: var(--text-caption); font-size: 13px;
    }
    .segmented button:hover { color: var(--text-primary); }
    .segmented button.active { background: var(--bg-active); color: var(--text-primary); font-weight: 500; }
    html:not([data-theme="dark"]) .segmented button.active { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.07); }
    .table-filters { display: flex; align-items: center; gap: 6px; }
    .filter-select {
      padding: 5px 8px; border: 0; border-radius: 5px; background: transparent;
      color: var(--text-caption); font-size: 13px; outline: 0; cursor: pointer;
    }
    .filter-select:hover { background: var(--bg-hover); color: var(--text-primary); }
    .filter-select option { background: var(--bg-popover); color: var(--text-primary); }

    .doc-table { width: 100%; }
    .doc-row {
      display: grid; grid-template-columns: minmax(240px, 1.55fr) minmax(170px, .9fr) 140px 36px;
      align-items: center; min-height: 54px; border-bottom: 1px solid var(--border-light);
      padding: 0 4px; border-radius: 4px;
    }
    .doc-row:hover { background: var(--bg-card-hover); }
    .doc-title-cell { min-width: 0; display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 4px; }
    .doc-title-button { min-width: 0; overflow: hidden; padding: 0; text-align: left; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
    .doc-title-button:hover { color: var(--yq-green-bright); }
    .doc-owner { min-width: 0; overflow: hidden; color: var(--text-caption); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .doc-time { color: var(--text-caption); font-size: 13px; }
    .star-button { opacity: 0; transition: opacity .12s ease; }
    .doc-row:hover .star-button, .star-button.is-favorite { opacity: 1; }
    .star-button.is-favorite { color: #e5b94e; }
    .star-button.is-favorite svg { fill: #e5b94e; }

    /* Empty state */
    .empty-state { display: grid; place-items: center; min-height: 240px; padding: 40px; color: var(--text-caption); text-align: center; }
    .empty-state h2 { margin: 12px 0 6px; color: var(--text-primary); font-size: 16px; }
    .empty-state p { max-width: 360px; margin-bottom: 16px; font-size: 13px; }

    /* Collections View (收藏: 左侧分组 + 右侧表格) */
    .collections-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .collections-header .page-title { margin: 0; }
    .collections-tools { display: flex; align-items: center; gap: 6px; }
    .collections-search-input {
      width: 180px; height: 30px; padding: 0 10px; border: 1px solid var(--border-primary);
      border-radius: 6px; background: var(--bg-tertiary); font-size: 13px; outline: 0;
    }
    .collections-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; align-items: start; }
    .collection-folders { display: grid; gap: 4px; }
    .collection-folder {
      width: 100%; padding: 12px 14px; border-radius: 8px; text-align: left;
      border: 1px solid transparent; transition: background .12s ease;
    }
    .collection-folder:hover { background: var(--bg-hover); }
    .collection-folder.active { background: var(--bg-active); }
    .collection-folder-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .collection-folder-count { font-size: 12px; color: var(--text-caption); }
    .collection-table-head {
      display: grid; grid-template-columns: minmax(220px, 1.6fr) minmax(120px, .8fr) 160px 36px;
      align-items: center; padding: 0 4px 10px; border-bottom: 1px solid var(--border-light);
      color: var(--text-caption); font-size: 13px;
    }
    .sort-head-btn { display: inline-flex; align-items: center; gap: 4px; color: var(--text-caption); font-size: 13px; }
    .sort-head-btn:hover { color: var(--text-primary); }
    .collection-row {
      display: grid; grid-template-columns: minmax(220px, 1.6fr) minmax(120px, .8fr) 160px 36px;
      align-items: center; min-height: 54px; padding: 0 4px; border-bottom: 1px solid var(--border-light);
    }
    .collection-row:hover { background: var(--bg-card-hover); }

    /* Explore View (逛逛: 左侧信息流 + 右侧推荐花园) */
    .explore-layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 40px; align-items: start; max-width: 1180px; }
    .explore-tabs-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .explore-tabs { display: flex; align-items: center; gap: 24px; }
    .explore-tab { position: relative; padding: 6px 0 10px; font-size: 16px; color: var(--text-caption); }
    .explore-tab:hover { color: var(--text-primary); }
    .explore-tab.active { color: var(--text-primary); font-weight: 500; }
    .explore-tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--text-primary); border-radius: 2px; }
    .explore-feed-item {
      padding: 20px 0; border-bottom: 1px solid var(--border-light);
      display: flex; gap: 20px; align-items: flex-start;
    }
    .explore-feed-main { flex: 1; min-width: 0; }
    .explore-author { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; color: var(--text-body); }
    .explore-author-avatar {
      width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center;
      font-size: 11px; font-weight: 600; color: #fff; flex: 0 0 auto;
    }
    .explore-feed-title { margin: 0 0 8px; font-size: 16px; font-weight: 600; color: var(--text-primary); cursor: pointer; }
    .explore-feed-title:hover { color: var(--yq-green-bright); }
    .explore-feed-excerpt { margin: 0 0 12px; font-size: 13px; line-height: 1.65; color: var(--text-body); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .explore-feed-actions { display: flex; align-items: center; gap: 18px; color: var(--text-caption); font-size: 12px; }
    .explore-feed-action { display: inline-flex; align-items: center; gap: 5px; color: var(--text-caption); }
    .explore-feed-action:hover, .explore-feed-action.active { color: var(--yq-green-bright); }
    .explore-thumb {
      width: 148px; height: 96px; flex: 0 0 auto; border-radius: 6px; border: 1px solid var(--border-primary);
      background: var(--bg-foreground); padding: 10px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .explore-thumb-badge { display: inline-block; align-self: flex-start; padding: 2px 6px; border-radius: 4px; background: var(--yq-green-soft); color: var(--yq-green-soft-text); font-size: 10px; font-weight: 600; }
    .explore-thumb-lines { display: grid; gap: 5px; }
    .explore-thumb-lines span { display: block; height: 5px; border-radius: 3px; background: var(--border-primary); }
    .explore-aside-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .explore-aside-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
    .explore-aside-head strong { color: var(--yq-green-bright); font-weight: 600; }
    .garden-card {
      padding: 16px; border: 1px solid var(--border-primary); border-radius: 8px; background: var(--bg-foreground);
      margin-bottom: 12px; text-align: left; width: 100%;
    }
    .garden-card:hover { border-color: var(--border-heavy); }
    .garden-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .garden-card-name { font-size: 14px; font-weight: 500; }
    .garden-card-bio { font-size: 12px; color: var(--text-caption); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .garden-rec-label { font-size: 11px; color: var(--text-caption); margin-bottom: 4px; }
    .garden-rec-title { font-size: 13px; color: var(--text-primary); }
    .garden-cta {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 16px; border: 1px solid var(--border-primary); border-radius: 8px; background: var(--bg-foreground); margin-bottom: 12px;
    }
    .garden-banner {
      padding: 16px; border-radius: 8px; background: var(--yq-green-soft); border: 1px solid rgba(0,185,107,.2);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }

    /* Books Overview View (知识库总览) */
    .books-panel {
      padding: 16px; border: 1px solid var(--border-primary); border-radius: 10px; background: var(--bg-foreground);
      margin-bottom: 24px;
    }
    .books-panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; color: var(--text-caption); font-size: 13px; }
    .books-grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .book-mini-card {
      display: flex; align-items: center; gap: 10px; padding: 14px 16px; border: 1px solid var(--border-light);
      border-radius: 8px; background: var(--bg-subtle); text-align: left;
    }
    .book-mini-card:hover { background: var(--bg-hover); border-color: var(--border-primary); }
    .book-mini-title { display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 500; }
    .book-mini-sub { font-size: 12px; color: var(--text-caption); margin-top: 2px; }
    .books-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .books-toolbar-right { display: flex; align-items: center; gap: 8px; }
    .books-group-title { font-size: 14px; font-weight: 500; margin: 22px 0 12px; color: var(--text-primary); }
    .book-card {
      min-height: 118px; display: flex; flex-direction: column; justify-content: space-between;
      padding: 16px 18px; border: 1px solid var(--border-primary); border-radius: 8px;
      background: var(--bg-foreground); text-align: left; transition: border-color .14s ease, background .14s ease;
    }
    .book-card:hover { border-color: var(--border-heavy); background: var(--bg-card-hover); }
    .book-card-top { display: flex; align-items: flex-start; gap: 10px; }
    .book-card-name { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 500; }
    .book-card-desc { margin-top: 4px; font-size: 12px; color: var(--text-caption); }
    .book-card-foot { margin-top: 16px; font-size: 12px; color: var(--text-caption); }
    .books-list-stack { display: grid; gap: 6px; }
    .book-list-row {
      display: grid; grid-template-columns: minmax(200px, 1.5fr) 1fr 110px; align-items: center;
      padding: 12px 16px; border: 1px solid var(--border-light); border-radius: 8px; background: var(--bg-foreground); text-align: left;
    }
    .book-list-row:hover { background: var(--bg-hover); }

    /* Notes View (小记) */
    .notes-shell { display: flex; flex-direction: column; min-height: calc(100dvh - 52px); }
    .notes-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .notes-topbar-left { display: flex; align-items: center; gap: 12px; }
    .notes-topbar-left .page-title { margin: 0; }
    .view-toggle-pill {
      display: inline-flex; align-items: center; border: 1px solid var(--border-primary);
      border-radius: 6px; padding: 2px; background: var(--bg-tertiary);
    }
    .view-toggle-pill button {
      height: 24px; padding: 0 8px; border-radius: 4px; display: inline-flex; align-items: center; gap: 4px;
      color: var(--text-caption); font-size: 12px;
    }
    .view-toggle-pill button.active { background: var(--bg-active); color: var(--text-primary); font-weight: 500; }
    .notes-topbar-right { display: flex; align-items: center; gap: 4px; }
    .notes-layout { display: grid; grid-template-columns: minmax(320px, 380px) minmax(0, 1fr); gap: 42px; align-items: start; flex: 1; }
    .note-composer-wrap { position: sticky; top: 24px; }
    .note-composer-card {
      position: relative; display: flex; flex-direction: column; min-height: 410px; padding: 14px 16px;
      border: 1px solid var(--border-primary); border-radius: 10px; background: var(--bg-foreground);
    }
    .note-composer-card::before, .note-composer-card::after {
      content: ""; position: absolute; left: 8px; right: 8px; height: 6px;
      border: 1px solid var(--border-light); border-top: 0; border-radius: 0 0 8px 8px;
      background: var(--bg-secondary); pointer-events: none;
    }
    .note-composer-card::before { bottom: -6px; }
    .note-composer-card::after { left: 16px; right: 16px; bottom: -11px; opacity: .7; }
    .composer-head-tools { display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; }
    .composer-tools { display: flex; align-items: center; gap: 4px; }
    .note-input { flex: 1; min-height: 260px; padding: 10px 2px; outline: 0; white-space: pre-wrap; line-height: 1.7; font-size: 14px; }
    .note-input:empty::before { color: var(--text-caption); opacity: .75; content: "记你想记..."; pointer-events: none; }
    .composer-tag-bar { display: flex; align-items: center; gap: 8px; padding-top: 10px; }
    .tag-pill-input {
      display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px;
      border: 1px solid var(--border-primary); border-radius: 6px; background: transparent; font-size: 12px; color: var(--text-caption);
    }
    .tag-pill-input input { width: 82px; border: 0; background: transparent; outline: 0; font-size: 12px; color: var(--text-primary); }
    .composer-footer { display: flex; align-items: center; gap: 12px; margin-top: 22px; }
    .composer-footer span { color: var(--text-caption); font-size: 12px; }

    .note-stream-wrap { min-width: 0; max-width: 720px; }
    .note-stream-wrap.grid-mode { max-width: none; }
    .note-group-title {
      display: inline-flex; align-items: center; gap: 6px; margin: 0 0 12px;
      color: var(--text-caption); font-size: 13px; cursor: pointer;
    }
    .note-cards-list { display: grid; gap: 14px; margin-bottom: 24px; }
    .note-stream-wrap.grid-mode .note-cards-list { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .note-card {
      position: relative; overflow: hidden; padding: 18px 20px;
      border: 1px solid var(--border-primary); border-radius: 8px; background: var(--bg-foreground);
      transition: border-color .12s ease;
    }
    .note-card:hover { border-color: var(--border-heavy); }
    .note-card.pinned::after {
      content: ""; position: absolute; top: 0; right: 0; width: 0; height: 0;
      border-style: solid; border-width: 0 16px 16px 0;
      border-color: transparent var(--yq-green-dark) transparent transparent;
    }
    .note-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; color: var(--text-caption); font-size: 12px; }
    .note-card-left { display: flex; align-items: center; gap: 8px; }
    .note-select-cb { opacity: 0; transition: opacity .12s ease; cursor: pointer; accent-color: var(--yq-green); }
    .note-card:hover .note-select-cb, .note-select-cb:checked, .notes-selecting .note-select-cb { opacity: 1; }
    .note-card-actions { display: flex; gap: 2px; opacity: 0; transition: opacity .12s ease; }
    .note-card:hover .note-card-actions { opacity: 1; }
    .note-card-body { color: var(--text-primary); line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
    .note-tag { display: inline-block; margin-top: 12px; padding: 2px 8px; border-radius: 4px; background: var(--yq-green-soft); color: var(--yq-green-soft-text); font-size: 11px; }

    /* Reader Shell (知识库首页 & 文档阅读/编辑) */
    .reader-shell { height: 100dvh; display: grid; grid-template-columns: var(--reader-sidebar-w) minmax(0, 1fr); grid-template-rows: 48px minmax(0, 1fr); overflow: hidden; background: var(--bg-primary); }
    .reader-bookbar {
      grid-column: 1; grid-row: 1; display: flex; align-items: center; gap: 8px; padding: 0 14px;
      background: var(--bg-secondary); border-right: 1px solid var(--border-light); color: var(--text-caption); font-size: 12px;
    }
    .reader-docbar {
      grid-column: 2; grid-row: 1; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 0 16px;
      border-bottom: 1px solid var(--border-light); background: var(--bg-primary);
    }
    .reader-docbar-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .reader-doc-title { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--text-primary); }
    .reader-doc-status { display: inline-flex; align-items: center; gap: 5px; color: var(--text-caption); font-size: 12px; white-space: nowrap; }
    .reader-docbar-actions { display: flex; align-items: center; gap: 6px; }
    .ai-badge-btn {
      width: 24px; height: 24px; border-radius: 50%; background: var(--yq-green-soft); color: var(--yq-green-bright);
      display: inline-grid; place-items: center; font-size: 10px; font-weight: 700;
    }
    .ai-badge-btn:hover { filter: brightness(1.1); }
    .docbar-pill-group {
      display: inline-flex; align-items: center; border: 1px solid var(--border-primary); border-radius: 6px;
      background: var(--bg-tertiary); overflow: hidden;
    }
    .docbar-pill-group button { width: 32px; height: 30px; display: inline-grid; place-items: center; color: var(--text-body); }
    .docbar-pill-group button:hover { background: var(--bg-hover); color: var(--text-primary); }
    .docbar-pill-group button + button { border-left: 1px solid var(--border-light); }

    .reader-sidebar {
      grid-column: 1; grid-row: 2; min-height: 0; display: flex; flex-direction: column;
      border-right: 1px solid var(--border-light); background: var(--bg-secondary);
    }
    .reader-book-title { height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 14px; }
    .book-switcher-btn { display: inline-flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 6px; font-size: 15px; font-weight: 600; min-width: 0; }
    .book-switcher-btn:hover { background: var(--bg-hover); }
    .book-switcher-btn strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reader-book-title .more-right { margin-left: auto; }
    .reader-search-row { display: flex; align-items: center; gap: 8px; padding: 4px 12px 10px; }
    .reader-search-row .search-entry { height: 32px; }
    .reader-search-row .plus-square-btn { width: 32px; height: 32px; }
    .reader-home { margin: 0 8px 6px; height: 34px; }
    .catalog-heading { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; color: var(--text-body); font-size: 13px; }
    .catalog-heading span { flex: 1; }
    .catalog-tree { flex: 1; min-height: 0; padding: 0 8px 30px; overflow-y: auto; scrollbar-width: thin; }
    .tree-row {
      width: 100%; min-height: 34px; display: flex; align-items: center; gap: 7px; padding: 5px 10px;
      border-radius: 6px; text-align: left; color: var(--text-body); font-size: 13px; line-height: 1.45;
    }
    .tree-row:hover { background: var(--bg-hover); color: var(--text-primary); }
    .tree-row.active { background: var(--bg-active); color: var(--text-primary); font-weight: 500; }
    .tree-row .tree-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-row .chevron { width: 12px; height: 12px; color: var(--text-caption); transition: transform .15s ease; flex: 0 0 auto; }
    .tree-row.closed .chevron { transform: rotate(-90deg); }
    .tree-children { margin-left: 14px; padding-left: 8px; border-left: 1px solid var(--border-light); }

    .reader-content { grid-column: 2; grid-row: 2; min-width: 0; min-height: 0; overflow-y: auto; background: var(--bg-primary); position: relative; scrollbar-width: thin; }

    /* Book Home Card */
    .book-home-canvas { padding: 24px 32px 60px; min-height: 100%; }
    html:not([data-theme="dark"]) .book-home-canvas { background: #f6f7f7; }
    .book-home-card {
      max-width: 1040px; margin: 0 auto; padding: 40px 56px 56px;
      border: 1px solid var(--border-light); border-radius: 12px; background: var(--bg-foreground);
    }
    .book-overview { display: flex; align-items: flex-start; gap: 14px; }
    .book-overview h1 { margin: 0 0 6px; font-size: 24px; line-height: 32px; font-weight: 600; }
    .book-stats { display: flex; align-items: center; gap: 18px; color: var(--text-caption); font-size: 13px; }
    .book-stats strong { margin-right: 4px; color: var(--text-primary); font-size: 15px; font-weight: 600; }
    .book-owner-row { margin-top: 12px; display: flex; align-items: center; gap: 8px; }
    .book-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .book-intro { margin: 44px 0 36px; font-size: 15px; line-height: 1.75; }
    .book-intro h2 { margin-bottom: 6px; font-size: 15px; font-weight: 600; }
    .book-intro p { margin: 0; color: var(--text-body); }
    .home-catalog { font-size: 14px; }
    .home-doc-row {
      width: 100%; display: flex; align-items: center; gap: 12px; min-height: 38px; padding: 4px 6px;
      border-radius: 6px; text-align: left; color: var(--text-body);
    }
    .home-doc-row:hover { background: var(--bg-hover); color: var(--text-primary); }
    .home-doc-title { max-width: 65%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dot-leader { flex: 1; min-width: 30px; border-bottom: 1px dashed var(--border-primary); }
    .home-doc-row time { color: var(--text-caption); font-size: 12px; }
    .home-group { margin: 6px 0; }
    .home-group > .tree-row { font-weight: 500; color: var(--text-primary); }
    .home-group .home-children { margin-left: 24px; }

    /* Document Read & Edit */
    .document-scroll { min-height: 100%; padding: 36px 48px 96px; position: relative; }
    .document-column { max-width: 780px; margin: 0 auto; min-width: 0; }
    .document-title { margin: 0 0 24px; font-size: 36px; line-height: 1.38; font-weight: 700; overflow-wrap: anywhere; }
    .title-input { width: 100%; margin: 0 0 22px; padding: 0; border: 0; background: transparent; outline: 0; font-size: 36px; line-height: 1.38; font-weight: 700; }
    .doc-body { min-height: 120px; color: var(--text-body); font-size: 15px; line-height: 1.78; letter-spacing: .2px; overflow-wrap: anywhere; }
    .doc-body h2 { margin: 32px 0 12px; color: var(--text-primary); font-size: 22px; line-height: 1.45; font-weight: 600; }
    .doc-body h3 { margin: 24px 0 10px; color: var(--text-primary); font-size: 18px; font-weight: 600; }
    .doc-body p { margin: 0 0 14px; }
    .doc-body ul, .doc-body ol { padding-left: 22px; margin: 0 0 14px; }
    .doc-body li { margin: 6px 0; }
    .doc-body blockquote { margin: 18px 0; padding: 10px 16px; border-left: 3px solid var(--border-heavy); background: var(--bg-subtle); color: var(--text-caption); border-radius: 0 6px 6px 0; }
    .doc-body pre { padding: 14px 16px; overflow-x: auto; border-radius: 6px; background: var(--bg-tertiary); border: 1px solid var(--border-light); font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text-primary); }
    .doc-body code { padding: 2px 6px; border-radius: 4px; background: var(--bg-tertiary); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .doc-body pre code { padding: 0; background: none; }
    .doc-body table { width: 100%; margin: 16px 0; border-collapse: collapse; }
    .doc-body th, .doc-body td { padding: 9px 12px; border: 1px solid var(--border-primary); text-align: left; }
    .doc-body th { background: var(--bg-tertiary); color: var(--text-primary); }
    .doc-editor { min-height: 440px; padding-bottom: 40px; outline: 0; }

    /* Editor Toolbar */
    .editor-toolbar {
      position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: 3px;
      padding: 7px 16px; overflow-x: auto; border-bottom: 1px solid var(--border-light);
      background: var(--bg-primary); scrollbar-width: none;
    }
    .editor-plus-circle {
      width: 24px; height: 24px; border-radius: 50%; background: var(--yq-green); color: #fff;
      display: inline-grid; place-items: center; flex: 0 0 auto; margin-right: 4px;
    }
    .editor-plus-circle:hover { background: var(--yq-green-dark); }
    .toolbar-button {
      height: 28px; min-width: 28px; display: inline-flex; align-items: center; justify-content: center; gap: 3px;
      flex: 0 0 auto; padding: 0 5px; border-radius: 5px; color: var(--text-body); font-size: 13px;
    }
    .toolbar-button:hover { background: var(--bg-hover); color: var(--text-primary); }
    .toolbar-separator { width: 1px; height: 16px; flex: 0 0 auto; margin: 0 5px; background: var(--border-light); }

    /* Empty doc like CTA */
    .doc-like-empty {
      width: 100%; display: grid; place-items: center; gap: 10px; min-height: 150px; margin: 12px 0 24px;
      color: var(--text-caption); text-align: center;
    }
    .doc-like-empty .thumb-icon { width: 32px; height: 32px; color: #e2a43b; transition: transform .15s ease; }
    .doc-like-empty:hover .thumb-icon { transform: scale(1.08); }
    .doc-like-empty.liked { color: var(--yq-green-bright); }
    .doc-like-empty.liked .thumb-icon { color: var(--yq-green-bright); }

    .doc-meta { display: flex; align-items: center; gap: 18px; margin: 22px 0 20px; color: var(--text-caption); font-size: 12px; }
    .doc-meta-item { display: inline-flex; align-items: center; gap: 5px; }

    /* Rich Comment Box */
    .comment-compose-row { display: flex; align-items: flex-start; gap: 12px; margin-top: 16px; }
    .comment-box {
      flex: 1; min-width: 0; border: 1px solid var(--border-primary); border-radius: 8px;
      background: var(--bg-foreground); overflow: hidden;
    }
    .comment-box:focus-within { border-color: var(--yq-green); }
    .comment-input { width: 100%; min-height: 82px; padding: 12px 14px 4px; border: 0; background: transparent; outline: 0; resize: vertical; font-size: 14px; }
    .comment-toolbar {
      display: flex; align-items: center; justify-content: space-between; padding: 6px 12px 8px; color: var(--text-caption); font-size: 12px;
    }
    .comment-tools-left { display: flex; align-items: center; gap: 6px; }
    .comment-plus { width: 20px; height: 20px; border-radius: 50%; background: var(--yq-green); color: #fff; display: inline-grid; place-items: center; }
    .comment-submit-row { margin-top: 10px; padding-left: 36px; }
    .comment-list { margin-top: 22px; display: grid; gap: 14px; padding-left: 36px; }
    .comment-item { padding: 12px 14px; border: 1px solid var(--border-light); border-radius: 8px; background: var(--bg-foreground); }
    .comment-item-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-caption); margin-bottom: 6px; }
    .comment-item-head strong { color: var(--text-primary); font-weight: 500; }

    /* Right Outline Rail & Expanded Drawer */
    .outline-rail {
      position: fixed; right: 10px; top: 50%; transform: translateY(-50%); z-index: 8;
      display: flex; flex-direction: column; align-items: flex-end; gap: 10px; padding: 10px 6px;
      cursor: pointer;
    }
    .outline-tick { height: 2px; border-radius: 2px; background: var(--border-heavy); transition: background .12s ease, width .12s ease; }
    .outline-tick.h2 { width: 16px; }
    .outline-tick.h3 { width: 10px; }
    .outline-tick.active { background: var(--yq-green-bright); width: 20px; }
    .outline-drawer {
      position: fixed; right: 18px; top: 82px; z-index: 12; width: 220px; max-height: 60dvh; overflow-y: auto;
      padding: 14px 12px; border: 1px solid var(--border-primary); border-radius: 10px;
      background: var(--bg-popover); box-shadow: var(--shadow-popover); font-size: 12px;
    }
    .outline-drawer strong { display: block; margin-bottom: 10px; font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .outline-button {
      display: block; width: 100%; padding: 5px 8px; border-radius: 5px; text-align: left;
      color: var(--text-body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .outline-button.h3 { padding-left: 18px; color: var(--text-caption); }
    .outline-button:hover, .outline-button.active { background: var(--bg-hover); color: var(--yq-green-bright); }

    /* Floating doc bottom-left & bottom-right widgets */
    .doc-word-count {
      position: fixed; left: calc(var(--reader-sidebar-w) + 12px); bottom: 10px; z-index: 5;
      font-size: 11px; color: var(--text-caption); pointer-events: none;
    }
    .reader-collapsed .doc-word-count { left: 14px; }
    .doc-float-actions {
      position: fixed; right: 24px; bottom: 28px; z-index: 8; display: flex; flex-direction: column; gap: 10px;
    }
    .float-circle-btn {
      width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border-primary);
      background: var(--bg-foreground); color: var(--text-body); display: grid; place-items: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
    }
    .float-circle-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .float-circle-btn.active { color: var(--yq-green-bright); border-color: var(--yq-green); }

    /* Template empty hints inside doc editor */
    .template-empty { margin-top: 32px; }
    .template-empty > p { color: var(--text-caption); font-size: 13px; margin-bottom: 12px; }
    .template-empty-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .template-empty-card {
      padding: 12px 14px; border: 1px solid var(--border-primary); border-radius: 8px;
      background: var(--bg-foreground); text-align: left;
    }
    .template-empty-card:hover { border-color: var(--yq-green); }
    .template-empty-card span { display: block; margin-bottom: 6px; font-size: 18px; }
    .template-empty-card strong { display: block; font-size: 13px; margin-bottom: 2px; }
    .template-empty-card small { color: var(--text-caption); font-size: 11px; }

    .reader-collapsed { grid-template-columns: 0 minmax(0, 1fr); }
    .reader-collapsed .reader-bookbar, .reader-collapsed .reader-sidebar { visibility: hidden; overflow: hidden; }

    /* Dialogs & Popovers */
    dialog { color: var(--text-primary); font-family: var(--font); border: 0; }
    dialog::backdrop { background: rgba(0, 0, 0, 0.52); backdrop-filter: blur(2px); }
    .form-dialog {
      width: min(460px, calc(100vw - 32px)); padding: 24px; border: 1px solid var(--border-primary);
      border-radius: 10px; background: var(--bg-popover); box-shadow: var(--shadow-modal);
    }
    .form-dialog h2 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
    .form-dialog > p { color: var(--text-caption); font-size: 13px; margin-bottom: 16px; }

    /* Search Dialog (Ctrl+J) */
    .search-dialog {
      width: min(640px, calc(100vw - 32px)); max-height: min(560px, calc(100dvh - 100px));
      margin-top: 11dvh; padding: 0; overflow: hidden; border: 1px solid var(--border-primary);
      border-radius: 10px; background: var(--bg-popover); box-shadow: var(--shadow-modal);
    }
    .search-box { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border-light); }
    .search-box input { flex: 1; min-width: 0; border: 0; background: transparent; outline: 0; font-size: 15px; color: var(--text-primary); }
    .search-hint-keys { display: inline-flex; align-items: center; gap: 5px; color: var(--text-caption); font-size: 12px; white-space: nowrap; }
    .search-hint-keys kbd { padding: 1px 5px; border: 1px solid var(--border-primary); border-radius: 4px; font: 11px var(--font); }
    .search-results { max-height: 430px; padding: 8px; overflow-y: auto; }
    .search-group-label { padding: 8px 10px 4px; font-size: 12px; color: var(--text-caption); }
    .search-result {
      width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 12px;
      border-radius: 6px; text-align: left; font-size: 14px;
    }
    .search-result:hover, .search-result.selected { background: var(--bg-active); }
    .search-result-content { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .search-result-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-result-meta { color: var(--text-caption); font-size: 12px; white-space: nowrap; }
    .search-empty { padding: 34px 16px; color: var(--text-caption); text-align: center; }

    /* Template Center Modal (Split-pane) */
    .template-dialog {
      width: min(1020px, calc(100vw - 32px)); height: min(680px, calc(100dvh - 48px));
      padding: 0; overflow: hidden; border: 1px solid var(--border-primary);
      border-radius: 12px; background: var(--bg-popover); box-shadow: var(--shadow-modal);
    }
    .template-dialog-inner { display: grid; grid-template-columns: minmax(0, 1fr) 268px; height: 100%; }
    .template-preview-pane { padding: 36px 44px; overflow-y: auto; background: var(--bg-foreground); }
    .template-preview-pane h1 { font-size: 28px; margin: 0 0 20px; }
    .template-sidebar-pane {
      display: flex; flex-direction: column; padding: 16px; border-left: 1px solid var(--border-light);
      background: var(--bg-secondary); overflow-y: auto;
    }
    .template-sidebar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .template-sidebar-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
    .template-tabs { display: flex; gap: 18px; margin: 14px 0 12px; border-bottom: 1px solid var(--border-light); }
    .template-tab { position: relative; padding-bottom: 8px; font-size: 13px; color: var(--text-caption); }
    .template-tab.active { color: var(--text-primary); font-weight: 500; }
    .template-tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--text-primary); }
    .template-cat-title { display: flex; align-items: center; gap: 6px; margin: 8px 0 6px; font-size: 12px; color: var(--text-caption); }
    .template-nav-item {
      width: 100%; display: flex; align-items: center; gap: 9px; padding: 8px 10px;
      border-radius: 6px; text-align: left; font-size: 13px; color: var(--text-body);
    }
    .template-nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .template-nav-item.active { background: var(--bg-active); color: var(--text-primary); font-weight: 500; }

    /* Popovers (更多 / 分享 / 新建下拉 / 知识库切换) */
    .popover {
      position: fixed; z-index: 40; min-width: 220px; padding: 8px;
      border: 1px solid var(--border-primary); border-radius: 10px;
      background: var(--bg-popover); box-shadow: var(--shadow-popover);
    }
    .popover[hidden] { display: none; }
    .popover-title { padding: 6px 10px 8px; font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .popover-item {
      width: 100%; display: flex; align-items: flex-start; gap: 10px; padding: 9px 10px;
      border-radius: 6px; text-align: left; color: var(--text-primary);
    }
    .popover-item:hover { background: var(--bg-hover); }
    .popover-item-title { font-size: 13px; font-weight: 500; }
    .popover-item-sub { font-size: 11px; color: var(--text-caption); margin-top: 2px; }
    .popover-divider { height: 1px; margin: 6px 4px; background: var(--border-light); }

    .share-popover { width: 340px; padding: 14px; }
    .share-status-note { font-size: 12px; color: var(--text-caption); margin-bottom: 12px; }
    .share-row { display: flex; align-items: center; gap: 12px; padding: 10px 4px; }
    .share-badge {
      width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; flex: 0 0 auto;
    }
    .share-badge.blue { background: rgba(59, 130, 206, 0.18); color: #5aa1eb; }
    .share-badge.green { background: var(--yq-green-soft); color: var(--yq-green-bright); }
    .share-row-info { flex: 1; min-width: 0; }
    .share-row-title { font-size: 14px; font-weight: 500; }
    .share-row-sub { font-size: 12px; color: var(--text-caption); }
    .share-copy-bar {
      display: flex; align-items: center; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-light);
    }

    .toast {
      position: fixed; z-index: 60; bottom: 28px; left: 50%; max-width: calc(100vw - 32px);
      padding: 9px 16px; border-radius: 6px; background: var(--bg-popover); color: var(--text-primary);
      border: 1px solid var(--border-primary); box-shadow: var(--shadow-popover); font-size: 13px;
      opacity: 0; pointer-events: none; transform: translate(-50%, 8px); transition: .16s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 1200px) {
      .quick-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .books-grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .explore-layout { grid-template-columns: minmax(0, 1fr); }
      .explore-aside { display: none; }
      .notes-layout { grid-template-columns: minmax(290px, 340px) minmax(0, 1fr); gap: 24px; }
    }
    @media (max-width: 900px) {
      .collections-layout { grid-template-columns: 1fr; }
      .doc-row, .collection-table-head, .collection-row { grid-template-columns: minmax(190px, 1fr) 110px 32px; }
      .doc-owner { display: none; }
      .template-dialog-inner { grid-template-columns: 1fr; }
      .template-preview-pane { display: none; }
    }
    @media (max-width: 720px) {
      .mobile-head { height: 50px; display: flex; align-items: center; gap: 8px; margin: -12px -16px 16px; padding: 0 12px; border-bottom: 1px solid var(--border-light); }
      .mobile-head strong { flex: 1; }
      .dashboard-shell { display: block; }
      .dashboard-sidebar {
        position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; width: 254px;
        transform: translateX(-102%); transition: transform .18s ease; box-shadow: 8px 0 30px rgba(0,0,0,.25);
      }
      .nav-open .dashboard-sidebar { transform: translateX(0); }
      .dashboard-main { padding: 12px 16px 40px; }
      .dashboard-main > .page-title { display: none; }
      .quick-grid, .books-grid-3, .template-empty-grid { grid-template-columns: 1fr; }
      .notes-layout { grid-template-columns: 1fr; }
      .note-composer-wrap { position: static; }
      .reader-shell, .reader-collapsed { grid-template-columns: 0 minmax(0, 1fr); }
      .reader-bookbar, .reader-sidebar { visibility: hidden; overflow: hidden; }
      .reader-mobile-open { grid-template-columns: minmax(0, 1fr); }
      .reader-mobile-open .reader-bookbar, .reader-mobile-open .reader-sidebar { position: relative; z-index: 20; visibility: visible; }
      .reader-mobile-open .reader-docbar, .reader-mobile-open .reader-content { display: none; }
      .book-home-canvas { padding: 16px; }
      .book-home-card { padding: 22px 18px; }
      .document-scroll { padding: 20px 18px 80px; }
      .doc-word-count { left: 12px; }
    }
  </style>
</head>

  <div id="app"></div>

  <!-- Global Search (Ctrl+J) -->
  <dialog class="search-dialog" id="searchDialog">
    <div class="search-box">
      <svg class="icon"><use href="#i-search"/></svg>
      <input id="searchInput" autocomplete="off" placeholder="搜索内容，或输入 > 唤醒更多" aria-label="全局搜索">
      <span class="search-hint-keys"><kbd>↑</kbd><kbd>↓</kbd> 切换内容</span>
    </div>
    <div class="search-results" id="searchResults"></div>
  </dialog>

  <!-- Template Center Split Modal -->
  <dialog class="template-dialog" id="templateDialog">
    <div class="template-dialog-inner" id="templateDialogInner"></div>
  </dialog>

  <!-- Create Doc Modal -->
  <dialog class="form-dialog" id="docDialog">
    <h2>新建文档</h2>
    <p>在选定知识库中创建演示文档。</p>
    <form id="docForm">
      <div class="form-field"><label for="docTitleInput">标题</label><input class="input" id="docTitleInput" required autocomplete="off" placeholder="请输入标题"></div>
      <div class="form-field"><label for="docBookInput">归属知识库</label><select class="select" id="docBookInput"></select></div>
      <div class="form-field"><label for="docTypeInput">类型</label><select class="select" id="docTypeInput"><option value="doc">文档</option><option value="sheet">表格</option><option value="board">画板</option><option value="data">数据表</option></select></div>
      <div class="form-actions"><button class="btn" type="button" data-action="close-dialog" data-dialog="docDialog">取消</button><button class="btn primary" type="submit">新建文档</button></div>
    </form>
  </dialog>

  <!-- Create Book Modal -->
  <dialog class="form-dialog" id="bookDialog">
    <h2>新建知识库</h2>
    <p>像整理一本书一样组织文档。</p>
    <form id="bookForm">
      <div class="form-field"><label for="bookNameInput">知识库名称</label><input class="input" id="bookNameInput" required maxlength="30" autocomplete="off" placeholder="例如：产品知识库"></div>
      <div class="form-field"><label for="bookDescInput">简介</label><textarea class="textarea" id="bookDescInput" placeholder="这个知识库用来记录什么？"></textarea></div>
      <div class="form-actions"><button class="btn" type="button" data-action="close-dialog" data-dialog="bookDialog">取消</button><button class="btn primary" type="submit">新建知识库</button></div>
    </form>
  </dialog>

  <!-- Help Shortcuts Modal -->
  <dialog class="form-dialog" id="helpDialog">
    <h2>快捷键</h2>
    <p>当前原型支持以下高频快捷键：</p>
    <div style="display:grid;gap:10px;font-size:13px;margin:12px 0">
      <div style="display:flex;justify-content:space-between"><span>全局搜索</span><kbd style="padding:2px 6px;border:1px solid var(--border-primary);border-radius:4px">Ctrl / ⌘ + J</kbd></div>
      <div style="display:flex;justify-content:space-between"><span>发布小记</span><kbd style="padding:2px 6px;border:1px solid var(--border-primary);border-radius:4px">Ctrl / ⌘ + Enter</kbd></div>
      <div style="display:flex;justify-content:space-between"><span>关闭弹窗</span><kbd style="padding:2px 6px;border:1px solid var(--border-primary);border-radius:4px">Esc</kbd></div>
    </div>
    <div class="form-actions"><button class="btn primary" data-action="close-dialog" data-dialog="helpDialog">知道了</button></div>
  </dialog>

  <!-- Popovers -->
  <div class="popover" id="morePopover" hidden style="bottom:52px;left:12px;width:236px">
    <div class="popover-title">更多</div>

          theme: state.theme,
          books: state.books,
          docs: state.docs,
          notes: state.notes,
          bookFavorites: [...state.bookFavorites]

      const el = $("#toast");
