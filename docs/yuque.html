          ? `<div class="empty-state"><div>${icon("users", "lg")}<h2>暂无邀请协作的知识库</h2><p>当他人邀请你加入知识库协作后，会显示在这里。</p></div></div>`
          : groups.map(group => {
              const items = state.books.filter(b => (b.group || "我的知识库") === group);
              if (!items.length) return "";
              return `<div class="books-group-title">${esc(group)}</div><div class="${state.booksLayout === "grid" ? "books-grid-3" : "books-list-stack"}">${items.map(renderCard).join("")}</div>`;
            }).join("")}`;
    }

    function noteCard(note) {
      return `<article class="note-card ${note.pinned ? "pinned" : ""}">
        <div class="note-card-head">
          <div class="note-card-left">
            <input class="note-select-cb" type="checkbox" data-change="select-note" data-note-id="${note.id}" ${state.selectedNotes.has(note.id) ? "checked" : ""} aria-label="选择小记">
            <span>更新于 ${esc(note.updated)}</span>
          </div>
          <div class="note-card-actions">
            <button class="icon-btn ${note.pinned ? "active" : ""}" data-action="pin-note" data-note-id="${note.id}" aria-label="${note.pinned ? "取消置顶" : "置顶"}">${icon("pin", "sm")}</button>
            <button class="icon-btn" data-action="delete-single-note" data-note-id="${note.id}" aria-label="删除">${icon("trash", "sm")}</button>
          </div>
        </div>
        <div class="note-card-body">${esc(note.body)}</div>
        ${note.tag ? `<span class="note-tag"># ${esc(note.tag)}</span>` : ""}
      </article>`;
    }

    function noteStreamSections() {
      const q = state.noteQuery.trim().toLowerCase();
      const filtered = state.notes.filter(n => !q || `${n.body} ${n.tag}`.toLowerCase().includes(q));
      const pinned = filtered.filter(n => n.pinned);
      const regular = filtered.filter(n => !n.pinned);
      if (!filtered.length) return `<div class="empty-state"><div><h2>没有匹配的小记</h2><p>换一个关键词，或写下新的想法。</p></div></div>`;
      return `${pinned.length ? `
          <button class="note-group-title" data-action="toggle-note-pinned"><span>置顶</span>${icon("chevron-down", "xs")}</button>
          ${state.notePinnedOpen ? `<div class="note-cards-list">${pinned.map(noteCard).join("")}</div>` : ""}
        ` : ""}
        ${regular.length ? `<div class="note-group-title" style="cursor:default">小记</div><div class="note-cards-list">${regular.map(noteCard).join("")}</div>` : ""}`;
    }

    function notesView() {
      return `${mobileHead("小记")}
        <div class="notes-shell ${state.selectedNotes.size ? "notes-selecting" : ""}">
          <div class="notes-topbar">
            <div class="notes-topbar-left">
              <h1 class="page-title">小记</h1>
              <div class="view-toggle-pill">
                <button class="${state.noteViewMode === "list" ? "active" : ""}" data-action="note-view-mode" data-mode="list" aria-label="列表视图">${icon("list", "sm")}</button>
                <button class="${state.noteViewMode === "grid" ? "active" : ""}" data-action="note-view-mode" data-mode="grid" aria-label="便签视图">${icon("grid", "sm")}<span>${String(state.notes.length).padStart(2, "0")}</span></button>
              </div>
            </div>
            <div class="notes-topbar-right">
              ${state.selectedNotes.size ? `<button class="btn danger" style="height:28px;font-size:12px" data-action="delete-notes">删除 (${state.selectedNotes.size})</button>` : ""}
              ${state.noteSearchOpen ? `<input class="collections-search-input" value="${esc(state.noteQuery)}" data-input="note-search" placeholder="搜索小记..." aria-label="搜索小记">` : ""}
              <button class="icon-btn" data-action="toggle-note-search" aria-label="搜索小记">${icon("search", "sm")}</button>
              <button class="icon-btn" data-action="service-info" data-service="小记筛选" aria-label="筛选">${icon("filter", "sm")}</button>
              <button class="icon-btn" data-action="toast-msg" data-msg="已按更新时间倒序排列" aria-label="排序">${icon("sort", "sm")}</button>
            </div>
          </div>
          <div class="notes-layout">
            <section class="note-composer-wrap">
              <div class="note-composer-card">
                <div class="composer-head-tools">
                  <div class="composer-tools">
                    <button class="icon-btn" data-action="format-note" data-command="insertUnorderedList" aria-label="插入图片">${icon("image", "sm")}</button>
                    <button class="icon-btn" data-action="insert-note-todo" aria-label="插入待办">${icon("check-box", "sm")}</button>
                    <button class="icon-btn" data-action="format-note" data-command="createLink" aria-label="添加链接">${icon("bookmark", "sm")}</button>
                    <button class="icon-btn" data-action="toast-msg" data-msg="HTML 原型暂不上传本地附件" aria-label="附件">${icon("attachment", "sm")}</button>
                  </div>
                  <button class="icon-btn" data-action="toast-msg" data-msg="当前已是桌面双栏记录视图" aria-label="全屏">${icon("expand", "sm")}</button>
                </div>
                <div class="note-input" id="noteComposer" contenteditable="true" data-input="note-draft" aria-label="记你想记">${esc(state.noteDraft)}</div>
                <div class="composer-tag-bar">
                  <label class="tag-pill-input">${icon("plus", "xs")}<input value="${esc(state.noteTag)}" data-input="note-tag" placeholder="添加标签" aria-label="添加标签"></label>
                </div>
              </div>
              <div class="composer-footer">
                <button class="btn subtle" id="publishNote" data-action="publish-note" ${state.noteDraft.trim() ? "" : "disabled"}>小记一下</button>
                <span>按 ⌘ Enter 发布</span>
              </div>
            </section>
            <section class="note-stream-wrap ${state.noteViewMode === "grid" ? "grid-mode" : ""}" id="noteStream">
              ${noteStreamSections()}
            </section>
          </div>
        </div>`;
    }

    function dashboardView() {
      const views = { start: startView, notes: notesView, collections: collectionsView, explore: exploreView, books: booksView };
      const content = (views[state.view] || startView)();
      return `<div class="dashboard-shell ${state.mobileNav ? "nav-open" : ""}">${dashboardSidebar()}<main class="dashboard-main">${content}</main></div>`;
    }

    function catalogFor(book) {
      if (Array.isArray(book.catalog)) return book.catalog;
      return state.docs.filter(d => d.book === book.id).map(d => ({ id: `node-${d.id}`, type: "doc", docId: d.id }));
    }

    function treeNodes(nodes, bookId, home = false) {
      return nodes.map(node => {
        if (node.type === "doc") {
          const doc = docById(node.docId);
          if (!doc) return "";
          if (home) {
            return `<button class="home-doc-row" data-action="open-doc" data-doc-id="${doc.id}"><span class="home-doc-title">${esc(doc.title)}</span><span class="dot-leader"></span><time>${esc(doc.updated)}</time></button>`;
          }
          return `<button class="tree-row ${state.docId === doc.id ? "active" : ""}" data-action="open-doc" data-doc-id="${doc.id}"><span class="tree-label">${esc(doc.title)}</span></button>`;
        }
        const key = `${bookId}:${node.id}`;
        const closed = state.collapsed.has(key);
        const children = node.children || [];
        if (home) {
          return `<div class="home-group"><button class="tree-row ${closed ? "closed" : ""}" data-action="toggle-group" data-book-id="${bookId}" data-group-id="${node.id}">${icon("chevron-down", "chevron")}<span>${esc(node.label)}</span></button>${closed ? "" : `<div class="home-children">${treeNodes(children, bookId, true)}</div>`}</div>`;
        }
        return `<div><button class="tree-row ${closed ? "closed" : ""}" data-action="toggle-group" data-book-id="${bookId}" data-group-id="${node.id}">${icon("chevron-down", "chevron")}<span class="tree-label">${esc(node.label)}</span></button>${closed ? "" : `<div class="tree-children">${treeNodes(children, bookId)}</div>`}</div>`;
      }).join("");
    }

    function readerSidebar(book) {
      return `<aside class="reader-sidebar" aria-label="知识库目录">
        <div class="reader-book-title">
          <button class="book-switcher-btn" data-action="toggle-book-switcher">
            ${bookIconSvg(book.icon)}
            <strong>${esc(book.name)}</strong>
            <svg class="icon xs muted" viewBox="0 0 24 24"><use href="#i-lock"/></svg>
            ${icon("chevron-down", "xs muted")}
          </button>
          <button class="icon-btn more-right" data-action="book-menu" aria-label="知识库设置">${icon("dots", "sm")}</button>
        </div>
        <div class="reader-search-row">
          <button class="search-entry" data-action="open-search">${icon("search", "sm")}<span>搜索</span><kbd>⌘ + J</kbd></button>
          <button class="plus-square-btn" data-action="new-doc" aria-label="新建文档">${icon("plus", "sm")}</button>
        </div>
        <button class="tree-row reader-home ${state.view === "book" ? "active" : ""}" data-action="open-book" data-book-id="${book.id}">${icon("home", "sm")}<span>首页</span></button>
        <div class="catalog-heading">${icon("catalog", "sm")}<span>目录</span><button class="icon-btn" style="width:24px;height:24px" data-action="locate-doc" aria-label="定位当前文档">${icon("locate", "xs")}</button><button class="icon-btn" style="width:24px;height:24px" data-action="catalog-settings" aria-label="展开或收起目录">${icon("list", "xs")}</button></div>
        <div class="catalog-tree">${treeNodes(catalogFor(book), book.id)}</div>
      </aside>`;
    }

    function readerDocbar(book) {
      const doc = state.view === "doc" ? docById(state.docId) : null;
      return `<div class="reader-docbar">
        <div class="reader-docbar-left">
          ${(state.readerCollapsed || innerWidth <= 720) ? `<button class="icon-btn" data-action="toggle-reader-sidebar" aria-label="展开目录">${icon("panel-left", "sm")}</button>` : ""}
          ${doc ? `
            <span class="reader-doc-title">${esc(doc.title)}</span>
            <svg class="icon xs muted" viewBox="0 0 24 24"><use href="#i-lock"/></svg>
            ${state.editing ? `<span class="reader-doc-status">${icon("cloud", "xs")} 已加载最新版本</span>` : ""}
          ` : ""}
        </div>
        <div class="reader-docbar-actions">
          ${doc ? `
            <button class="ai-badge-btn" data-action="service-info" data-service="AI 阅读助手" aria-label="AI 助手">AI</button>
            <button class="icon-btn ${doc.favorite ? "active" : ""}" data-action="favorite-doc" data-doc-id="${doc.id}" aria-label="收藏文档">${icon("star", "sm")}</button>
            <button class="icon-btn" data-action="history-info" aria-label="历史版本">${icon("history", "sm")}</button>
            <button class="icon-btn" data-action="toggle-share-popover" data-doc-id="${doc.id}" aria-label="添加协作者">${icon("user-plus", "sm")}</button>
            <button class="icon-btn" data-action="present-doc" aria-label="演示模式">${icon("bookmark", "sm")}</button>
            <button class="btn subtle" data-action="toggle-share-popover" data-doc-id="${doc.id}">分享</button>
            <button class="btn ${state.editing ? "subtle" : "primary"}" data-action="${state.editing ? "update-doc" : "edit-doc"}" data-doc-id="${doc.id}">${state.editing ? "更新" : "编辑"}</button>
            <div class="docbar-pill-group">
              <button data-action="reader-comment" aria-label="评论">${icon("comment", "sm")}</button>
              <button data-action="toggle-outline" aria-label="大纲与侧栏">${icon("panel", "sm")}</button>
            </div>
          ` : `
            <button class="icon-btn" data-action="toggle-reader-sidebar" aria-label="切换目录">${icon("panel-left", "sm")}</button>
            <button class="icon-btn" data-action="go-start" aria-label="返回工作台">${icon("close", "sm")}</button>
          `}
        </div>
      </div>`;
    }

    function bookHome(book) {
      const docs = state.docs.filter(d => d.book === book.id);
      const introLines = esc(book.description).split("\n");
      const fav = state.bookFavorites.has(book.id);
      return `<div class="book-home-canvas">
        <div class="book-home-card">
          <div class="book-overview">
            ${bookIconSvg(book.icon, "xl")}
            <div>
              <h1>${esc(book.name)}</h1>
              <div class="book-stats">
                <span><strong>${(book.statDocs ?? docs.length) + (book.catalog ? Math.max(0, docs.length - seedDocs.filter(d => d.book === book.id).length) : 0)}</strong> 文档</span>
                <span><strong>${book.statWords || textOf(docs.map(d => d.body).join("")).length}</strong> 字</span>
                ${icon("info", "xs muted")}
              </div>
              <div class="book-owner-row"><span class="avatar-badge">G</span></div>
            </div>
            <div class="book-actions">
              <button class="btn ${fav ? "primary" : "subtle"}" data-action="favorite-book" data-book-id="${book.id}">${icon("star", "sm")}<span>${fav ? "已收藏" : "收藏"}</span></button>
              <button class="btn subtle" data-action="toggle-share-popover" data-book-id="${book.id}">分享</button>
              <button class="btn subtle" style="padding:0 10px" data-action="book-menu" aria-label="更多">${icon("dots", "sm")}</button>
            </div>
          </div>
          <div class="book-intro">
            <h2>${introLines[0]}</h2>
            <p>${introLines.slice(1).join("<br>")}</p>
          </div>
          <div class="home-catalog">
            ${treeNodes(catalogFor(book), book.id, true) || `<div class="empty-state"><div><h2>从第一篇文档开始</h2><p>新建文档后，它会出现在知识库目录中。</p><button class="btn primary" data-action="new-doc">新建文档</button></div></div>`}
          </div>
        </div>
      </div>`;
    }

    function outlineElements(body) {
      const t = document.createElement("template");
      t.innerHTML = clean(body);
      const headings = [...t.content.querySelectorAll("h1,h2,h3")];
      if (!headings.length) return "";
      return `
        <div class="outline-rail" data-action="toggle-outline" title="文档大纲">
          ${headings.map((h, i) => `<span class="outline-tick ${h.tagName.toLowerCase()} ${i === 0 ? "active" : ""}"></span>`).join("")}
        </div>
        ${state.outlineOpen ? `
          <aside class="outline-drawer" aria-label="文档大纲">
            <strong>大纲</strong>
            ${headings.map((h, i) => `<button class="outline-button ${h.tagName.toLowerCase()}" data-action="outline" data-index="${i}">${esc(h.textContent)}</button>`).join("")}
          </aside>
        ` : ""}`;
    }

    function editorToolbar() {
      const tools = [
        ["list", "insertUnorderedList", "无序列表"],
        ["ordered", "insertOrderedList", "有序列表"],
        ["quote", "quote", "引用"],
        ["code", "code", "代码块"],
        ["link", "createLink", "插入链接"]
      ];
      return `<div class="editor-toolbar">
        <button class="editor-plus-circle" data-action="insert-block" aria-label="插入卡片">${icon("plus", "sm")}</button>
        <button class="toolbar-button" data-action="format-doc" data-command="undo" aria-label="撤销">${icon("undo", "sm")}</button>
        <button class="toolbar-button" data-action="format-doc" data-command="redo" aria-label="重做">${icon("redo", "sm")}</button>
        <span class="toolbar-separator"></span>
        <button class="toolbar-button" data-action="format-doc" data-command="formatBlock" data-value="h2">标题1 ${icon("chevron-down", "xs")}</button>
        <button class="toolbar-button" data-action="font-size">15px ${icon("chevron-down", "xs")}</button>
        <span class="toolbar-separator"></span>
        <button class="toolbar-button" data-action="format-doc" data-command="bold" aria-label="加粗"><strong>B</strong></button>
        <button class="toolbar-button" data-action="format-doc" data-command="italic" aria-label="斜体"><em>I</em></button>
        <button class="toolbar-button" data-action="format-doc" data-command="strikeThrough" aria-label="删除线"><s>S</s></button>
        <button class="toolbar-button" data-action="format-doc" data-command="underline" aria-label="下划线"><u>U</u></button>
        <span class="toolbar-separator"></span>
        ${tools.map(([g, cmd, label]) => `<button class="toolbar-button" data-action="format-doc" data-command="${cmd}" aria-label="${label}">${icon(g, "sm")}</button>`).join("")}
        <span class="toolbar-separator"></span>
        <button class="toolbar-button" data-action="format-doc" data-command="removeFormat" aria-label="清除格式">${icon("close", "sm")}</button>
      </div>`;
    }

    function templateEmpty() {
      return `<div class="template-empty">
        <p>直接输入正文，也可从常用模板起步：</p>
        <div class="template-empty-grid">
          ${templates.slice(0, 6).map(t => `<button class="template-empty-card" data-action="fill-template" data-template-id="${t.id}"><span>${t.icon}</span><strong>${esc(t.name)}</strong><small>${esc(t.source)}</small></button>`).join("")}
        </div>
      </div>`;
    }

    function documentView(doc) {
      const words = textOf(doc.body).replace(/\s+/g, "").length;
      if (state.editing) {
        return `${editorToolbar()}
          <div class="document-scroll">
            <article class="document-column">
              <input class="title-input" id="editorTitle" value="${esc(doc.title)}" data-input="doc-title" data-doc-id="${doc.id}" placeholder="请输入标题" aria-label="文档标题">
              <div class="doc-body doc-editor" id="docEditor" contenteditable="true" data-input="doc-body" data-doc-id="${doc.id}" aria-label="文档正文">${clean(doc.body)}</div>
              ${doc.body ? "" : templateEmpty()}
            </article>
            <div class="doc-word-count" id="docWordCount">${words}字</div>
          </div>`;
      }
      const comments = Array.isArray(doc.commentsList) ? doc.commentsList : [];
      return `<div class="document-scroll">
        <article class="document-column">
          <h1 class="document-title">${esc(doc.title)}</h1>
          <div class="doc-body">${clean(doc.body)}</div>
          ${doc.body ? "" : `<button class="doc-like-empty ${doc.liked ? "liked" : ""}" data-action="like-doc" data-doc-id="${doc.id}">${icon("thumb", "thumb-icon")}<span>${doc.liked ? "感谢你的点赞" : "若有收获，就点个赞吧"}</span></button>`}
          <div class="doc-meta">
            <span class="doc-meta-item">${icon("users", "sm")}</span>
            <span class="doc-meta-item">${icon("clock", "sm")} ${esc(doc.updated)}</span>
            <span class="doc-meta-item">${icon("eye", "sm")} ${doc.views ?? 0}</span>
            <span class="doc-meta-item">${icon("comment", "sm")} ${comments.length}</span>
          </div>
          <div class="comment-compose-row">
            <span class="avatar-badge">G</span>
            <div class="comment-box" id="commentBox">
              <textarea class="comment-input" id="commentInput" placeholder="写下你的评论..." aria-label="评论"></textarea>
              <div class="comment-toolbar">
                <div class="comment-tools-left">
                  <span class="comment-plus">${icon("plus", "xs")}</span>
                  <span>正文 ⌄</span>
                  <span style="font-weight:700">B</span>
                  ${icon("ordered", "sm")}
                  ${icon("list", "sm")}
                  ${icon("link", "sm")}
                  ${icon("smile", "sm")}
                </div>
                <span class="muted">⌘ + B 粗体</span>
              </div>
            </div>
          </div>
          <div class="comment-submit-row">
            <button class="btn primary" id="replyDocBtn" data-action="reply-doc" data-doc-id="${doc.id}" disabled>回复</button>
          </div>
          ${comments.length ? `
            <div class="comment-list">
              ${comments.map(c => `<div class="comment-item"><div class="comment-item-head"><strong>${esc(c.author)}</strong><span>${esc(c.time)}</span></div><div>${esc(c.text)}</div></div>`).join("")}
            </div>
          ` : ""}
        </article>
        ${outlineElements(doc.body)}
        <div class="doc-word-count">${words}字</div>
        <div class="doc-float-actions">
          <button class="float-circle-btn ${doc.liked ? "active" : ""}" data-action="like-doc" data-doc-id="${doc.id}" aria-label="点赞">${icon("thumb", "sm")}</button>
          <button class="float-circle-btn" data-action="reader-comment" aria-label="前往评论">${icon("comment", "sm")}</button>
        </div>
      </div>`;
    }

    function readerView() {
      const book = bookById(state.bookId) || state.books[0];
      if (!book) return dashboardView();
      const doc = state.view === "doc" ? docById(state.docId) : null;
      const content = doc ? documentView(doc) : bookHome(book);
      return `<div class="reader-shell ${state.readerCollapsed ? "reader-collapsed" : ""} ${state.readerMobile ? "reader-mobile-open" : ""}">
        <div class="reader-bookbar">
          <button style="display:inline-flex;align-items:center;gap:6px" data-action="go-start">
            <span class="logo-mark sm">${icon("bird")}</span>
            ${icon("chevron-right", "xs")}
            <span>个人知识库</span>
          </button>
        </div>
        ${readerDocbar(book)}
        ${readerSidebar(book)}
        <main class="reader-content" id="readerContent">${content}</main>
      </div>`;
    }

    function render() {
      app.innerHTML = ["book","doc"].includes(state.view) ? readerView() : dashboardView();
      const doc = state.view === "doc" ? docById(state.docId) : null;
      const pageTitle = doc ? doc.title : state.view === "book" ? bookName(state.bookId) : ({ start:"开始", notes:"小记", collections:"收藏", explore:"逛逛", books:"知识库" })[state.view] || "工作台";
      document.title = `${pageTitle} · 语雀`;
      applyTheme();
    }

    function openDoc(id) {
      const doc = docById(id);
      if (!doc) return;
      state.bookId = doc.book;
      state.docId = doc.id;
      state.view = "doc";
      state.editing = false;
      state.outlineOpen = false;
      state.readerMobile = false;
      doc.viewed = true;
      render();
    }

    function openBook(id) {
      if (!bookById(id)) return;
      state.bookId = id;
      state.docId = null;
      state.view = "book";
      state.editing = false;
      state.outlineOpen = false;
      state.mobileNav = false;
      state.readerMobile = false;
      render();
    }

    function openDocDialog(defaultType = "doc") {
      $("#docBookInput").innerHTML = state.books.map(b => `<option value="${b.id}" ${b.id === state.bookId ? "selected" : ""}>${esc(b.name)}</option>`).join("");
      $("#docTitleInput").value = "";
      $("#docTypeInput").value = defaultType;
      $("#docDialog").showModal();
      requestAnimationFrame(() => $("#docTitleInput").focus());
    }

    function openSearch() {
      hideAllPopovers();
      searchInput.value = "";
      state.searchIndex = 0;
      renderSearchResults();
      searchDialog.showModal();
      requestAnimationFrame(() => searchInput.focus());
    }

    function searchEntries() {
      const raw = searchInput.value.trim();
      if (raw.startsWith(">")) {
        return [
          { group:"命令", kind:"command", id:"new-doc", title:"新建文档", hint:"↵ 执行", icon:"plus" },
          { group:"命令", kind:"command", id:"new-book", title:"新建知识库", hint:"↵ 执行", icon:"book" },
          { group:"命令", kind:"command", id:"notes", title:"前往小记", hint:"↵ 跳转", icon:"feather" },
          { group:"命令", kind:"command", id:"templates", title:"打开模板中心", hint:"↵ 打开", icon:"grid" }
        ];
      }
      const q = raw.toLowerCase();
      if (!q) {
        return [
          { group:"页面", kind:"page", id:"start", title:"开始", hint:"↵ 跳转", icon:"clock" },
          { group:"页面", kind:"page", id:"notes", title:"小记", hint:"↵ 跳转", icon:"feather" },
          ...state.books.map(b => ({ group:"知识库", kind:"book", id:b.id, title:b.name, bookIcon:b.icon, hint:"" }))
        ];
      }
      return [
        ...state.books.filter(b => `${b.name} ${b.description}`.toLowerCase().includes(q)).map(b => ({ group:"知识库", kind:"book", id:b.id, title:b.name, bookIcon:b.icon, hint:"知识库" })),
        ...state.docs.filter(d => `${d.title} ${textOf(d.body)}`.toLowerCase().includes(q)).map(d => ({ group:"文档", kind:"doc", id:d.id, title:d.title, docType:d.type, hint:bookName(d.book) })),
        ...state.notes.filter(n => `${n.body} ${n.tag}`.toLowerCase().includes(q)).map(n => ({ group:"小记", kind:"note", id:n.id, title:n.body.split("\n")[0], icon:"feather", hint:"小记" }))
      ].slice(0, 14);
    }

    function renderSearchResults() {
      const items = searchEntries();
      state.searchIndex = Math.min(state.searchIndex, Math.max(0, items.length - 1));
      if (!items.length) {
        $("#searchResults").innerHTML = `<div class="search-empty">没有找到匹配的内容</div>`;
        return;
      }
      let lastGroup = "";
      $("#searchResults").innerHTML = items.map((item, idx) => {
        const groupHead = item.group !== lastGroup ? `<div class="search-group-label">${esc(item.group)}</div>` : "";
        lastGroup = item.group;
        const glyph = item.bookIcon ? bookIconSvg(item.bookIcon) : item.docType ? docIconSvg(item.docType) : icon(item.icon || "doc");
        return `${groupHead}<button class="search-result ${idx === state.searchIndex ? "selected" : ""}" data-action="search-result" data-kind="${item.kind}" data-id="${item.id}">
          ${glyph}
          <span class="search-result-content">
            <span class="search-result-title">${esc(item.title)}</span>
            ${item.hint ? `<span class="search-result-meta">${esc(item.hint)}</span>` : ""}
          </span>
        </button>`;
      }).join("");
    }

    function selectSearchResult(kind, id) {
      searchDialog.close();
      if (kind === "doc") openDoc(id);
      else if (kind === "book") openBook(id);
      else if (kind === "page") navigate(id);
      else if (kind === "note") {
        const n = state.notes.find(x => x.id === id);
        state.noteQuery = n ? n.body.split("\n")[0] : "";
        state.noteSearchOpen = true;
        navigate("notes");
      } else if (kind === "command") {
        if (id === "new-doc") openDocDialog();
        else if (id === "new-book") { $("#bookNameInput").value = ""; $("#bookDescInput").value = ""; $("#bookDialog").showModal(); }
        else if (id === "templates") openTemplateModal();
        else navigate(id);
      }
    }

    function renderTemplateModal() {
      const list = templates.filter(t => state.templateTab === "mine" ? t.source === "我的" : true);
      const active = list.find(t => t.id === state.selectedTemplateId) || list[0] || templates[0];
      state.selectedTemplateId = active.id;
      const cats = [...new Set(list.map(t => t.cat))];
      $("#templateDialogInner").innerHTML = `
        <div class="template-preview-pane">
          <h1>${esc(active.name)}</h1>
          <div class="doc-body">${active.preview || '<p class="muted">空白文档，从零开始自由创作。</p>'}</div>
        </div>
        <aside class="template-sidebar-pane">
          <div class="template-sidebar-head">
            <div class="template-sidebar-title"><span>📋</span><span>模板中心</span></div>
            <button class="icon-btn" data-action="close-dialog" data-dialog="templateDialog" aria-label="关闭">${icon("close", "sm")}</button>
          </div>
          <button class="btn primary" style="width:100%" data-action="use-template" data-template-id="${active.id}">使用此模板</button>
          <div class="template-tabs">
            <button class="template-tab ${state.templateTab === "recommend" ? "active" : ""}" data-action="template-tab" data-tab="recommend">推荐</button>
            <button class="template-tab ${state.templateTab === "mine" ? "active" : ""}" data-action="template-tab" data-tab="mine">我的</button>
          </div>
          ${cats.map(cat => `
            <div class="template-cat-title">${icon("chevron-down", "xs")}<span>${esc(cat)}</span></div>
            ${list.filter(t => t.cat === cat).map(t => `
              <button class="template-nav-item ${t.id === active.id ? "active" : ""}" data-action="preview-template" data-template-id="${t.id}">
                <span>${t.icon}</span><span>${esc(t.name)}</span>
              </button>
            `).join("")}
          `).join("")}
        </aside>`;
    }

    function openTemplateModal() {
      hideAllPopovers();
      renderTemplateModal();
      $("#templateDialog").showModal();
    }

    function openSharePopover(anchorEl, docId, bookId) {
      const pop = $("#sharePopover");
      const targetDoc = docId ? docById(docId) : null;
      const targetBook = bookId ? bookById(bookId) : null;
      const isPublic = targetDoc ? !!targetDoc.isPublic : !!targetBook?.isPublic;
      const label = targetDoc ? "文档" : "知识库";
      const demoUrl = `${location.href.split("#")[0]}#${docId ? `doc=${encodeURIComponent(docId)}` : `book=${encodeURIComponent(bookId)}`}`;
      pop.innerHTML = `
        <div class="share-status-note">当前${label}为${isPublic ? "互联网公开（本地演示状态）" : "私密，仅自己和协作者可访问"}</div>
        <div class="share-row">
          <div class="share-badge blue">${icon("user-plus")}</div>
          <div class="share-row-info">
            <div class="share-row-title">添加协作者</div>
            <div class="share-row-sub">通过链接，邀请对方加入协作</div>
          </div>
          <button class="icon-btn" data-action="copy-share-url" data-url="${esc(demoUrl)}" aria-label="复制链接">${icon("link", "sm")}</button>
          <button class="icon-btn" data-action="toast-msg" data-msg="本地原型不发起真实协作邀请" aria-label="邀请协作者">${icon("user-plus", "sm")}</button>
        </div>
        <div class="share-row">
          <div class="share-badge green">${icon("globe")}</div>
          <div class="share-row-info">
            <div class="share-row-title">互联网公开</div>
            <div class="share-row-sub">开启后，互联网所有人可访问</div>
          </div>
          <button class="btn ${isPublic ? "primary" : "subtle"}" style="height:28px;padding:0 12px" data-action="toggle-public-share" ${docId ? `data-doc-id="${docId}"` : `data-book-id="${bookId}"`}>${isPublic ? "已公开" : "公开"}</button>
        </div>
        <div class="share-copy-bar">
          <input class="input" id="shareInput" readonly value="${esc(demoUrl)}" style="height:30px;min-height:30px;font-size:12px" aria-label="演示链接">
          <button class="btn primary" style="height:30px" data-action="copy-share-url" data-url="${esc(demoUrl)}">复制</button>
        </div>`;
      const r = anchorEl.getBoundingClientRect();
      pop.style.top = `${Math.min(innerHeight - 240, r.bottom + 8)}px`;
      pop.style.left = `${Math.max(12, Math.min(innerWidth - 356, r.right - 340))}px`;
      pop.hidden = false;
    }

    function publishNote() {
      const body = state.noteDraft.trim();
      if (!body) return;
      state.notes.unshift({ id: uid("note"), body, tag: state.noteTag.trim(), updated: "刚刚", pinned: false });
      state.noteDraft = "";
      state.noteTag = "";
      persist();
      render();
      toast("小记已发布");
    }

    document.addEventListener("click", event => {
      const btn = event.target.closest("[data-action]");
      if (!btn) {
        if (!event.target.closest(".popover")) hideAllPopovers();
        return;
      }
      const act = btn.dataset.action;
      if (act === "go-start") navigate("start");
      else if (act === "dashboard-view") navigate(btn.dataset.view);
      else if (act === "open-book") openBook(btn.dataset.bookId);
      else if (act === "open-doc") openDoc(btn.dataset.docId);
      else if (act === "new-doc") openDocDialog("doc");
      else if (act === "quick-create-type") { hideAllPopovers(); openDocDialog(btn.dataset.type); }
      else if (act === "new-book") { hideAllPopovers(); $("#bookNameInput").value = ""; $("#bookDescInput").value = ""; $("#bookDialog").showModal(); requestAnimationFrame(() => $("#bookNameInput").focus()); }
      else if (act === "close-dialog") $("#" + btn.dataset.dialog).close();
      else if (act === "open-search") openSearch();
      else if (act === "search-result") selectSearchResult(btn.dataset.kind, btn.dataset.id);
      else if (act === "open-templates") openTemplateModal();
      else if (act === "preview-template") { state.selectedTemplateId = btn.dataset.templateId; renderTemplateModal(); }
      else if (act === "template-tab") { state.templateTab = btn.dataset.tab; renderTemplateModal(); }
      else if (act === "activity-filter") { state.filter = btn.dataset.filter; render(); }
      else if (act === "favorite-doc") { const d = docById(btn.dataset.docId); if (d) { d.favorite = !d.favorite; persist(); render(); toast(d.favorite ? "已收藏" : "已取消收藏"); } }
      else if (act === "favorite-book") { const id = btn.dataset.bookId; state.bookFavorites.has(id) ? state.bookFavorites.delete(id) : state.bookFavorites.add(id); persist(); render(); }
      else if (act === "edit-doc") { state.editing = true; state.outlineOpen = false; render(); }
      else if (act === "update-doc") {
        const d = docById(btn.dataset.docId);
        if (d) {
          d.updated = "刚刚";
          d.title = $("#editorTitle")?.value.trim() || "无标题";
          d.body = clean($("#docEditor")?.innerHTML || "");
          d.viewed = true;
        }
        state.editing = false;
        persist();
        render();
        toast("已更新");
      }
      else if (act === "like-doc") { const d = docById(btn.dataset.docId); if (d) { d.liked = !d.liked; d.likes = (d.likes || 0) + (d.liked ? 1 : -1); persist(); render(); } }
      else if (act === "reply-doc") {
        const d = docById(btn.dataset.docId);
        const input = $("#commentInput");
        if (d && input?.value.trim()) {
          d.commentsList = d.commentsList || [];
          d.commentsList.push({ author:"GRREESD", time:"刚刚", text: input.value.trim() });
          d.commented = true;
          input.value = "";
          persist();
          render();
          toast("评论已发布");
        } else toast("请先写下评论内容");
      }
      else if (act === "toggle-share-popover") {
        const pop = $("#sharePopover");
        const wasOpen = !pop.hidden;
        hideAllPopovers();
        if (!wasOpen) openSharePopover(btn, btn.dataset.docId, btn.dataset.bookId);
      }
      else if (act === "toggle-public-share") {
        if (btn.dataset.docId) { const d = docById(btn.dataset.docId); if (d) d.isPublic = !d.isPublic; }
        else if (btn.dataset.bookId) { const b = bookById(btn.dataset.bookId); if (b) b.isPublic = !b.isPublic; }
        persist();
        openSharePopover(btn, btn.dataset.docId, btn.dataset.bookId);
        toast("已更新本地演示公开状态");
      }
      else if (act === "copy-share-url") {
        const url = btn.dataset.url || $("#shareInput")?.value || "";
        if (navigator.clipboard?.writeText) navigator.clipboard.writeText(url).then(() => toast("链接已复制")).catch(() => toast("请手动复制链接"));
        else toast("请手动复制链接");
      }
      else if (act === "toggle-create-menu") {
        const pop = $("#createPopover");
        const wasOpen = !pop.hidden;
        hideAllPopovers();
        if (!wasOpen) {
          const r = btn.getBoundingClientRect();
          pop.style.top = `${r.bottom + 6}px`;
          pop.style.left = `${Math.max(12, r.left - 80)}px`;
          pop.hidden = false;
        }
      }
      else if (act === "toggle-book-switcher") {
        const pop = $("#bookSwitchPopover");
        const wasOpen = !pop.hidden;
        hideAllPopovers();
        if (!wasOpen) {
          pop.innerHTML = `<div class="popover-title">切换知识库</div>${state.books.map(b => `<button class="popover-item" data-action="open-book" data-book-id="${b.id}">${bookIconSvg(b.icon)}<div class="popover-item-title">${esc(b.name)}</div></button>`).join("")}`;
          const r = btn.getBoundingClientRect();
          pop.style.top = `${r.bottom + 6}px`;
          pop.style.left = `${r.left}px`;
          pop.hidden = false;
        }
      }
      else if (act === "more-menu") {
        const pop = $("#morePopover");
        const wasOpen = !pop.hidden;
        hideAllPopovers();
        pop.hidden = wasOpen;
      }
      else if (act === "toggle-theme") {
        state.theme = state.theme === "dark" ? "light" : "dark";
        hideAllPopovers();
        persist();
        applyTheme();
        toast(state.theme === "dark" ? "已切换为深色主题" : "已切换为浅色主题");
      }
      else if (act === "show-help") { hideAllPopovers(); $("#helpDialog").showModal(); }
      else if (act === "reset-demo") {
        hideAllPopovers();
        if (confirm("只重置这个 HTML 原型中的本地数据，不会影响语雀。继续吗？")) {
          state.books = clone(seedBooks);
          state.docs = clone(seedDocs);
          state.notes = clone(seedNotes);
          state.bookFavorites = new Set();
          state.noteDraft = "";
          state.noteTag = "";
          persist();
          navigate("start");
          toast("本地演示数据已重置");
        }
      }
      else if (act === "toggle-books-section") { state.booksSidebarCollapsed = !state.booksSidebarCollapsed; render(); }
      else if (act === "toggle-books-common") { state.booksCommonOpen = !state.booksCommonOpen; render(); }
      else if (act === "books-tab") { state.booksTab = btn.dataset.tab; render(); }
      else if (act === "books-layout") { state.booksLayout = btn.dataset.layout; render(); }
      else if (act === "select-collection-folder") { state.collectionFolder = btn.dataset.folderId; render(); }
      else if (act === "toggle-collection-search") { state.collectionSearchOpen = !state.collectionSearchOpen; if (!state.collectionSearchOpen) state.collectionQuery = ""; render(); }
      else if (act === "explore-tab") { state.exploreTab = btn.dataset.tab; render(); }
      else if (act === "like-feed") { const f = state.feed.find(x => x.id === btn.dataset.feedId); if (f) { f.liked = !f.liked; f.likes += f.liked ? 1 : -1; render(); } }
      else if (act === "cycle-gardens") { state.gardenOffset = (state.gardenOffset + 1) % seedGardens.length; render(); }
      else if (act === "note-view-mode") { state.noteViewMode = btn.dataset.mode; render(); }
      else if (act === "toggle-note-search") { state.noteSearchOpen = !state.noteSearchOpen; if (!state.noteSearchOpen) state.noteQuery = ""; render(); }
      else if (act === "toggle-note-pinned") { state.notePinnedOpen = !state.notePinnedOpen; render(); }
      else if (act === "publish-note") publishNote();
      else if (act === "pin-note") { const n = state.notes.find(x => x.id === btn.dataset.noteId); if (n) { n.pinned = !n.pinned; persist(); render(); } }
      else if (act === "delete-single-note") { state.notes = state.notes.filter(n => n.id !== btn.dataset.noteId); persist(); render(); toast("已删除小记"); }
      else if (act === "delete-notes") { state.notes = state.notes.filter(n => !state.selectedNotes.has(n.id)); state.selectedNotes.clear(); persist(); render(); toast("已删除所选小记"); }
      else if (act === "insert-note-todo") {
        const comp = $("#noteComposer");
        if (comp) {
          comp.focus();
          state.noteDraft = (comp.innerText ? comp.innerText + "\n" : "") + "- [ ] ";
          comp.innerText = state.noteDraft;
          const pub = $("#publishNote");
          if (pub) pub.disabled = !state.noteDraft.trim();
        }
      }
      else if (act === "format-note") {
        $("#noteComposer")?.focus();
        if (btn.dataset.command === "createLink") {
          const url = prompt("输入链接地址（https://...）");
          if (url && /^https:\/\//i.test(url)) document.execCommand("createLink", false, url);
        } else document.execCommand(btn.dataset.command, false);
        state.noteDraft = $("#noteComposer")?.innerText || "";
      }
      else if (act === "format-doc") {
        $("#docEditor")?.focus();
        let val = btn.dataset.value;
        if (btn.dataset.command === "createLink") {
          const url = prompt("输入链接地址（https://...）");
          if (!url || !/^https:\/\//i.test(url)) return;
          val = url;
        }
        if (btn.dataset.command === "quote") document.execCommand("formatBlock", false, "blockquote");
        else if (btn.dataset.command === "code") document.execCommand("formatBlock", false, "pre");
        else document.execCommand(btn.dataset.command, false, val || null);
      }
      else if (act === "toggle-group") { const k = `${btn.dataset.bookId}:${btn.dataset.groupId}`; state.collapsed.has(k) ? state.collapsed.delete(k) : state.collapsed.add(k); render(); }
      else if (act === "toggle-reader-sidebar") { if (innerWidth <= 720) state.readerMobile = !state.readerMobile; else state.readerCollapsed = !state.readerCollapsed; render(); }
      else if (act === "mobile-menu") { state.mobileNav = !state.mobileNav; render(); }
      else if (act === "toggle-outline") { state.outlineOpen = !state.outlineOpen; render(); }
      else if (act === "outline") {
        const headings = $$(".doc-body h1, .doc-body h2, .doc-body h3");
        headings[Number(btn.dataset.index)]?.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      else if (act === "locate-doc") { $(".catalog-tree .tree-row.active")?.scrollIntoView({ behavior:"smooth", block:"center" }); }
      else if (act === "use-template" || act === "fill-template") {
        const t = templates.find(x => x.id === btn.dataset.templateId);
        if (t && act === "fill-template") {
          const d = docById(state.docId);
          if (d) { d.body = t.preview; persist(); render(); }
        } else if (t) {
          if ($("#templateDialog").open) $("#templateDialog").close();
          const book = state.bookId && bookById(state.bookId) ? state.bookId : state.books[0]?.id;
          const doc = { id: uid("doc"), book, title: t.name, updated:"刚刚", type:"doc", favorite:false, folder:"all", viewed:true, liked:false, commented:false, views:0, likes:0, commentsList:[], body: t.preview };
          state.docs.unshift(doc);
          const tb = bookById(book);
          if (tb?.catalog) tb.catalog.unshift({ id: uid("node"), type:"doc", docId: doc.id });
          persist();
          state.bookId = book; state.docId = doc.id; state.view = "doc"; state.editing = true;
          render();
        }
      }
      else if (act === "reader-comment") { $("#commentInput")?.focus(); $("#commentInput")?.scrollIntoView({ behavior:"smooth", block:"center" }); }
      else if (act === "font-size") toast("正文默认字号为 15px");
      else if (act === "insert-block") toast("可直接输入正文，或使用格式工具条");
      else if (act === "present-doc") toast("演示模式沿用当前阅读视图");
      else if (act === "history-info") toast("HTML 原型仅保留当前本地版本");
      else if (act === "book-menu" || act === "catalog-settings") toast("可通过新建文档继续组织当前知识库");
      else if (act === "service-info") toast(`${btn.dataset.service}需要语雀在线服务，本原型不调用外部服务`);
      else if (act === "notifications") toast("没有新的本地通知");
      else if (act === "toast-msg") toast(btn.dataset.msg);
    });

    document.addEventListener("input", event => {
      const t = event.target;
      if (t.matches("[data-input='note-draft']")) {
        state.noteDraft = t.innerText;
        const pub = $("#publishNote");
        if (pub) pub.disabled = !state.noteDraft.trim();
      } else if (t.matches("[data-input='note-tag']")) {
        state.noteTag = t.value;
      } else if (t.matches("[data-input='note-search']")) {
        state.noteQuery = t.value;
        const stream = $("#noteStream");
        if (stream) stream.innerHTML = noteStreamSections();
      } else if (t.matches("[data-input='collection-search']")) {
        state.collectionQuery = t.value;
        render();
        const inp = $("[data-input='collection-search']");
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      } else if (t.matches("#commentInput")) {
        const rb = $("#replyDocBtn");
        if (rb) rb.disabled = !t.value.trim();
      } else if (t.matches("[data-input='doc-title']")) {
        const d = docById(t.dataset.docId);
        if (d) { d.title = t.value; const top = $(".reader-doc-title"); if (top) top.textContent = t.value || "无标题"; }
      } else if (t.matches("[data-input='doc-body']")) {
        const d = docById(t.dataset.docId);
        if (d) {
          d.body = clean(t.innerHTML);
          const wc = $("#docWordCount");
          if (wc) wc.textContent = `${textOf(d.body).replace(/\s+/g, "").length}字`;
        }
      }
    });

    document.addEventListener("change", event => {
      const t = event.target;
      if (t.matches("[data-change='type-filter']")) { state.typeFilter = t.value; render(); }
      else if (t.matches("[data-change='book-filter']")) { state.bookFilter = t.value; render(); }
      else if (t.matches("[data-change='select-note']")) { t.checked ? state.selectedNotes.add(t.dataset.noteId) : state.selectedNotes.delete(t.dataset.noteId); render(); }
    });

    document.addEventListener("keydown", event => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "j") {
        event.preventDefault();
        if (searchDialog.open) searchDialog.close(); else openSearch();
        return;
      }
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter" && event.target.matches("#noteComposer")) {
        event.preventDefault();
        publishNote();
        return;
      }
      if (event.target === searchInput && searchDialog.open) {
        const results = searchEntries();
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          state.searchIndex = Math.max(0, Math.min(results.length - 1, state.searchIndex + (event.key === "ArrowDown" ? 1 : -1)));
          renderSearchResults();
        } else if (event.key === "Enter") {
          event.preventDefault();
          const r = results[state.searchIndex];
          if (r) selectSearchResult(r.kind, r.id);
        }
      }
    });

    searchInput.addEventListener("input", () => { state.searchIndex = 0; renderSearchResults(); });
    searchDialog.addEventListener("click", e => { if (e.target === searchDialog) searchDialog.close(); });
    $("#templateDialog").addEventListener("click", e => { if (e.target === $("#templateDialog")) $("#templateDialog").close(); });
    $$(".form-dialog").forEach(d => d.addEventListener("click", e => { if (e.target === d) d.close(); }));

    $("#docForm").addEventListener("submit", event => {
      event.preventDefault();
      const title = $("#docTitleInput").value.trim();
      const book = $("#docBookInput").value;
      const type = $("#docTypeInput").value;
      if (!title || !bookById(book)) return;
      const doc = { id: uid("doc"), book, title, updated:"刚刚", type, favorite:false, folder:"all", viewed:true, liked:false, commented:false, views:0, likes:0, commentsList:[], body:"" };
      state.docs.unshift(doc);
      const tb = bookById(book);
      if (tb.catalog) tb.catalog.unshift({ id: uid("node"), type:"doc", docId: doc.id });
      persist();
      $("#docDialog").close();
      state.bookId = book; state.docId = doc.id; state.view = "doc"; state.editing = true;
      render();
      toast("文档已创建");
    });

    $("#bookForm").addEventListener("submit", event => {
      event.preventDefault();
      const name = $("#bookNameInput").value.trim();
      if (!name) return;
      const desc = $("#bookDescInput").value.trim() || "知识库就像书一样，让多篇文档结构化，方便知识的创作与沉淀";
      const book = { id: uid("book"), name, icon:"book", group:"我的知识库", pinnedHome:true, description:`👋 欢迎来到知识库\n${desc}`, statDocs:0, statWords:0, catalog:[] };
      state.books.push(book);
      persist();
      $("#bookDialog").close();
      openBook(book.id);
      toast("知识库已创建");
    });

    render();
    const hash = location.hash.match(/^#(doc|book)=(.+)$/);
    if (hash) {
      if (hash[1] === "doc" && docById(decodeURIComponent(hash[2]))) openDoc(decodeURIComponent(hash[2]));
      if (hash[1] === "book" && bookById(decodeURIComponent(hash[2]))) openBook(decodeURIComponent(hash[2]));
    }
  </script>
</body>
</html>
