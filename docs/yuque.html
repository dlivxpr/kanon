<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>语雀 · 知识工作台原型</title>
  <style>
    :root {
      --green: #00b96b;
      --green-dark: #009e5c;
      --green-soft: #eaf9f1;
      --text: #262626;
      --muted: #8a8f8d;
      --faint: #bec0bf;
      --line: #e7e9e8;
      --selected: #eff0f0;
      --soft: #f6f7f7;
      --white: #fff;
      --sidebar: 252px;
      --reader-sidebar: clamp(310px, 18vw, 389px);
      --font: "Chinese Quote", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { color: var(--text); background: var(--white); font: 14px/1.5715 var(--font); -webkit-font-smoothing: antialiased; }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; cursor: pointer; }
    button, [role="button"] { -webkit-tap-highlight-color: transparent; }
    button { border: 0; background: none; }
    input, textarea, select { color: var(--text); }
    input::placeholder, textarea::placeholder { color: var(--faint); }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [contenteditable]:focus-visible, a:focus-visible {
      outline: 2px solid var(--green); outline-offset: 2px;
    }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, p { margin-top: 0; }
    .svg-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { width: 18px; height: 18px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
    .icon.small { width: 14px; height: 14px; }
    .icon.large { width: 24px; height: 24px; }
    .logo-mark { width: 24px; height: 24px; display: inline-grid; place-items: center; flex: 0 0 auto; border-radius: 6px; background: var(--green); color: #fff; }
    .logo-mark .icon { width: 17px; height: 17px; stroke-width: 2; }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }
    .hidden { display: none !important; }
    .icon-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; padding: 0; border-radius: 5px; color: var(--muted); }
    .icon-btn:hover, .icon-btn.active { background: var(--selected); color: var(--text); }
    .icon-btn.active { color: var(--green); }
    .btn { min-height: 32px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 4px 15px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font-weight: 500; white-space: nowrap; }
    .btn:hover { border-color: #c9cecb; background: #fafbfa; }
    .btn.primary { border-color: var(--green); background: var(--green); color: #fff; }
    .btn.primary:hover { border-color: var(--green-dark); background: var(--green-dark); }
    .btn.text { border-color: transparent; background: transparent; }
    .btn.danger { color: #d4382c; }
    .btn:disabled { opacity: .42; cursor: default; }
    .input, .select, .textarea { width: 100%; min-height: 34px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; outline: 0; }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--green); }
    .textarea { min-height: 84px; resize: vertical; }
    .form-field { display: grid; gap: 7px; margin: 16px 0; }
    .form-field label { font-weight: 500; }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
    .mobile-head { display: none; }
    .dashboard-shell { min-height: 100dvh; display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); }
    .dashboard-sidebar { position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; padding: 12px 10px 10px; border-right: 1px solid #f0f1f0; background: #fafbfa; }
    .brand-row { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 5px; }
    .brand-button { display: flex; align-items: center; gap: 8px; padding: 0; font-size: 16px; font-weight: 600; }
    .brand-row .brand-actions { margin-left: auto; display: flex; align-items: center; gap: 2px; }
    .mini-plus { width: 19px; height: 19px; display: grid; place-items: center; border: 1px solid var(--muted); border-radius: 50%; color: var(--muted); }
    .mini-plus .icon { width: 12px; height: 12px; }
    .search-entry { height: 32px; display: flex; align-items: center; gap: 8px; margin: 12px 0 14px; padding: 0 9px; border-radius: 5px; background: #f0f1f1; color: var(--faint); text-align: left; }
    .search-entry span { flex: 1; }
    .search-entry kbd { color: #b0b3b1; font: 11px var(--font); }
    .side-nav { display: grid; gap: 2px; }
    .side-nav-item { width: 100%; height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 6px; text-align: left; }
    .side-nav-item:hover { background: #f1f2f2; }
    .side-nav-item.active { background: var(--selected); }
    .side-nav-item .item-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .side-section { margin-top: 14px; }
    .side-section-title { height: 32px; display: flex; align-items: center; gap: 9px; padding: 0 8px; color: var(--muted); }
    .side-section-title .item-label { flex: 1; color: var(--text); }
    .side-section-title .icon-btn { width: 25px; height: 25px; }
    .book-list { display: grid; gap: 1px; }
    .book-nav { height: 31px; padding-left: 18px; font-size: 13px; }
    .book-nav .book-icon { width: 15px; height: 18px; }
    .book-nav .lock { width: 11px; height: 11px; color: var(--faint); }
    .sidebar-bottom { margin-top: auto; padding-top: 12px; }
    .dashboard-main { min-width: 0; padding: 22px 40px 60px; }
    .page-title { margin: 0 0 22px; font-size: 18px; line-height: 28px; font-weight: 500; }
    .quick-grid { display: grid; grid-template-columns: repeat(6, minmax(170px, 1fr)); margin: 0 -40px 28px; padding: 0 40px 22px; overflow-x: auto; border-bottom: 1px solid #f0f1f0; scrollbar-width: thin; }
    .quick-item { min-height: 70px; display: flex; align-items: center; gap: 12px; padding: 8px 18px; border-right: 1px solid #f0f1f0; text-align: left; }
    .quick-item:first-child { padding-left: 0; }
    .quick-item:last-child { border-right: 0; }
    .quick-item:hover .quick-title { color: var(--green-dark); }
    .quick-symbol { width: 32px; height: 36px; display: grid; place-items: center; flex: 0 0 auto; color: #7097a5; }
    .quick-symbol.green { color: #75a892; }
    .quick-symbol.yellow { color: #e3bc54; }
    .quick-symbol.purple { color: #9892ce; }
    .quick-symbol.black { color: #363b3b; }
    .quick-title { margin: 0 0 3px; font-size: 14px; font-weight: 500; white-space: nowrap; }
    .quick-subtitle { margin: 0; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .section-heading { margin: 0 0 12px; font-size: 16px; font-weight: 500; }
    .doc-tabs { border-bottom: 1px solid var(--line); }
    .doc-tab { position: relative; padding: 5px 16px 10px 0; font-weight: 500; }
    .doc-tab.active::after { position: absolute; right: 16px; bottom: -1px; left: 0; height: 2px; background: var(--text); content: ""; }
    .document-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin: 16px 0 8px; }
    .segmented { display: inline-flex; gap: 2px; padding: 3px; border-radius: 7px; background: #f3f4f4; }
    .segmented button { min-height: 28px; padding: 4px 15px; border-radius: 5px; color: var(--muted); }
    .segmented button.active { background: #fff; color: var(--text); font-weight: 500; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .table-filters { display: flex; align-items: center; gap: 5px; }
    .filter-select { max-width: 110px; padding: 5px 7px; border: 0; background: transparent; color: var(--muted); outline: 0; }
    .doc-table { width: 100%; }
    .doc-row { display: grid; grid-template-columns: minmax(230px, 1.6fr) minmax(170px, .9fr) 130px 34px; align-items: center; min-height: 57px; border-bottom: 1px solid #f2f3f2; }
    .doc-row:hover { background: #fafbfa; }
    .doc-title-cell { min-width: 0; display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 4px; }
    .doc-type-icon { color: #6f94a8; }
    .doc-title-button { min-width: 0; overflow: hidden; padding: 0; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
    .doc-title-button:hover { color: var(--green-dark); }
    .doc-owner { min-width: 0; overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .doc-owner b { color: #6f7472; font-weight: 400; }
    .doc-time { color: var(--muted); font-size: 12px; }
    .star-button.is-favorite { color: #e5b94e; }
    .empty-state { display: grid; place-items: center; min-height: 280px; padding: 40px; color: var(--muted); text-align: center; }
    .empty-state h2 { margin: 14px 0 7px; color: var(--text); font-size: 18px; }
    .empty-state p { max-width: 380px; margin-bottom: 18px; }
    .collection-grid, .template-grid, .explore-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .collection-card, .template-card, .explore-card { min-height: 170px; padding: 22px; border: 1px solid var(--line); border-radius: 8px; background: #fff; text-align: left; }
    .collection-card:hover, .template-card:hover, .explore-card:hover { border-color: #b9c2bd; box-shadow: 0 4px 16px rgba(31,45,37,.05); }
    .collection-card .book-large-icon, .explore-card .book-large-icon { margin-bottom: 22px; }
    .collection-card h2, .template-card h2, .explore-card h2 { margin: 0 0 8px; font-size: 16px; }
    .collection-card p, .template-card p, .explore-card p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .template-card .template-emoji { display: block; margin-bottom: 18px; font-size: 30px; }
    .notes-layout { min-height: calc(100dvh - 44px); display: grid; grid-template-columns: minmax(340px, .8fr) minmax(430px, 1.35fr); gap: 34px; margin: -22px -40px -60px; }
    .note-composer { position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; padding: 22px 0 18px 40px; border-right: 1px solid #f0f1f0; }
    .composer-head { display: flex; align-items: center; gap: 10px; padding-right: 24px; }
    .composer-head .page-title { margin: 0; }
    .composer-box { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 16px; padding: 12px 24px 12px 0; }
    .composer-tools { display: flex; gap: 5px; color: var(--muted); }
    .note-input { flex: 1; min-height: 240px; padding: 20px 0; overflow-y: auto; outline: 0; white-space: pre-wrap; }
    .note-input:empty::before { color: var(--faint); content: "记你想记..."; pointer-events: none; }
    .composer-meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
    .composer-meta input { width: 120px; border: 0; outline: 0; }
    .composer-footer { display: flex; align-items: center; gap: 12px; padding: 12px 24px 0 0; }
    .composer-footer span { color: var(--muted); font-size: 11px; }
    .note-stream-wrap { min-width: 0; padding: 22px 40px 50px 0; }
    .stream-tools { display: flex; align-items: center; justify-content: flex-end; gap: 8px; height: 36px; }
    .stream-search { width: 150px; padding: 5px 8px; border: 0; border-bottom: 1px solid transparent; outline: 0; }
    .stream-search:focus { border-bottom-color: var(--green); }
    .stream-label { margin: 24px 0 12px; color: var(--muted); font-size: 12px; }
    .note-card { position: relative; margin-bottom: 18px; padding: 22px 24px; border: 1px solid #eff0ef; border-radius: 7px; background: #fff; }
    .note-card.pinned { background: #fbfcfb; }
    .note-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--muted); font-size: 11px; }
    .note-card-head .note-actions { margin-left: auto; display: flex; gap: 2px; }
    .note-card-body { color: #3c403e; line-height: 1.85; white-space: pre-wrap; overflow-wrap: anywhere; }
    .note-tag { display: inline-block; margin-top: 14px; padding: 2px 7px; border-radius: 4px; background: var(--green-soft); color: var(--green-dark); font-size: 11px; }
    .reader-shell { height: 100dvh; display: grid; grid-template-columns: var(--reader-sidebar) minmax(0, 1fr); grid-template-rows: 52px minmax(0, 1fr); overflow: hidden; }
    .reader-bookbar { display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid #f0f1f0; color: var(--muted); font-size: 12px; }
    .reader-bookbar .logo-mark { width: 20px; height: 20px; border-radius: 5px; }
    .reader-bookbar .icon { width: 14px; height: 14px; }
    .reader-docbar { min-width: 0; display: flex; align-items: center; gap: 6px; padding: 0 16px; border-bottom: 1px solid #f0f1f0; }
    .reader-doc-title { max-width: 240px; overflow: hidden; margin-right: auto; text-overflow: ellipsis; white-space: nowrap; }
    .reader-docbar .docbar-spacer { flex: 1; }
    .reader-docbar .btn { min-height: 32px; }
    .reader-sidebar { min-height: 0; display: flex; flex-direction: column; border-right: 1px solid #f0f1f0; background: #fafbfa; }
    .reader-book-title { height: 58px; display: flex; align-items: center; gap: 9px; padding: 0 16px; }
    .reader-book-title strong { flex: 1; font-size: 16px; }
    .reader-book-title .lock { width: 12px; height: 12px; color: var(--muted); }
    .reader-search { margin: 0 12px 10px 8px; }
    .reader-search .search-entry { margin: 0; }
    .reader-add { margin-left: -38px; z-index: 1; }
    .reader-home { margin: 0 8px; }
    .catalog-heading { height: 36px; display: flex; align-items: center; gap: 9px; padding: 0 16px 0 12px; }
    .catalog-heading span { flex: 1; }
    .catalog-tree { flex: 1; min-height: 0; padding: 0 8px 30px; overflow-y: auto; scrollbar-width: thin; }
    .tree-row { width: 100%; min-height: 32px; display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 5px; text-align: left; line-height: 1.45; }
    .tree-row:hover { background: #f0f1f1; }
    .tree-row.active { background: var(--selected); font-weight: 500; }
    .tree-row .tree-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-row .chevron { width: 12px; height: 12px; color: var(--muted); transition: transform .15s ease; }
    .tree-row.closed .chevron { transform: rotate(-90deg); }
    .tree-children { margin-left: 13px; padding-left: 9px; border-left: 1px solid transparent; }
    .reader-content { min-width: 0; min-height: 0; overflow-y: auto; background: #fff; scrollbar-width: thin; }
    .reader-bookbar { grid-column: 1; grid-row: 1; }
    .reader-docbar { grid-column: 2; grid-row: 1; }
    .reader-sidebar { grid-column: 1; grid-row: 2; }
    .reader-content { grid-column: 2; grid-row: 2; }
    .book-home { max-width: 960px; margin: 0 auto; padding: 42px 30px 80px; }
    .book-overview { display: flex; align-items: flex-start; gap: 16px; }
    .book-large-icon { width: 28px; height: 34px; display: inline-block; flex: 0 0 auto; border-radius: 3px 6px 6px 3px; background: var(--book-color, #88a9d7); box-shadow: inset 4px 0 rgba(255,255,255,.45); }
    .book-overview h1 { margin: 0; font-size: 30px; line-height: 38px; }
    .book-stats { display: flex; align-items: center; gap: 20px; margin-top: 7px; color: var(--muted); }
    .book-stats strong { margin-right: 4px; color: #4a4e4c; font-size: 16px; }
    .book-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .book-intro { margin: 62px 0 44px; padding-left: 0; font-size: 15px; line-height: 1.74; }
    .book-intro h2 { margin-bottom: 8px; font-size: 15px; }
    .book-intro p { margin: 0; }
    .home-catalog { font-size: 13px; }
    .home-doc-row { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 5px 0; text-align: left; }
    .home-doc-row:hover .home-doc-title { color: var(--green-dark); }
    .home-doc-title { max-width: 65%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dot-leader { flex: 1; min-width: 30px; border-bottom: 1px dashed #e2e4e3; }
    .home-doc-row time { color: var(--muted); font-size: 11px; }
    .home-group { margin: 8px 0; }
    .home-group > .tree-row { font-weight: 500; }
    .home-group .home-children { margin-left: 26px; }
    .document-scroll { min-height: 100%; padding: 24px 36px 80px; }
    .document-layout { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 800px) minmax(180px, 280px); gap: 50px; }
    .document-column { min-width: 0; }
    .document-title { margin: 0 0 24px; font-size: 36px; line-height: 1.39; font-weight: 700; overflow-wrap: anywhere; }
    .title-input { width: 100%; margin: 0 0 22px; padding: 0; border: 0; outline: 0; font-size: 36px; line-height: 1.39; font-weight: 700; }
    .doc-body { min-height: 120px; color: #303332; font-size: 15px; line-height: 1.74; letter-spacing: .2px; overflow-wrap: anywhere; }
    .doc-body h2 { margin: 36px 0 14px; font-size: 24px; line-height: 1.45; }
    .doc-body h3 { margin: 28px 0 12px; font-size: 19px; }
    .doc-body p { margin: 0 0 16px; }
    .doc-body ul, .doc-body ol { padding-left: 25px; }
    .doc-body li { margin: 7px 0; }
    .doc-body blockquote { margin: 20px 0; padding: 10px 18px; border-left: 3px solid #cdd5d0; background: #fafbfa; color: #676d69; }
    .doc-body pre { padding: 18px; overflow-x: auto; border-radius: 6px; background: #f6f8f7; font: 13px/1.7 Consolas, monospace; }
    .doc-body table { width: 100%; margin: 18px 0; border-collapse: collapse; }
    .doc-body th, .doc-body td { padding: 10px 12px; border: 1px solid var(--line); text-align: left; }
    .doc-body th { background: #f7f8f7; }
    .doc-editor { min-height: 500px; padding-bottom: 40px; outline: 0; }
    .editor-toolbar { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 2px; margin: -24px -36px 24px; padding: 8px 18px; overflow-x: auto; border-bottom: 1px solid #f0f1f0; background: rgba(255,255,255,.97); }
    .toolbar-button { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; border-radius: 5px; color: #585a5a; }
    .toolbar-button:hover { background: var(--selected); }
    .toolbar-button.text-tool { width: auto; padding: 0 8px; }
    .toolbar-separator { width: 1px; height: 18px; flex: 0 0 auto; margin: 0 6px; background: var(--line); }
    .doc-like-empty { display: grid; place-items: center; min-height: 190px; color: var(--muted); text-align: center; }
    .doc-like-empty .icon { width: 34px; height: 34px; margin-bottom: 10px; color: #e8c56f; }
    .doc-meta { display: flex; align-items: center; gap: 18px; margin: 24px 0; color: var(--muted); font-size: 11px; }
    .comment-box { margin-top: 26px; padding: 16px; border: 1px solid var(--line); border-radius: 7px; }
    .comment-input { width: 100%; min-height: 100px; border: 0; outline: 0; resize: vertical; }
    .comment-footer { display: flex; align-items: center; justify-content: space-between; color: var(--muted); }
    .document-outline { padding-top: 50px; color: var(--muted); font-size: 12px; }
    .document-outline strong { display: block; margin-bottom: 12px; color: var(--text); font-weight: 500; }
    .outline-button { display: block; width: 100%; padding: 6px 0 6px 10px; border-left: 1px solid var(--line); text-align: left; }
    .outline-button:hover { border-left-color: var(--green); color: var(--green-dark); }
    .template-empty { margin-top: 36px; }
    .template-empty > p { color: var(--faint); }
    .template-empty-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 22px; }
    .template-empty-card { min-height: 84px; padding: 14px; border: 1px solid var(--line); border-radius: 6px; text-align: left; }
    .template-empty-card:hover { border-color: var(--green); }
    .template-empty-card span { display: block; margin-bottom: 8px; font-size: 22px; }
    .template-empty-card small { color: var(--muted); }
    .reader-collapsed { grid-template-columns: 0 minmax(0, 1fr); }
    .reader-collapsed .reader-bookbar, .reader-collapsed .reader-sidebar { visibility: hidden; overflow: hidden; }
    dialog { color: var(--text); font-family: var(--font); }
    dialog::backdrop { background: rgba(31,37,34,.28); backdrop-filter: blur(2px); }
    .form-dialog { width: min(480px, calc(100vw - 32px)); padding: 26px; border: 1px solid var(--line); border-radius: 10px; background: #fff; box-shadow: 0 20px 70px rgba(0,0,0,.18); }
    .form-dialog h2 { margin: 0 0 8px; font-size: 20px; }
    .form-dialog > p { color: var(--muted); }
    .search-dialog { width: min(650px, calc(100vw - 32px)); max-height: min(620px, calc(100dvh - 90px)); margin-top: 10dvh; padding: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: #fff; box-shadow: 0 22px 80px rgba(0,0,0,.22); }
    .search-box { display: flex; align-items: center; gap: 10px; padding: 17px 18px; border-bottom: 1px solid var(--line); }
    .search-box input { flex: 1; min-width: 0; border: 0; outline: 0; font-size: 16px; }
    .search-box kbd { padding: 2px 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); font: 11px var(--font); }
    .search-results { max-height: 450px; padding: 9px; overflow-y: auto; }
    .search-result { width: 100%; display: flex; align-items: center; gap: 11px; padding: 11px 12px; border-radius: 6px; text-align: left; }
    .search-result:hover, .search-result.selected { background: var(--selected); }
    .search-result-content { flex: 1; min-width: 0; }

    .search-empty { padding: 34px 16px; color: var(--muted); text-align: center; }
    .share-link { display: flex; gap: 8px; margin-top: 18px; }

    .popover { position: fixed; z-index: 30; bottom: 48px; left: 12px; min-width: 178px; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: #fff; box-shadow: 0 8px 30px rgba(0,0,0,.12); }
    .popover[hidden] { display: none; }
    .popover button { width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 5px; text-align: left; }
    .popover button:hover { background: var(--selected); }
    .toast { position: fixed; z-index: 60; bottom: 28px; left: 50%; max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 6px; background: #262626; color: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.2); font-size: 12px; opacity: 0; pointer-events: none; transform: translate(-50%, 8px); transition: .16s ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 1250px) {
      :root { --sidebar: 224px; }
      .dashboard-main { padding-inline: 28px; }
      .quick-grid { margin-inline: -28px; padding-inline: 28px; }
      .collection-grid, .template-grid, .explore-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .notes-layout { margin-inline: -28px; grid-template-columns: minmax(320px,.85fr) minmax(380px,1.15fr); }
      .note-composer { padding-left: 28px; }
      .note-stream-wrap { padding-right: 28px; }
      .document-layout { grid-template-columns: minmax(0,1fr) 190px; gap: 28px; }
    }
    @media (max-width: 900px) {
      :root { --reader-sidebar: 290px; }
      .document-outline { display: none; }
      .document-layout { display: block; max-width: 800px; }
      .doc-row { grid-template-columns: minmax(220px,1fr) 120px 32px; }
      .doc-owner { display: none; }
      .notes-layout { grid-template-columns: minmax(290px,.9fr) minmax(330px,1.1fr); gap: 22px; }
      .reader-docbar .optional { display: none; }
    }
    @media (max-width: 720px) {
      .mobile-head { height: 50px; display: flex; align-items: center; gap: 8px; margin: -12px -12px 16px; border-bottom: 1px solid var(--line); }

      .dashboard-shell { display: block; }
      .dashboard-sidebar { position: fixed; z-index: 25; top: 0; bottom: 0; left: 0; width: 250px; transform: translateX(-102%); transition: transform .18s ease; box-shadow: 8px 0 30px rgba(0,0,0,.1); }
      .nav-open .dashboard-sidebar { transform: translateX(0); }
      .dashboard-main { padding: 12px 16px 40px; }
      .dashboard-main > .page-title { display: none; }
      .quick-grid { margin-inline: -16px; padding-inline: 16px; scrollbar-width: none; }
      .quick-grid::-webkit-scrollbar { display: none; }
      .document-toolbar { align-items: flex-start; flex-direction: column; }
      .segmented { width: 100%; overflow-x: auto; }
      .segmented button { flex: 1; padding-inline: 9px; }
      .table-filters { width: 100%; }
      .doc-row { grid-template-columns: minmax(180px,1fr) 32px; }
      .doc-time { display: none; }
      .collection-grid, .template-grid, .explore-grid { grid-template-columns: 1fr; }
      .notes-layout { display: block; margin: -12px -16px -40px; }

      .composer-box { min-height: 330px; padding-right: 0; }
      .note-stream-wrap { padding: 20px 16px 40px; }
      .reader-shell, .reader-collapsed { grid-template-columns: 0 minmax(0,1fr); }
      .reader-bookbar, .reader-sidebar { visibility: hidden; overflow: hidden; }
      .reader-mobile-open { grid-template-columns: minmax(0,1fr); }
      .reader-mobile-open .reader-bookbar, .reader-mobile-open .reader-sidebar { position: relative; z-index: 20; visibility: visible; }
      .reader-mobile-open .reader-sidebar { height: calc(100dvh - 52px); }
      .reader-mobile-open .reader-docbar, .reader-mobile-open .reader-content { display: none; }
      .reader-docbar { padding-inline: 8px; }

      .document-scroll { padding: 20px 20px 60px; }

      .book-intro { margin-top: 38px; }
      .home-doc-title { max-width: 52%; }
      .template-empty-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
    }

    function readerDocbar(book) {
      const doc = state.view === "doc" ? docById(state.docId) : null;
      return `<div class="reader-docbar"><button class="icon-btn" data-action="toggle-reader-sidebar" aria-label="切换目录">${icon("panel")}</button>${doc ? `<span class="reader-doc-title">${esc(doc.title)}</span>` : `<span class="docbar-spacer"></span>`}${doc ? `<button class="icon-btn optional" data-action="service-info" data-service="AI 阅读助手" aria-label="AI">${icon("ai")}</button><button class="icon-btn optional ${doc.favorite ? "active" : ""}" data-action="favorite-doc" data-doc-id="${doc.id}" aria-label="收藏">${icon("star")}</button><button class="icon-btn optional" data-action="history-info" aria-label="历史版本">${icon("history")}</button><button class="icon-btn optional" data-action="share-doc" data-doc-id="${doc.id}" aria-label="协作">${icon("users")}</button><button class="icon-btn optional" data-action="present-doc" aria-label="演示">${icon("present")}</button><button class="btn" data-action="share-doc" data-doc-id="${doc.id}">分享</button><button class="btn ${state.editing ? "" : "primary"}" data-action="${state.editing ? "update-doc" : "edit-doc"}" data-doc-id="${doc.id}">${state.editing ? "更新" : "编辑"}</button>` : ""}<button class="icon-btn" data-action="reader-comment" aria-label="评论">${icon("comment")}</button><button class="icon-btn" data-action="go-start" aria-label="返回工作台">${icon("close")}</button></div>`;
    }
    function bookHome(book) {
      const docs = state.docs.filter(doc => doc.book === book.id);
      const description = esc(book.description).replace(/\n/g,"<br>");
      return `<div class="book-home"><div class="book-overview"><span class="book-large-icon" style="--book-color:${esc(book.color)}"></span><div><h1>${esc(book.name)}</h1><div class="book-stats"><span><strong>${(book.statDocs ?? docs.length) + (book.catalog ? Math.max(0,docs.length - seedDocs.filter(doc => doc.book === book.id).length) : 0)}</strong>文档</span><span><strong>${book.statWords || textOf(docs.map(doc => doc.body).join("")).length}</strong>字</span><span class="muted">${icon("info","small")}</span></div></div><div class="book-actions"><button class="btn text ${state.bookFavorites.has(book.id) ? "active" : ""}" data-action="favorite-book" data-book-id="${book.id}">${icon("star","small")}${state.bookFavorites.has(book.id) ? "已收藏" : "收藏"}</button><button class="btn" data-action="share-book" data-book-id="${book.id}">分享</button><button class="icon-btn" data-action="book-menu" aria-label="更多">${icon("more")}</button></div></div><div class="book-intro"><h2>${description.split("<br>")[0]}</h2><p>${description.split("<br>").slice(1).join("<br>")}</p></div><div class="home-catalog">${treeNodes(catalogFor(book),book.id,true) || `<div class="empty-state"><div><h2>从第一篇文档开始</h2><p>新建文档后，它会出现在知识库目录中。</p><button class="btn primary" data-action="new-doc">新建文档</button></div></div>`}</div></div>`;
    }
    function outline(body) {
      const template = document.createElement("template"); template.innerHTML = clean(body);
      const headings = [...template.content.querySelectorAll("h1,h2,h3")];
      if (!headings.length) return "";
      return `<aside class="document-outline"><strong>大纲</strong>${headings.map((heading,index) => `<button class="outline-button" data-action="outline" data-index="${index}">${esc(heading.textContent)}</button>`).join("")}</aside>`;
    }
    function editorToolbar() {
      const tools = [["bold","bold","加粗"],["italic","italic","斜体"],["underline","underline","下划线"],["list","insertUnorderedList","无序列表"],["ordered","insertOrderedList","有序列表"],["quote","quote","引用"],["code","code","代码"],["link","createLink","链接"]];
      return `<div class="editor-toolbar"><button class="toolbar-button" data-action="insert-block" aria-label="插入">${icon("plus","small")}</button><span class="toolbar-separator"></span><button class="toolbar-button text-tool" data-action="format-doc" data-command="formatBlock" data-value="p">正文 ${icon("chevron","small")}</button><button class="toolbar-button text-tool" data-action="font-size">15px ${icon("chevron","small")}</button>${tools.map(([glyph,command,label]) => `<button class="toolbar-button" data-action="format-doc" data-command="${command}" aria-label="${label}">${icon(glyph,"small")}</button>`).join("")}<span class="toolbar-separator"></span><button class="toolbar-button" data-action="format-doc" data-command="formatBlock" data-value="h2" aria-label="二级标题"><strong>H2</strong></button><button class="toolbar-button" data-action="format-doc" data-command="removeFormat" aria-label="清除格式">${icon("close","small")}</button></div>`;
    }
    function templateEmpty() {
      return `<div class="template-empty"><p>直接输入正文，也可选择一个模板：</p><div class="template-empty-grid">${templates.slice(0,6).map(template => `<button class="template-empty-card" data-action="fill-template" data-template-id="${template.id}"><span>${template.icon}</span><strong>${esc(template.name)}</strong><small>${esc(template.source)}</small></button>`).join("")}</div></div>`;
    }
    function documentView(doc) {
      if (state.editing) {
        return `<div class="document-scroll">${editorToolbar()}<div class="document-layout"><article class="document-column"><input class="title-input" id="editorTitle" value="${esc(doc.title)}" data-input="doc-title" data-doc-id="${doc.id}" placeholder="请输入标题" aria-label="文档标题"><div class="doc-body doc-editor" id="docEditor" contenteditable="true" data-input="doc-body" data-doc-id="${doc.id}" aria-label="文档正文">${clean(doc.body)}</div>${doc.body ? "" : templateEmpty()}</article></div></div>`;
      }
      return `<div class="document-scroll"><div class="document-layout"><article class="document-column"><h1 class="document-title">${esc(doc.title)}</h1><div class="doc-body">${clean(doc.body)}</div>${doc.body ? "" : `<button class="doc-like-empty" data-action="like-doc" data-doc-id="${doc.id}">${icon("heart")}<span>${doc.liked ? "感谢你的点赞" : "若有收获，就点个赞吧"}</span></button>`}<div class="doc-meta"><span>${icon("clock","small")} ${esc(doc.updated)}</span><button class="icon-btn ${doc.liked ? "active" : ""}" data-action="like-doc" data-doc-id="${doc.id}" aria-label="点赞">${icon("heart","small")}</button><span>${doc.liked ? 1 : 0}</span><span>${icon("comment","small")} ${doc.comments || 0}</span></div><div class="comment-box" id="commentBox"><textarea class="comment-input" id="commentInput" placeholder="写下你的评论..." aria-label="评论"></textarea><div class="comment-footer"><span>${icon("bold","small")} ${icon("list","small")} ${icon("link","small")}</span><button class="btn primary" data-action="reply-doc" data-doc-id="${doc.id}">回复</button></div></div></article>${outline(doc.body)}</div></div>`;
    }
    function readerView() {
      const book = bookById(state.bookId) || state.books[0];
      if (!book) return dashboardView();
      const content = state.view === "doc" && docById(state.docId) ? documentView(docById(state.docId)) : bookHome(book);
      return `<div class="reader-shell ${state.readerCollapsed ? "reader-collapsed" : ""} ${state.readerMobile ? "reader-mobile-open" : ""}"><div class="reader-bookbar"><button class="brand-button" data-action="go-start">${logo()}</button>${icon("right","small")}<span>个人知识库</span></div>${readerDocbar(book)}${readerSidebar(book)}<main class="reader-content" id="readerContent">${content}</main></div>`;
    }
    function render() {
      app.innerHTML = ["book","doc"].includes(state.view) ? readerView() : dashboardView();
      document.title = `${state.view === "doc" && docById(state.docId) ? docById(state.docId).title : state.view === "book" ? bookName(state.bookId) : "工作台"} · 语雀原型`;
    }
    function openDoc(id) {
      const doc = docById(id); if (!doc) return;
      state.bookId = doc.book; state.docId = doc.id; state.view = "doc"; state.editing = false; state.readerMobile = false;
      render();
    }
    function openBook(id) {
      if (!bookById(id)) return;
      state.bookId = id; state.docId = null; state.view = "book"; state.editing = false; state.mobileNav = false; state.readerMobile = false;
      render();
    }
    function openDocDialog() {
      $("#docBookInput").innerHTML = state.books.map(book => `<option value="${book.id}" ${book.id === state.bookId ? "selected" : ""}>${esc(book.name)}</option>`).join("");
      $("#docTitleInput").value = ""; $("#docTypeInput").value = "doc";
      $("#docDialog").showModal(); requestAnimationFrame(() => $("#docTitleInput").focus());
    }
    function openSearch() {
      $("#morePopover").hidden = true; searchInput.value = ""; state.searchIndex = 0;
      renderSearchResults(); searchDialog.showModal(); requestAnimationFrame(() => searchInput.focus());
    }
    function searchResults() {
      const query = searchInput.value.trim();
      if (query.startsWith(">")) return [
        {kind:"command",id:"new-doc",title:"新建文档",meta:"命令",icon:"plus"},
        {kind:"command",id:"new-book",title:"新建知识库",meta:"命令",icon:"book"},
        {kind:"command",id:"notes",title:"前往小记",meta:"命令",icon:"note"},
        {kind:"command",id:"templates",title:"打开模板中心",meta:"命令",icon:"template"}
      ];
      const normalized = query.toLowerCase();
      if (!normalized) return state.docs.slice(0,6).map(doc => ({kind:"doc",id:doc.id,title:doc.title,meta:`文档 · ${bookName(doc.book)}`,icon:typeIcon(doc.type)}));
      return [
        ...state.books.filter(book => `${book.name} ${book.description}`.toLowerCase().includes(normalized)).map(book => ({kind:"book",id:book.id,title:book.name,meta:"知识库",icon:"book"})),
        ...state.docs.filter(doc => `${doc.title} ${textOf(doc.body)}`.toLowerCase().includes(normalized)).map(doc => ({kind:"doc",id:doc.id,title:doc.title,meta:`${typeName(doc.type)} · ${bookName(doc.book)}`,icon:typeIcon(doc.type)})),
        ...state.notes.filter(note => `${note.body} ${note.tag}`.toLowerCase().includes(normalized)).map(note => ({kind:"note",id:note.id,title:note.body.split("\n")[0],meta:"小记",icon:"note"}))
      ].slice(0,14);
    }
    function renderSearchResults() {
      const results = searchResults(); state.searchIndex = Math.min(state.searchIndex,Math.max(0,results.length - 1));
      $("#searchResults").innerHTML = results.length ? results.map((result,index) => `<button class="search-result ${index === state.searchIndex ? "selected" : ""}" data-action="search-result" data-kind="${result.kind}" data-id="${result.id}">${icon(result.icon)}<span class="search-result-content"><span class="search-result-title">${esc(result.title)}</span><span class="search-result-meta">${esc(result.meta)}</span></span>${icon("right","small")}</button>`).join("") : `<div class="search-empty">没有找到匹配的内容</div>`;
    }
    function selectSearchResult(kind,id) {
      searchDialog.close();
      if (kind === "doc") openDoc(id);
      else if (kind === "book") openBook(id);
      else if (kind === "note") { const note = state.notes.find(item => item.id === id); state.noteQuery = note ? note.body.split("\n")[0] : ""; navigate("notes"); }
      else if (kind === "command") {
        if (id === "new-doc") openDocDialog();
        else if (id === "new-book") $("#bookDialog").showModal();
        else navigate(id);
      }
    }
    function share(url) {
      $("#shareInput").value = url;
      $("#shareDialog").showModal();
    }
    function publishNote() {
      const body = state.noteDraft.trim(); if (!body) return;
      state.notes.unshift({id:uid("note"),body,tag:state.noteTag.trim(),updated:"刚刚",pinned:false});
      state.noteDraft = ""; state.noteTag = ""; persist(); render(); toast("小记已发布");
    }
    document.addEventListener("click", event => {
      const button = event.target.closest("[data-action]");
      if (!button) { if (!event.target.closest("#morePopover")) $("#morePopover").hidden = true; return; }
      const action = button.dataset.action;
      if (action === "go-start") navigate("start");
      else if (action === "dashboard-view") navigate(button.dataset.view);
      else if (action === "open-book") openBook(button.dataset.bookId);
      else if (action === "open-doc") openDoc(button.dataset.docId);
      else if (action === "new-doc") openDocDialog();
      else if (action === "new-book") { $("#bookNameInput").value = ""; $("#bookDescInput").value = ""; $("#bookDialog").showModal(); requestAnimationFrame(() => $("#bookNameInput").focus()); }
      else if (action === "close-dialog") $("#" + button.dataset.dialog).close();
      else if (action === "open-search") openSearch();
      else if (action === "search-result") selectSearchResult(button.dataset.kind,button.dataset.id);
      else if (action === "activity-filter") { state.filter = button.dataset.filter; render(); }
      else if (action === "favorite-doc") { const doc = docById(button.dataset.docId); if (doc) { doc.favorite = !doc.favorite; persist(); render(); toast(doc.favorite ? "已收藏文档" : "已取消收藏"); } }
      else if (action === "favorite-book") { const id = button.dataset.bookId; state.bookFavorites.has(id) ? state.bookFavorites.delete(id) : state.bookFavorites.add(id); persist(); render(); }
      else if (action === "edit-doc") { state.editing = true; render(); }
      else if (action === "update-doc") { const doc = docById(button.dataset.docId); if (doc) { doc.updated = "刚刚"; doc.title = $("#editorTitle")?.value.trim() || "无标题"; doc.body = clean($("#docEditor")?.innerHTML || ""); doc.viewed = true; } state.editing = false; persist(); render(); toast("文档已更新"); }
      else if (action === "like-doc") { const doc = docById(button.dataset.docId); if (doc) { doc.liked = !doc.liked; persist(); render(); } }
      else if (action === "reply-doc") { const doc = docById(button.dataset.docId); const input = $("#commentInput"); if (doc && input?.value.trim()) { doc.comments = (doc.comments || 0) + 1; doc.commented = true; input.value = ""; persist(); render(); toast("评论已发布"); } else toast("先写下评论内容"); }
      else if (action === "share-doc") share(`${location.href.split("#")[0]}#doc=${encodeURIComponent(button.dataset.docId)}`);
      else if (action === "share-book") share(`${location.href.split("#")[0]}#book=${encodeURIComponent(button.dataset.bookId)}`);
      else if (action === "copy-share") { const input = $("#shareInput"); input.select(); if (navigator.clipboard?.writeText) navigator.clipboard.writeText(input.value).then(() => toast("链接已复制")).catch(() => toast("链接已选中，请手动复制")); else toast("链接已选中，请手动复制"); }
      else if (action === "toggle-group") { const key = `${button.dataset.bookId}:${button.dataset.groupId}`; state.collapsed.has(key) ? state.collapsed.delete(key) : state.collapsed.add(key); render(); }
      else if (action === "toggle-reader-sidebar") { if (innerWidth <= 720) state.readerMobile = !state.readerMobile; else state.readerCollapsed = !state.readerCollapsed; render(); }
      else if (action === "mobile-menu") { state.mobileNav = !state.mobileNav; render(); }
      else if (action === "more-menu") { const popover = $("#morePopover"); popover.hidden = !popover.hidden; }
      else if (action === "show-help") { $("#morePopover").hidden = true; $("#helpDialog").showModal(); }
      else if (action === "reset-demo") { $("#morePopover").hidden = true; if (confirm("只重置这个 HTML 原型中的本地数据，不会影响语雀。继续吗？")) { state.books = clone(seedBooks); state.docs = clone(seedDocs); state.notes = clone(seedNotes); state.bookFavorites = new Set(); state.noteDraft = ""; state.noteTag = ""; persist(); navigate("start"); toast("本地演示数据已重置"); } }
      else if (action === "publish-note") publishNote();
      else if (action === "pin-note") { const note = state.notes.find(item => item.id === button.dataset.noteId); if (note) { note.pinned = !note.pinned; persist(); render(); } }
      else if (action === "delete-notes") { state.notes = state.notes.filter(note => !state.selectedNotes.has(note.id)); state.selectedNotes.clear(); persist(); render(); toast("已删除所选小记"); }
      else if (action === "format-note") { $("#noteComposer")?.focus(); if (button.dataset.command === "createLink") { const url = prompt("输入链接地址（https://...）"); if (url && /^https:\/\//i.test(url)) document.execCommand("createLink",false,url); } else document.execCommand(button.dataset.command,false); state.noteDraft = $("#noteComposer")?.innerText || ""; }
      else if (action === "format-doc") { $("#docEditor")?.focus(); let value = button.dataset.value; if (button.dataset.command === "createLink") { const url = prompt("输入链接地址（https://...）"); if (!url || !/^https:\/\//i.test(url)) return; value = url; } if (button.dataset.command === "quote") document.execCommand("formatBlock",false,"blockquote"); else if (button.dataset.command === "code") document.execCommand("formatBlock",false,"pre"); else document.execCommand(button.dataset.command,false,value || null); }
      else if (action === "font-size") toast("正文使用语雀默认的 15px 字号");
      else if (action === "insert-block") toast("可直接输入正文，或使用右侧格式工具");
      else if (action === "use-template" || action === "fill-template") { const template = templates.find(item => item.id === button.dataset.templateId); if (template && action === "fill-template") { const doc = docById(state.docId); if (doc) { doc.body = template.body; persist(); render(); } } else if (template) { const book = state.bookId && bookById(state.bookId) ? state.bookId : state.books[0]?.id; const doc = {id:uid("doc"),book:book,title:template.name,updated:"刚刚",type:"doc",favorite:false,viewed:true,liked:false,commented:false,comments:0,body:template.body}; state.docs.unshift(doc); const targetBook = bookById(book); if (targetBook?.catalog) targetBook.catalog.unshift({id:uid("node"),type:"doc",docId:doc.id}); persist(); state.bookId = book; state.docId = doc.id; state.view = "doc"; state.editing = true; render(); } }
      else if (action === "outline") { const headings = $$(".doc-body h1,.doc-body h2,.doc-body h3"); headings[Number(button.dataset.index)]?.scrollIntoView({behavior:"smooth",block:"start"}); }
      else if (action === "reader-comment") { $("#commentInput")?.focus(); if (!$("#commentInput")) toast("打开一篇文档后可评论"); }
      else if (action === "present-doc") toast("演示模式沿用当前阅读视图");
      else if (action === "history-info") toast("HTML 原型仅保留当前本地版本");
      else if (action === "book-menu" || action === "catalog-settings") toast("可通过新建文档继续组织当前知识库");
      else if (action === "service-info") toast(`${button.dataset.service}需要语雀在线服务，本原型不调用外部服务`);
      else if (action === "notifications") toast("没有新的本地通知");
    });
    document.addEventListener("input", event => {
      const target = event.target;
      if (target.matches("[data-input='note-draft']")) { state.noteDraft = target.innerText; const publish = $("#publishNote"); if (publish) publish.disabled = !state.noteDraft.trim(); }
      else if (target.matches("[data-input='note-tag']")) state.noteTag = target.value;
      else if (target.matches("[data-input='note-search']")) { state.noteQuery = target.value; const stream = $("#noteStream"); if (stream) stream.innerHTML = noteItems(); }
      else if (target.matches("[data-input='doc-title']")) { const doc = docById(target.dataset.docId); if (doc) { doc.title = target.value; const top = $(".reader-doc-title"); if (top) top.textContent = target.value || "无标题"; } }
      else if (target.matches("[data-input='doc-body']")) { const doc = docById(target.dataset.docId); if (doc) doc.body = clean(target.innerHTML); }
    });
    document.addEventListener("change", event => {
      const target = event.target;
      if (target.matches("[data-change='type-filter']")) { state.typeFilter = target.value; render(); }
      else if (target.matches("[data-change='book-filter']")) { state.bookFilter = target.value; render(); }
      else if (target.matches("[data-change='select-note']")) { target.checked ? state.selectedNotes.add(target.dataset.noteId) : state.selectedNotes.delete(target.dataset.noteId); render(); }
    });
    document.addEventListener("keydown", event => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "j") { event.preventDefault(); if (searchDialog.open) searchDialog.close(); else openSearch(); return; }
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter" && event.target.matches("#noteComposer")) { event.preventDefault(); publishNote(); return; }
      if (event.target === searchInput && searchDialog.open) {
        const results = searchResults();
        if (event.key === "ArrowDown" || event.key === "ArrowUp") { event.preventDefault(); const direction = event.key === "ArrowDown" ? 1 : -1; state.searchIndex = Math.max(0,Math.min(results.length - 1,state.searchIndex + direction)); renderSearchResults(); }
        else if (event.key === "Enter") { event.preventDefault(); const result = results[state.searchIndex]; if (result) selectSearchResult(result.kind,result.id); }
      }
    });
    searchInput.addEventListener("input", () => { state.searchIndex = 0; renderSearchResults(); });
    searchDialog.addEventListener("click", event => { if (event.target === searchDialog) searchDialog.close(); });
    $$(".form-dialog").forEach(dialog => dialog.addEventListener("click", event => { if (event.target === dialog) dialog.close(); }));
    $("#docForm").addEventListener("submit", event => {
      event.preventDefault();
      const title = $("#docTitleInput").value.trim(), book = $("#docBookInput").value, type = $("#docTypeInput").value;
      if (!title || !bookById(book)) return;
      const doc = {id:uid("doc"),book,title,updated:"刚刚",type,favorite:false,viewed:true,liked:false,commented:false,comments:0,body:""};
      state.docs.unshift(doc); const targetBook = bookById(book); if (targetBook.catalog) targetBook.catalog.unshift({id:uid("node"),type:"doc",docId:doc.id});
      persist(); $("#docDialog").close(); state.bookId = book; state.docId = doc.id; state.view = "doc"; state.editing = true; render(); toast("文档已创建");
    });
    $("#bookForm").addEventListener("submit", event => {
      event.preventDefault();
      const name = $("#bookNameInput").value.trim(); if (!name) return;
      const description = $("#bookDescInput").value.trim() || "知识库就像书一样，让多篇文档结构化，方便知识的创作与沉淀";
      const book = {id:uid("book"),name,color:"#8ea8d8",description:`👋 欢迎来到知识库\n${description}`,statDocs:0,statWords:0,catalog:[]};
      state.books.push(book); persist(); $("#bookDialog").close(); openBook(book.id); toast("知识库已创建");
    });
    render();
    const hash = location.hash.match(/^#(doc|book)=(.+)$/);
    if (hash) { if (hash[1] === "doc" && docById(decodeURIComponent(hash[2]))) openDoc(decodeURIComponent(hash[2])); if (hash[1] === "book" && bookById(decodeURIComponent(hash[2]))) openBook(decodeURIComponent(hash[2])); }
  </script>
</body>
</html>
